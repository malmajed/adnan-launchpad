{id:'l03',track:'launch',title:'A CV that gets interviews',mins:45,blurb:'How screeners read a CV in seconds, and a line-by-line rebuild of yours.',
 lab:{key:'cvfix',name:'CV workbench',intro:'Your own CV bullets, diagnosed. Rewrite them until they pass four checks.'},
 cards:[
  {h:'Your CV gets seconds, not minutes',b:`<p>A recruiter skims for: the <b>role you want</b>, the <b>degree</b>, <b>relevant experience</b> and <b>proof</b> (numbers, named tools, links). Many large employers also use an <b>applicant tracking system</b> that filters on keywords from the advert. Clear headings and the advert's own words get you through both.</p>`},
  {h:'The bullet formula',b:`<p><b>Action verb + what you did + how + result.</b> Example: <i>"Characterised thermal behaviour of 12 LiDAR units from 25–60 °C and proposed a chassis change that cut peak temperature by ~8 °C."</i> Only use numbers that are true; if you do not know one, measure it or estimate honestly.</p>`},
  {h:'Three problems in your current CV',b:`<ul><li><b>A copy-paste error:</b> the heart-rate project's first bullet describes your LiDAR co-op work. A screener will notice and may question attention to detail.</li><li><b>No numbers</b> anywhere: no GPA, no scale, no results.</li><li><b>Under-selling verbs:</b> "managed", "basic", "assisted" for work you actually engineered.</li></ul>`},
  {h:'Structure for a graduate engineer',b:`<p>Header (name, phone, email, <b>full</b> LinkedIn and GitHub URLs) → 3-line summary naming the role you want → Education (with GPA if strong and relevant courses) → <b>Experience</b> (the co-op) → Projects → Skills → Languages. One page. Consistent dates and headings. Your Japanese is a differentiator: keep it visible.</p>`},
  {h:'One CV per path',b:`<p>Keep a master CV, then tailor a version for each target path: the perception version leads with the LiDAR work; the embedded version leads with C/C++, the ESP32 project and buses; the test version leads with the thermal and power testing. Same facts, different order and emphasis.</p>`}],
 quiz:[
  {q:'An applicant tracking system mainly…',o:['Writes your CV','Filters CVs by keywords and structure before a human reads them','Interviews you','Checks your GPA with the university'],a:1,w:'Use the advert\'s own terms and standard headings.'},
  {q:'Which bullet is strongest?',o:['Responsible for testing LiDAR units.','Assisted with thermal tests.','Characterised thermal behaviour of 12 LiDAR units and proposed a chassis change that cut peak temperature by ~8 °C.','Did many tests in different environments and presented.'],a:2,w:'Verb, scope, method and result.'},
  {q:'What is the risk of the copy-paste error in the heart-rate project?',o:['None','It suggests weak attention to detail, a key engineering trait','It improves keyword matching','It shows versatility'],a:1,w:'Screeners treat small errors as signals.'},
  {q:'The "Training" section on a graduate CV should be titled…',o:['Hobbies','Experience','References','Other'],a:1,w:'A co-op is real experience; call it that.'},
  {q:'If you do not know the exact number for a result, you should…',o:['Invent a convincing figure','Measure it, or give an honest estimate marked as approximate','Leave the bullet out entirely','Write "many"'],a:1,w:'Never invent figures; interviewers will ask about them.'},
  {q:'Why tailor a CV version per path?',o:['To hide facts','To put the most relevant evidence first for each audience','Because employers require three CVs','It is not useful'],a:1,w:'Same facts, different emphasis.'}],
 srs:[{q:'Bullet formula?',a:'Action verb + what + how + result (with a true number).'},{q:'Four checks for a bullet?',a:'Verb first, has a number, under two lines, not repeated.'},{q:'Graduate CV order?',a:'Header, summary, education, experience, projects, skills, languages.'},{q:'Why tailor per path?',a:'Lead with the evidence that matters to that audience.'}],
 read:[{t:'Applicant tracking systems',s:'Wikipedia overview',u:WIKI('Applicant_tracking_system')},{t:'Engineering resume examples and advice',s:'Search university career-centre guides',u:GS('engineering resume bullet points action verbs university career center')},{t:'Your CV workbench',s:'Open the lab in this mission',u:'#/m/l03/lab'}]},

{id:'l04',track:'launch',title:'LinkedIn and a GitHub portfolio',mins:35,blurb:'Recruiters search before they advertise. Make sure they find you, and that your projects prove what your CV claims.',
 lab:{key:'profile',name:'Headline builder and profile checklist',intro:'Build a headline recruiters search for, and work through a ten-point profile checklist.'},
 cards:[
  {h:'Recruiters search, then call',b:`<p>Many technical roles in the region are filled by recruiters searching LinkedIn for keywords and locations before, or instead of, advertising. If your headline says only "Electrical Engineering Graduate", you are invisible to a search for "embedded engineer Riyadh".</p>`},
  {h:'The headline is your search result',b:`<p>Formula: <b>target role | 2–3 strengths | proof</b>. For example: <i>Embedded & Perception Engineer | C/C++ · LiDAR · ESP32 | KSU EE, LiDAR co-op</i>. Under 120 characters. It should match the words in the jobs you want.</p>`},
  {h:'GitHub is your evidence',b:`<p>For hardware and embedded roles, a clean repository is rare among graduates and memorable. Your touchless terminal is ideal: code, a <b>README</b> with what it does and why, a wiring diagram, a photo or GIF of it working, and what you would improve. A recruiter does not read code; an engineer interviewing you will.</p>`},
  {h:'Signals of seriousness',b:`<ul><li>A clear photo and an "About" in the first person, ending with what you are looking for.</li><li>Skills pinned to match target roles.</li><li>Posts: a short write-up of a project or something you learned, every few weeks.</li><li>Connections at your target employers, with a short note when you connect.</li></ul>`},
  {h:'Consistency across documents',b:`<p>Your CV, LinkedIn and GitHub tell one story with the same facts and dates. Inconsistencies (a different job title, a missing project) make screeners hesitate.</p>`}],
 quiz:[
  {q:'Why does the LinkedIn headline matter so much?',o:['It is printed on your degree','Recruiter searches match on it, so it decides whether you appear','It sets your salary','It is not visible'],a:1,w:'The headline is your search result.'},
  {q:'Which headline is strongest for Adnan\'s targets?',o:['Student','Electrical Engineering Graduate','Embedded & Perception Engineer | C/C++ · LiDAR · ESP32 | KSU EE','Looking for any opportunity'],a:2,w:'Target role, strengths and proof, in searchable words.'},
  {q:'What makes a GitHub project useful to an interviewer?',o:['Many empty repositories','A README explaining purpose and design, a diagram, a demo, and clean code','Private repositories only','Only stars'],a:1,w:'Make it easy to understand what you built and how.'},
  {q:'The "About" section should end with…',o:['A quote','What you are looking for','Your national ID','Your hobbies list'],a:1,w:'Tell readers how to help you.'},
  {q:'Why keep CV, LinkedIn and GitHub consistent?',o:['Design reasons only','Inconsistent facts make screeners hesitate','Required by law','It is not important'],a:1,w:'One story, the same facts.'},
  {q:'How often is a reasonable cadence for a short professional post?',o:['Every hour','Every few weeks','Never','Only after getting a job'],a:1,w:'Regular but light: it signals curiosity and keeps you visible.'}],
 srs:[{q:'Headline formula?',a:'Target role | 2–3 strengths | proof, under 120 characters.'},{q:'Four parts of a strong project README?',a:'What and why, how it works (diagram), demo (photo/GIF), what you would improve.'},{q:'About section should end with?',a:'What you are looking for.'},{q:'Why does GitHub matter for hardware roles?',a:'It is rare, memorable evidence that backs your CV claims.'}],
 read:[{t:'Managing your GitHub profile README',s:'GitHub Docs',u:'https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-github-profile/customizing-your-profile/managing-your-profile-readme'},{t:'LinkedIn profile best practices',s:'LinkedIn Help',u:GS('LinkedIn Help profile best practices headline about section')},{t:'Example embedded project READMEs',s:'GitHub search',u:'https://github.com/search?q=esp32+lidar&type=repositories'}]},

{id:'l05',track:'launch',title:'Your story: the 30-second pitch and the timeline question',mins:30,blurb:'Answer "tell me about yourself" in 30 seconds, and handle the seven-year degree question calmly and briefly.',
 lab:{key:'pitch',name:'Pitch builder with timer',intro:'Write your present–past–future pitch, time it, and write your timeline answer.'},
 cards:[
  {h:'"Tell me about yourself" is a test',b:`<p>It is usually the first question, and it tests whether you can communicate clearly under mild pressure. It is <b>not</b> an invitation to recite your CV. Aim for 30–60 seconds that make the interviewer want to ask about your best project.</p>`},
  {h:'Present → past → future',b:`<p><b>Present:</b> who you are as an engineer now. <b>Past:</b> one or two proofs (the LiDAR co-op, the touchless terminal). <b>Future:</b> what you want next and why this employer. End on the future so the conversation moves forward.</p>`},
  {h:'Addressing the timeline',b:`<p>Your degree ran from 2019 to 2026. Interviewers may ask. The pattern that works: <b>brief, honest, no over-explaining, then pivot</b> to what you learned or what you did. One or two sentences. Rehearse it until it sounds calm. A long, defensive answer creates more doubt than the gap itself.</p>`},
  {h:'Turn it into an asset where true',b:`<p>If the extra time included the co-op, self-taught skills, Japanese, or projects, say so. If it was a hard period, you do not need to share details; say it was a personal or academic challenge you worked through, and point to the evidence that you are ready now: strong recent projects and the co-op.</p>`},
  {h:'Practise out loud',b:`<p>Written pitches read well and sound stiff. Say it aloud ten times, record yourself once, and cut any sentence you stumble on. Practise the timeline answer with your advisor so it no longer feels uncomfortable.</p>`}],
 quiz:[
  {q:'"Tell me about yourself" mainly tests…',o:['Your memory of your CV','Clear, confident communication under mild pressure','Your family background','Salary expectations'],a:1,w:'Keep it short, structured and forward-looking.'},
  {q:'The recommended pitch structure is…',o:['Past → present → hobbies','Present → past → future','Future → salary → past','Chronological from school'],a:1,w:'Ending on the future moves the conversation on.'},
  {q:'The best way to handle a question about a long degree is…',o:['A long detailed explanation','Avoid answering','Brief and honest, then pivot to what you learned and what you can do now','Blame the university'],a:2,w:'Short and calm; long defensive answers create doubt.'},
  {q:'Must you share personal details behind a gap?',o:['Yes, always in full','No; a brief honest framing is enough, followed by evidence of readiness','Only if asked twice','Only in writing'],a:1,w:'You control the level of detail.'},
  {q:'About how many words is a 30-second pitch?',o:['20','About 75','300','500'],a:1,w:'Roughly 2.5 spoken words per second.'},
  {q:'Why practise aloud rather than only writing?',o:['It is not necessary','Written text often sounds stiff when spoken; speaking exposes awkward parts','Interviewers prefer reading','To memorise word for word'],a:1,w:'Cut what you stumble on.'}],
 srs:[{q:'Pitch structure?',a:'Present → past (1–2 proofs) → future (why them).'},{q:'Timeline answer pattern?',a:'Brief, honest, no over-explaining, then pivot to learning and readiness.'},{q:'30-second pitch length?',a:'About 75 words.'},{q:'How to rehearse?',a:'Aloud ten times, record once, cut what you stumble on.'}],
 read:[{t:'How to answer "tell me about yourself"',s:'Harvard Business Review',u:HBRS('tell me about yourself interview')},{t:'Explaining gaps in your education or career',s:'Search: career-centre guidance',u:GS('how to explain a longer than usual degree in a job interview')},{t:'Your pitch builder',s:'Open the lab in this mission',u:'#/m/l05/lab'}]},

{id:'l06',track:'launch',title:'Networking and informational interviews',mins:35,blurb:'In Saudi engineering, introductions open doors. Learn to ask for 20 minutes of someone\'s time, and to use it well.',
 lab:{key:'outreach',name:'Outreach message builder',intro:'Draft short, specific messages and add people straight to your Network list.'},
 cards:[
  {h:'Why networking matters here',b:`<p>Many roles, especially in specialised engineering, are filled through referrals and introductions before or alongside formal advertising. A referred candidate is more likely to be interviewed. Networking is not asking for jobs; it is <b>learning from people</b> who can later vouch for you.</p>`},
  {h:'The informational interview',b:`<p>A 20-minute conversation where you ask a practitioner about their work. You learn what the job is really like (evidence for your decision memo), how their company hires, and which skills matter. You also become a name they remember.</p>`},
  {h:'Who to ask first',b:`<ul><li><b>Warm contacts:</b> family friends, your advisor's network, co-op colleagues, KSU alumni.</li><li><b>Alumni:</b> search LinkedIn for KSU electrical engineering graduates at your targets.</li><li><b>Speakers and authors:</b> people who presented or posted about work you admire; mention it specifically.</li></ul>`},
  {h:'Good questions',b:`<ul><li>What does a normal week look like in your role?</li><li>What do graduates find hardest in the first year?</li><li>Which skills separated the strongest juniors you have seen?</li><li>How does your team usually hire graduates?</li><li>Who else would you suggest I speak to?</li></ul><p>The last question turns one contact into several.</p>`},
  {h:'Follow-up is the real work',b:`<p>Send thanks the same day, mentioning one thing you learned. Act on their advice and tell them later that you did. Log what you learned in your Network list. Two conversations a week, sustained for two months, changes a job search.</p>`}],
 quiz:[
  {q:'The main purpose of an informational interview is…',o:['To ask for a job directly','To learn about the work and how hiring happens from a practitioner','To sell yourself for an hour','To get salary data only'],a:1,w:'Learning first; the relationship follows.'},
  {q:'A reasonable length to request is…',o:['Two hours','About 20 minutes','A full day','Five minutes'],a:1,w:'Small asks get more yeses.'},
  {q:'Which question multiplies your network?',o:['How much do you earn?','Who else would you suggest I speak to?','Can you get me a job?','What is your address?'],a:1,w:'One conversation leads to more.'},
  {q:'When should you send a thank-you?',o:['Never','The same day, mentioning something specific you learned','After you get a job','Only if they helped a lot'],a:1,w:'Specific and prompt.'},
  {q:'The best first contacts are usually…',o:['CEOs of large companies','Warm contacts and alumni','Random profiles','HR departments only'],a:1,w:'Shared connections raise response rates.'},
  {q:'A sustainable networking pace is about…',o:['20 a day','Two conversations a week','One per year','Only when desperate'],a:1,w:'Consistency beats bursts.'}],
 srs:[{q:'Informational interview purpose?',a:'Learn about the work and how hiring happens; build a relationship.'},{q:'Five good questions?',a:'Typical week; hardest part for graduates; skills of strong juniors; how they hire; who else to talk to.'},{q:'Follow-up rule?',a:'Thank the same day with one specific learning; later tell them what you did with their advice.'},{q:'Weekly target?',a:'Two conversations.'}],
 read:[{t:'Informational interview',s:'Wikipedia overview',u:WIKI('Informational_interview')},{t:'Find KSU electrical engineering alumni',s:'LinkedIn search',u:LI('King Saud University electrical engineering embedded')},{t:'Your Network list',s:'In this app',u:'#/pipeline/net'}]},

{id:'l07',track:'launch',title:'Reading job ads and passing the screen',mins:30,blurb:'Decode an advert into must-haves and nice-to-haves, and apply in a way that gets past the first filter.',
 lab:{key:'jobad',name:'Sort a real-style job advert',intro:'Classify ten advert lines, then compare with the reasoning.'},
 cards:[
  {h:'Adverts mix three kinds of line',b:`<p><b>Must-haves</b> are screened hard (degree, core language, eligibility). <b>Nice-to-haves</b> are wish lists; graduates who meet most must-haves and some nice-to-haves should apply. <b>Culture signals</b> ("fast-paced", "team player") tell you which stories to prepare.</p>`},
  {h:'Apply when you meet the core',b:`<p>A common mistake is waiting until you match every line. If you meet the must-haves and a reasonable share of the rest, apply, and use your cover note or summary to address the most important gap ("I am building an RTOS project to strengthen…").</p>`},
  {h:'Mirror the language',b:`<p>Applicant tracking systems and busy screeners look for the advert's own words. If the advert says "C/C++ for microcontrollers" and your CV says "Arduino IDE", you may not match. Use the precise terms truthfully, in your summary and skills.</p>`},
  {h:'Eligibility and clearance',b:`<p>Defence and some government-linked roles require nationality and security clearance, which can lengthen the process. Apply early and keep other applications moving while you wait.</p>`},
  {h:'Track everything',b:`<p>Log each application in your Pipeline with the date, the version of your CV, the contact and the next step. Follow up politely after one to two weeks if you have a contact. A tracked search is faster and less stressful than a scattered one.</p>`}],
 quiz:[
  {q:'"Proficiency in C/C++ for microcontrollers" in an embedded advert is most likely…',o:['A culture signal','A must-have','Irrelevant','A nice-to-have'],a:1,w:'Core to the role and likely tested.'},
  {q:'"Eager to learn in a fast-paced environment" is…',o:['A must-have skill','A culture signal: prepare a story that shows it','A hard filter','A salary indicator'],a:1,w:'Show it with evidence.'},
  {q:'Should a graduate apply if they meet the must-haves but only some nice-to-haves?',o:['No, never','Yes, and address the key gap briefly','Only if a friend works there','Only after a master\'s'],a:1,w:'Waiting for a perfect match loses opportunities.'},
  {q:'Why mirror the advert\'s wording?',o:['To copy text dishonestly','Screening systems and readers look for those exact terms; use them truthfully','It is required by law','It is not useful'],a:1,w:'Precise, truthful keyword alignment.'},
  {q:'Clearance-required roles mean you should…',o:['Avoid them','Apply early and keep other applications moving','Wait for one before applying elsewhere','Ignore the requirement'],a:1,w:'They take longer; parallelise.'},
  {q:'What should you log for each application?',o:['Nothing','Date, CV version, contact and next step','Only the company name','Only rejections'],a:1,w:'Tracking enables timely follow-up.'}],
 srs:[{q:'Three kinds of advert line?',a:'Must-have, nice-to-have, culture signal.'},{q:'When to apply?',a:'When you meet the must-haves and a fair share of the rest.'},{q:'Keyword rule?',a:'Mirror the advert\'s precise terms, truthfully.'},{q:'Follow-up timing?',a:'One to two weeks after applying, if you have a contact.'}],
 read:[{t:'Applicant tracking systems',s:'Wikipedia overview',u:WIKI('Applicant_tracking_system')},{t:'Current embedded roles in Saudi Arabia',s:'LinkedIn Jobs search',u:'https://www.linkedin.com/jobs/search/?keywords=embedded%20engineer&location=Saudi%20Arabia'},{t:'Your Pipeline',s:'In this app',u:'#/pipeline'}]},

{id:'l08',track:'launch',title:'Behavioural interviews: STAR stories',mins:40,blurb:'Most interviews include "tell me about a time…". Prepare five true stories you can adapt to any question.',
 lab:{key:'star',name:'STAR story bank',intro:'Write at least three complete stories from your co-op and projects.'},
 cards:[
  {h:'Past behaviour predicts future behaviour',b:`<p>Behavioural questions ("Tell me about a time you…") are used because how you acted before is a reasonable predictor of how you will act again. Interviewers score structure, ownership and results.</p>`},
  {h:'The STAR structure',b:`<p><b>Situation</b> (one or two sentences of context) → <b>Task</b> (your responsibility) → <b>Action</b> (what <i>you</i> did, step by step: the longest part) → <b>Result</b> (what changed, ideally with a number, and what you learned).</p>`},
  {h:'Common traps',b:`<ul><li>Too much situation, too little action.</li><li>"We" throughout, so your contribution is invisible.</li><li>No result, or a vague one ("it went well").</li><li>Stories that run over two minutes.</li></ul>`},
  {h:'A bank of five covers most questions',b:`<p>Prepare five stories: a hard technical problem, attention to detail, working under constraints, teamwork or conflict, and learning something fast. Each can be adapted: the LiDAR testing story can answer questions about pressure, rigour or presenting results.</p>`},
  {h:'Engineering-specific stories',b:`<p>Engineering interviewers love specifics: the datasheet you checked, the measurement that surprised you, the trade-off you chose. Include one technical detail per story; it signals that you really did the work.</p>`}],
 quiz:[
  {q:'In STAR, which part should be longest?',o:['Situation','Task','Action','Result'],a:2,w:'Interviewers score what you did.'},
  {q:'Why say "I" rather than "we" in the Action?',o:['It sounds arrogant but is required','It makes your own contribution visible','Interviewers dislike teams','It is shorter'],a:1,w:'Credit the team briefly, then describe your part.'},
  {q:'A strong Result includes…',o:['"It went well"','A concrete outcome, ideally a number, and what you learned','Nothing; results are optional','Your grade'],a:1,w:'Concrete and measurable.'},
  {q:'How many prepared stories cover most behavioural questions?',o:['One','About five, adapted as needed','Twenty','None; improvise'],a:1,w:'A small, flexible bank.'},
  {q:'A good target length for a spoken STAR story is…',o:['10 seconds','About 90 seconds to two minutes','Five minutes','Ten minutes'],a:1,w:'Long enough for detail, short enough to hold attention.'},
  {q:'Why add one technical detail to each story?',o:['To confuse the interviewer','It signals you really did the work','It is required','To fill time'],a:1,w:'Specifics build credibility.'}],
 srs:[{q:'STAR?',a:'Situation, Task, Action (longest, "I"), Result (concrete, with learning).'},{q:'Four STAR traps?',a:'Too much situation; "we"; vague result; too long.'},{q:'Five stories to prepare?',a:'Hard technical problem, attention to detail, constraints, teamwork or conflict, fast learning.'},{q:'Credibility booster?',a:'One technical detail per story.'}],
 read:[{t:'The STAR method',s:'Wikipedia overview',u:WIKI('Situation,_task,_action,_result')},{t:'Behavioural interview questions for engineers',s:'Search: common questions',u:GS('behavioral interview questions for embedded engineers examples')},{t:'Your STAR bank',s:'Open the lab in this mission',u:'#/m/l08/lab'}]},

{id:'l09',track:'launch',title:'Technical interviews for embedded and hardware roles',mins:45,blurb:'What embedded interviewers ask, how to think aloud, and a drill of twelve core questions with model answers.',
 lab:{key:'drill',name:'Technical drill: 12 core questions',intro:'Answer aloud, reveal the model answer, score yourself.'},
 cards:[
  {h:'What gets tested',b:`<ul><li><b>C fundamentals:</b> pointers, volatile, bit manipulation, memory.</li><li><b>Microcontroller concepts:</b> interrupts, timers, DMA, peripherals.</li><li><b>Buses:</b> UART, SPI, I2C, CAN.</li><li><b>Circuits:</b> pull-ups, decoupling, simple analog.</li><li><b>Debugging approach:</b> how you find a fault.</li><li><b>Your projects:</b> they will go deep on one.</li></ul>`},
  {h:'Think aloud',b:`<p>Interviewers score your <b>reasoning</b> as much as the answer. State assumptions, sketch the system, try the simple case first, and say what you would measure. "I am not sure, but I would check X by doing Y" is far better than silence.</p>`},
  {h:'Know your own projects cold',b:`<p>Expect: why the ESP32? Why that sensor? What was the data rate over serial? How did your debounce work? What would you change? Re-read your code and prepare a one-minute walkthrough with a diagram.</p>`},
  {h:'Common practical tests',b:`<p>Writing a small C function (reverse bits, ring buffer, parse a packet), reading a datasheet excerpt, or debugging a provided snippet. Practise writing C by hand without an IDE; it reveals gaps that autocomplete hides.</p>`},
  {h:'After the interview',b:`<p>Write down every question you were asked the same day, mark the ones you struggled with, and study those. Over five interviews this becomes the best preparation material you have.</p>`}],
 quiz:[
  {q:'Variables shared between an ISR and the main loop should usually be declared…',o:['static only','volatile (and protected if access is not atomic)','const','register'],a:1,w:'volatile forces real memory access; atomicity is a separate concern.'},
  {q:'Which bus uses addressing so many devices share two wires?',o:['UART','SPI','I2C','RS-232'],a:2,w:'I2C: SDA and SCL with device addresses.'},
  {q:'If you do not know an answer in a technical interview, the best response is…',o:['Stay silent','Guess confidently','Say what you would check and how, reasoning aloud','Change the subject'],a:2,w:'Reasoning earns credit.'},
  {q:'Why practise writing C without an IDE?',o:['IDEs are banned at work','It exposes gaps that autocomplete hides, as in whiteboard tests','It is faster','It is not useful'],a:1,w:'Interviews often use paper or a plain editor.'},
  {q:'A new board does not boot. What do you check first?',o:['Rewrite the firmware','Power rails, clocks and reset, then the debug connection','Order a new board','The enclosure'],a:1,w:'Work from power outward.'},
  {q:'What is the value of noting every interview question afterwards?',o:['None','It builds a personal question bank aimed at your weak spots','To complain online','To send to HR'],a:1,w:'Your best study material.'}],
 srs:[{q:'volatile means?',a:'Value may change outside visible program flow; always access memory. Not atomic.'},{q:'UART vs SPI vs I2C?',a:'UART async point-to-point; SPI sync, fast, chip-selects; I2C two shared wires with addresses and pull-ups.'},{q:'Board will not boot: order of checks?',a:'Power, clocks, reset, debug link, boot pins, minimal firmware.'},{q:'If stuck in an interview?',a:'Reason aloud: assumptions, simple case, what you would measure.'}],

{id:'l10',track:'launch',title:'Offers and choosing the first job',mins:30,blurb:'How to compare offers, what to ask before accepting, and how to negotiate respectfully.',
 lab:{key:'offer',name:'Weighted offer comparison',intro:'Weight what matters to you, score up to three offers, and see where the decision really lies.'},
 cards:[
  {h:'The first job is about learning rate',b:`<p>Early in a career, the difference between two salaries matters less than the difference in <b>what you will learn</b> and <b>who will teach you</b>. A role with a strong technical lead and real responsibility can be worth more over five years than a slightly higher salary in a role with little growth.</p>`},
  {h:'Questions to ask before accepting',b:`<ul><li>Who will I report to, and can I meet them?</li><li>What will I be working on in the first six months?</li><li>How are graduates trained and evaluated?</li><li>What happened to the last few graduates in this team?</li><li>What is the full package (housing, transport, allowances, training budget)?</li></ul>`},
  {h:'Negotiating respectfully',b:`<p>Graduate offers often have little room on base salary but some on start date, training, allowances or job title. Be appreciative, specific and calm: ask once, with a reason. Never accept and then keep interviewing elsewhere as if you had not.</p>`},
  {h:'Deadlines and multiple offers',b:`<p>If you have one offer and are waiting on another, it is acceptable to ask politely for a short extension. Tell the second employer you have an offer with a deadline; this sometimes speeds them up. Be honest throughout; the industry is small.</p>`},
  {h:'Decide, then commit',b:`<p>Use a weighted comparison to think clearly, discuss it with your advisor, then commit fully. Give your first role at least 18–24 months unless something is seriously wrong; depth comes from staying long enough to own something.</p>`}],

  {q:'If you need time while waiting for another offer, you should…',o:['Ignore the deadline','Ask politely for a short extension and be honest','Accept both','Lie about another offer'],a:1,w:'Honesty protects your reputation.'},
  {q:'How long should you generally stay in a first role?',o:['Three months','At least 18–24 months unless something is seriously wrong','Ten years minimum','Until the first bonus'],a:1,w:'Long enough to own something.'},

const VERBS=/^(built|designed|developed|engineered|implemented|tested|validated|debugged|reduced|improved|increased|optimi[sz]ed|automated|integrated|deployed|led|wrote|created|characteri[sz]ed|measured|analy[sz]ed|corrected|redesigned|prototyped|programmed|ported|calibrated|delivered|identified|achieved)\b/i;
function cvCheck(t,all){const x=(t||'').trim();return{verb:VERBS.test(x),num:/\d/.test(x),len:x.length>=60&&x.length<=230,uniq:all.filter(y=>y.trim()&&y.trim()===x).length<=1}}

   <div class="ctl"><button class="sbtn" id="sts">Save and check</button><span class="note" id="stm"></span></div>`;
  const chk=i=>{const s=S[i]||{};const ok={all:['s','t','a','r'].every(k=>(s[k]||'').length>15),i:/\bI\b/.test(s.a||''),res:/\d/.test(s.r||'')||(s.r||'').length>60};return ok};
  const show=()=>STARQ.forEach((_,i)=>{const k=chk(i);$(`[data-sk="${i}"]`,el).textContent=`${k.all?'✅':'⬜'} all four parts · ${k.i?'✅':'⬜'} "I" in the action · ${k.res?'✅':'⬜'} concrete result`});show();
  $('#sts',el).onclick=()=>{$$('[data-st]',el).forEach(t=>{const [i,k]=t.dataset.st.split('_');S[+i]=S[+i]||{c:STARQ[+i][0]};S[+i][k]=t.value.trim()});save();show();const n=STARQ.filter((_,i)=>{const k=chk(i);return k.all&&k.i&&k.res}).length;$('#stm',el).textContent=n+' complete stories';if(n>=3){logEvent('star','l08',n+' STAR stories');done()}}};
function storiesAdvisorHTML(s){const S=(s.stories||[]).filter(x=>x&&x.a);if(!S.length)return'';return`<div class="card"><h3>STAR stories</h3>${S.map(x=>`<div style="margin:10px 0"><b>${esc(x.c||'')}</b><p class="note" style="margin:2px 0"><b>S</b> ${esc(x.s||'')} <b>T</b> ${esc(x.t||'')}</p><p style="margin:2px 0"><b>A</b> ${esc(x.a||'')}</p><p style="margin:2px 0"><b>R</b> ${esc(x.r||'')}</p></div>`).join('')}</div>`}

const DRILL=[
 ['What does the <code>volatile</code> keyword tell the compiler, and when do you need it?','It tells the compiler the value can change outside the program\'s visible flow, so every access must really read or write memory. Needed for hardware registers, variables shared with an ISR, and memory shared between threads or cores. It does not make access atomic.'],
 ['What should an interrupt service routine avoid, and why?','Keep it short: no blocking calls, no long loops, no printf, usually no dynamic allocation. Set a flag or push to a buffer and let the main loop or a task do the work. Long ISRs delay other interrupts and break timing.'],
 ['Compare UART, SPI and I2C.','UART: asynchronous, two wires, point-to-point, agreed baud rate. SPI: synchronous, full duplex, fast, one chip-select per device. I2C: two wires shared by many devices with addresses, slower, open-drain with pull-ups, acknowledgements.'],
 ['Why does I2C need pull-up resistors, and how do you size them?','Lines are open-drain: devices only pull low, so resistors pull high. Smaller values give faster rise times but more current; the bus capacitance and speed mode set the range (often a few kΩ).'],
 ['How would you debounce a mechanical button?','Hardware: RC filter plus Schmitt trigger. Software: sample at a fixed rate and accept a change only after it is stable for N samples (e.g. 10–20 ms), or use a state machine. Avoid blocking delays in an ISR.'],
 ['Polling versus interrupts: when would you choose each?','Polling is simple and predictable when events are frequent or timing is fixed. Interrupts suit rare or asynchronous events and save power. Very high-rate data usually goes to DMA.'],
 ['What is DMA and why use it?','Direct memory access moves data between peripherals and memory without the CPU, e.g. ADC samples or a UART stream into a buffer. It frees the CPU and reduces jitter; you handle completion with an interrupt.'],
 ['A sensor reading is noisy. Walk through your approach.','Check the hardware first (grounding, decoupling, reference, sampling rate versus the signal), then filter: averaging or a moving average, a low-pass IIR, a median filter for spikes, a Kalman filter when you have a model. Measure before and after.'],
 ['What is a race condition? Give an embedded example.','A bug where the result depends on timing. Example: main loop reads a 32-bit counter in two halves on an 8-bit MCU while an ISR updates it. Fix with a critical section, atomic access, or a double-read check.'],
 ['How does a time-of-flight LiDAR measure distance?','It emits light pulses (or modulated light) and measures the round-trip time or phase shift; distance = c × t / 2. Accuracy depends on timing resolution, signal strength, ambient light and target reflectivity.'],
 ['What would you check first when a new board does not boot?','Power rails and current draw, clocks and reset line, the programming or debug connection, boot pins, then firmware: start from a minimal blink. Work from power outward.'],
 ['Explain stack versus heap in an embedded system.','The stack holds local variables and call frames and grows automatically; overflow corrupts memory silently. The heap is dynamic allocation, which fragments and is often avoided or restricted in embedded and safety-critical code.']];
LABS.drill=(el,m,done)=>{const C0=CUST('drill');C0.s=C0.s||{};let i=0;
  const draw=()=>{const n=Object.keys(C0.s).length;const [q,a]=DRILL[i];el.innerHTML=`<p class="note">Answer aloud first, as if in the interview (60–90 seconds). Then reveal the model answer and score yourself honestly. ${n}/${DRILL.length} scored.</p><div class="card concept"><div class="eyebrow">Question ${i+1} of ${DRILL.length}</div><h3 style="font-family:var(--sans);font-size:1.02rem">${q}</h3><div id="ma" hidden><div class="model">${a}</div><div class="ctl">${[['Missed it',0],['Partly',1],['Nailed it',2]].map(([t,v])=>`<button class="sbtn ${C0.s[i]===v?'':'alt'} sm" data-sc="${v}">${t}</button>`).join('')}</div></div><div class="ctl"><button class="sbtn" id="rv">Show model answer</button></div></div><div class="ctl"><button class="sbtn alt" id="pv" ${i?'':'disabled'}>← Previous</button><span class="spacer"></span><button class="sbtn alt" id="nx">${i<DRILL.length-1?'Next →':'Back to start'}</button></div>`;
   $('#rv',el).onclick=()=>{$('#ma',el).hidden=false;$('#rv',el).remove()};$('#pv',el).onclick=()=>{i--;draw()};$('#nx',el).onclick=()=>{i=(i+1)%DRILL.length;draw()};
   $$('[data-sc]',el).forEach(b=>b.onclick=()=>{C0.s[i]=+b.dataset.sc;save();const k=Object.keys(C0.s).length;if(k>=8){const tot=Object.values(C0.s).reduce((x,y)=>x+y,0);logEvent('drill','l09',`Technical drill ${tot}/${k*2}`);done()}if(i<DRILL.length-1){i++;draw()}else draw()})};draw()};

LABS.offer=(el,m,done)=>{const C0=CUST('offer');const CR=[['learn','Learning and mentorship in year one',5],['path','Fit with my target path',5],['pay','Salary and benefits',3],['stab','Stability and contract terms',3],['loc','Location and commute',2],['brand','Growth and name on my CV',3]];
  C0.n=C0.n||['Offer A','Offer B','Offer C'];C0.w=C0.w||Object.fromEntries(CR.map(c=>[c[0],c[2]]));C0.s=C0.s||{};
  el.innerHTML=`<p class="note">Weight each criterion for <b>you</b> (1–5), then score each offer (1–5). Use real offers or two plausible ones from your target list. The total is a prompt for thinking, not the answer: if the result feels wrong, your weights are telling you something.</p><div class="tablewrap"><table class="t"><tr><th>Criterion</th><th>Weight</th>${[0,1,2].map(k=>`<th><input class="tin" data-on="${k}" value="${esc(C0.n[k])}" style="min-width:90px"></th>`).join('')}</tr>${CR.map(([id,l])=>`<tr><td>${l}</td><td><input class="tin" type="number" min="1" max="5" data-w="${id}" value="${C0.w[id]}" style="width:60px"></td>${[0,1,2].map(k=>`<td><input class="tin" type="number" min="0" max="5" data-s="${k}_${id}" value="${C0.s[k+'_'+id]??''}" style="width:60px"></td>`).join('')}</tr>`).join('')}<tr><td><b>Weighted score</b></td><td></td>${[0,1,2].map(k=>`<td><b data-tot="${k}">—</b></td>`).join('')}</tr></table></div><div class="readout" id="ofr"></div>`;
  const calc=()=>{$$('[data-on]',el).forEach(x=>C0.n[+x.dataset.on]=x.value);$$('[data-w]',el).forEach(x=>C0.w[x.dataset.w]=Math.max(1,Math.min(5,+x.value||1)));$$('[data-s]',el).forEach(x=>{if(x.value!=='')C0.s[x.dataset.s]=Math.max(0,Math.min(5,+x.value));else delete C0.s[x.dataset.s]});
    const W=CR.reduce((a,c)=>a+C0.w[c[0]],0);const tot=[0,1,2].map(k=>CR.every(c=>C0.s[k+'_'+c[0]]!=null)?CR.reduce((a,c)=>a+C0.w[c[0]]*C0.s[k+'_'+c[0]],0)/W:null);
    tot.forEach((t,k)=>$(`[data-tot="${k}"]`,el).textContent=t==null?'—':t.toFixed(2));const sc=tot.map((t,k)=>[t,k]).filter(x=>x[0]!=null).sort((a,b)=>b[0]-a[0]);save();
    $('#ofr',el).innerHTML=sc.length>=2?`<b>${esc(C0.n[sc[0][1]])}</b> leads by ${(sc[0][0]-sc[1][0]).toFixed(2)}. ${sc[0][0]-sc[1][0]<.3?'That is close: decide on learning and path fit, which compound over a career.':'A clear lead, if your weights are honest.'}`:'Score at least two offers.';if(sc.length>=2)done()};
  $$('input',el).forEach(x=>x.oninput=calc);calc()};

boot();
</script>
