  ${all.map(n=>`<div class="card" ${n.archived?'style="opacity:.75"':''}><div class="row"><div class="eyebrow">${n.kind==='task'?'Task':'Note'}${n.due?' · due '+n.due:''}${n.mission&&M[n.mission]?' · '+esc(M[n.mission].title):''}</div><span class="spacer"></span>${n.archived?'<span class="pill">Archived</span>':''}</div><p style="margin:6px 0">${esc(n.txt).replace(/\n/g,'<br>')}</p>${noteEvents(n,s).map(e=>`<div class="note" style="margin:4px 0"><b>${dt(e.t)}</b> · ${e.w}${e.x?`: <span style="color:var(--ink)">${esc(e.x)}</span>`:''}</div>`).join('')}${n.archived?`<div class="ctl" style="margin:6px 0 0"><button class="sbtn alt sm" data-nres="${n.id}">Restore to Adnan's inbox</button></div>`:''}</div>`).join('')||'<div class="card"><p class="note">Nothing sent yet.</p></div>'}
  ${fl.length?`<div class="card"><h3>Focus path changes</h3>${fl.map(l=>`<div class="note">${dt(l.t)} · ${l.v&&PATH[l.v]?esc(PATH[l.v].name):'Focus cleared'}</div>`).join('')}</div>`:''}`;
  $$('[data-nres]').forEach(b=>b.onclick=()=>{const id=b.dataset.nres;advMutate(A=>{const n=(A.notes||[]).find(x=>x.id===id);if(n)delete n.archived},'Restored')});
  $('#hcsv').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Item','Kind','Sent','Text','Event time','Event','Detail']];all.forEach((n,i)=>noteEvents(n,s).forEach(e=>rows.push([i+1,n.kind,new Date(n.t).toISOString(),n.txt,new Date(e.t).toISOString(),e.w,e.x||''])));
    const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='adnan-advisor-history-'+today()+'.csv';a.click()}}

/* ================= Compass: interactive career profiling =================
   Self-report instrument. Five parts: interests, day-in-the-life choices, values,
   skills, open questions. Scores nine career paths open to an EE graduate in KSA.
   Results are a conversation starter for Adnan and his advisor, not a verdict. */

const DIMS={H:'Hands-on hardware',C:'Coding',A:'Analysis & maths',S:'Systems integration',P:'People & persuasion',R:'Research & novelty',O:'Order & rigour'};

const SKILLS=[['cpp','C / C++'],['py','Python'],['mcu','Microcontrollers & peripherals'],['pcb','PCB design (Altium)'],['analog','Analog & power circuits'],['dsp','Signal processing'],['ctrl','Control systems'],['hdl','Digital design (Verilog / VHDL)'],['net','Networking & security'],['ml','ML / computer vision'],['linux','Linux & scripting'],['comm','Presenting & writing'],['jp','Japanese']];
const SKL=['None','Aware','Coursework','Project-level','Confident'];

const PATHS=[
 {id:'emb',name:'Embedded & firmware engineer',what:'Writes the software that runs on the hardware: drivers, real-time code, communication stacks on microcontrollers and embedded Linux.',w:{C:3,H:2,S:1,A:1},need:['cpp','mcu','linux'],sectors:'Defence electronics, industrial automation, IoT, automotive, medical devices',roles:'Embedded Software Engineer, Firmware Engineer, Embedded Systems Engineer',track:'emb'},
 {id:'per',name:'Perception & autonomy engineer',what:'Makes machines sense and understand the world: LiDAR, radar and cameras, point clouds, sensor fusion, robotics and UAV/AV navigation.',w:{A:3,C:2,S:2,R:1,H:1},need:['cpp','py','dsp','ml'],sectors:'UAV and defence, automotive, robotics, smart infrastructure, mapping',roles:'Perception Engineer, Robotics Software Engineer, Sensor Fusion Engineer',track:'per'},
 {id:'hw',name:'Electronics & PCB design engineer',what:'Designs the boards: schematics, component selection, power stages, layout, bring-up and EMC.',w:{H:3,A:1,S:1,O:1},need:['pcb','analog'],sectors:'Defence electronics, telecom equipment, power electronics, consumer and industrial products',roles:'Hardware Design Engineer, Electronics Engineer, PCB Design Engineer',track:'emb'},
 {id:'semi',name:'Semiconductor & digital design engineer',what:'Designs or verifies chips and FPGAs: RTL, verification testbenches, timing, physical design.',w:{A:2,R:2,C:1,O:2},need:['hdl','py'],sectors:'Semiconductor design houses, FPGA-based defence and telecom, national semiconductor initiatives',roles:'FPGA Engineer, Design Verification Engineer, ASIC Design Engineer',track:'ind'},
 {id:'test',name:'Test, validation & reliability engineer',what:'Proves that systems work and keep working: test plans, environmental and qualification testing, integration, failure analysis.',w:{O:3,H:2,S:2,A:1},need:['py','analog','comm'],sectors:'Defence and aerospace, automotive, telecom, energy',roles:'Test Engineer, Validation Engineer, Reliability Engineer, Systems Integration Engineer',track:'emb'},
 {id:'net',name:'Telecom, networks & security engineer',what:'Builds and protects communication systems: networks, wireless, industrial (OT) security.',w:{C:2,S:2,A:1,O:2},need:['net','linux','py'],sectors:'Telecom operators, cybersecurity firms, energy and utilities, government',roles:'Network Engineer, OT Security Engineer, Telecom Engineer',track:'ind'},
 {id:'tech',name:'Technical solutions & product engineer',what:'Bridges customers and engineering: understands the product deeply and explains, adapts and sells it; often with foreign partners.',w:{P:3,S:2,H:1},need:['comm','mcu'],sectors:'Foreign OEMs entering KSA (incl. Japanese), distributors, system integrators',roles:'Applications Engineer, Solutions Engineer, Technical Product Engineer',track:'launch'},
 {id:'iot',name:'IoT & connected-systems engineer',what:'Builds connected products end to end: sensors and microcontrollers, the network that carries their data, and the backend and dashboards that use it.',w:{S:3,C:2,H:1,P:1},need:['mcu','py','net'],sectors:'Telecom operators\' IoT and smart-city units, industrial IoT integrators, utilities, facility and building technology',roles:'IoT Engineer, IoT Solutions Engineer, Connected Systems Engineer, Smart City Engineer',track:'emb'},
 {id:'grad',name:'Graduate study, then research',what:'A master\'s (and possibly a PhD) to specialise deeply, in KSA or abroad, leading to R&D roles.',w:{R:3,A:3,C:1},need:['py','dsp','comm'],sectors:'Universities, national research centres, corporate R&D labs',roles:'Graduate Researcher, R&D Engineer',track:'ind'}
];
const PATH=Object.fromEntries(PATHS.map(p=>[p.id,p]));

const CQ_INT=[
 ['Soldering, probing and bringing up a new board for the first time',{H:2},{hw:1}],
 ['Writing C that talks directly to hardware registers',{C:1,H:1},{emb:1}],
 ['Hunting a bug that only appears once a day',{C:1,A:1,O:1},{}],
 ['Working through the maths behind an algorithm, such as a filter',{A:2,R:1},{}],
 ['Making several subsystems work together for the first time',{S:2},{test:1,iot:1}],
 ['Explaining a technical product to a client and answering hard questions',{P:2},{tech:1}],
 ['Designing a careful test plan and running it step by step',{O:2},{test:1}],
 ['Reading research papers about a new technique',{R:2,A:1},{grad:1}],
 ['Laying out a PCB and routing it cleanly',{H:1,O:1},{hw:1}],
 ['Writing Python to analyse and plot sensor data',{C:1,A:1},{iot:1}],
 ['Visualising and filtering a LiDAR point cloud',{A:1,C:1,R:1},{per:1}],
 ['Configuring a network and analysing packets in Wireshark',{S:1,C:1},{net:1}],
 ['Leading a small team to a hard deadline',{P:2,O:1},{}],
 ['Writing clear specifications and documentation',{O:2},{}],
 ['Designing digital logic in Verilog or VHDL',{A:1,O:1},{semi:1}],
 ['Taking a prototype outdoors to test it in heat and dust',{H:2},{test:1}],
 ['Presenting results to senior people',{P:2},{}],
 ['Learning Japanese language and culture for work',{P:1},{tech:1,grad:1}],
 ['Squeezing code to fit tight memory and timing limits',{C:2},{emb:1}],
 ['Making a drone or robot navigate on its own',{S:1,A:1},{per:1}]
];
const CQ_SCN=[
 [['Bring up firmware on a new radar control board',['emb','hw']],['Tune a sensor-fusion algorithm so a drone holds position',['per']]],
 [['Run a 72-hour thermal qualification and write the report',['test']],['Design the power stage for the board under test',['hw']]],
 [['Verify a chip block with a SystemVerilog testbench',['semi']],['Harden a factory network against intrusion',['net']]],
 [['Demo the product to a Japanese partner\'s engineers in Tokyo',['tech']],['Write a paper on a new point-cloud method',['grad','per']]],
 [['Fit a detection algorithm onto a microcontroller with 64 KB of RAM',['emb']],['Train a model on a GPU to classify objects',['per','grad']]],
 [['Lead the integration day where five subsystems meet',['test','tech','iot']],['Spend a week alone perfecting one module',['semi','emb','hw']]]
];
const CQ_VAL=[
 ['Large, stable employer','Fast-moving startup or small company',{test:1,semi:1,net:1,hw:1},{per:1,emb:1,tech:1}],
 ['Become a deep specialist','Stay broad and move across areas',{semi:1,per:1,grad:1,emb:1},{tech:1,test:1,net:1,iot:1}],
 ['Work in a lab or the field with hardware','Work mostly at a screen',{hw:1,test:1,emb:1},{net:1,semi:1,per:1}],
 ['Start earning and gaining experience now','Invest one to two more years in a master\'s',{grad:-1},{grad:2}],
 ['Clear structure and defined tasks','Ambiguity and inventing new things',{test:1,net:1,hw:1},{per:1,grad:1,tech:1}],
 ['Stay in Riyadh','Open to relocate (another city or abroad)',{},{}],
 ['Defence and national-security work appeals to me','I prefer civilian, commercial work',{},{}]
];
const CQ_OPEN=['Which project or task so far made you lose track of time? What exactly were you doing?','What do you want your working life to look like in three years?','What would you not want to do, even if it paid well?','Any constraints we should plan around (location, timing, other commitments)?','Where would you like your advisor\'s help most right now?'];
const CPARTS=[['int','Interests'],['scn','A day in the life'],['val','Values'],['skl','Skills'],['open','In your words']];

/* ---------- scoring (pure: works on any saved compass object) ---------- */
function compassScore(c){if(!c)return null;const a=c.a||{};const out={};
  const dim={};Object.keys(DIMS).forEach(d=>{let s=0,n=0;CQ_INT.forEach((q,i)=>{if(q[1][d]&&a['i'+i]){s+=(a['i'+i]-1)/4*q[1][d];n+=q[1][d]}});dim[d]=n?s/n:null});
  PATHS.forEach(p=>{
    let raw=0,mx=0;CQ_INT.forEach((q,i)=>{const r=a['i'+i];let w=0;for(const d in q[1])w+=q[1][d]*(p.w[d]||0);w+=3*(q[2][p.id]||0);if(!w||!r)return;raw+=(r-3)*w;mx+=2*w});
    const fi=mx?50+50*raw/mx:50;
    let sc=0,sn=0;CQ_SCN.forEach((pr,i)=>{const inA=pr[0][1].includes(p.id),inB=pr[1][1].includes(p.id);if(!inA&&!inB)return;sn++;const ch=a['s'+i];if((ch===0&&inA)||(ch===1&&inB))sc++});
    const fs=100*(sc+1)/(sn+2); // smoothed: one choice should not swing a path from 0 to 100
    let vr=0,vm=0;CQ_VAL.forEach((v,i)=>{const ch=a['v'+i];const x=v[2][p.id]||0,y=v[3][p.id]||0;if(!x&&!y)return;vm+=Math.max(Math.abs(x),Math.abs(y));if(ch===0)vr+=x;if(ch===1)vr+=y});
    const fv=vm?50+50*vr/vm:50;
    const rd=p.need.map(k=>(a['k_'+k]||0)/4);const fr=100*rd.reduce((x,y)=>x+y,0)/rd.length;
    const fit=Math.round(.45*fi+.25*fs+.20*fv+.10*fr);
    const why=CQ_INT.map((q,i)=>({t:q[0],r:a['i'+i]||0,w:Object.keys(q[1]).reduce((s,d)=>s+q[1][d]*(p.w[d]||0),0)+3*(q[2][p.id]||0)})).filter(x=>x.r>=4&&x.w>0).sort((x,y)=>y.w*y.r-x.w*x.r).slice(0,3).map(x=>x.t);
    const scn=CQ_SCN.map((pr,i)=>a['s'+i]!=null&&pr[a['s'+i]][1].includes(p.id)?pr[a['s'+i]][0]:null).filter(Boolean);
    const gaps=p.need.filter(k=>(a['k_'+k]||0)<=2).map(k=>SKILLS.find(s=>s[0]===k)[1]);
    out[p.id]={fit,fi:Math.round(fi),fs:Math.round(fs),fv:Math.round(fv),fr:Math.round(fr),why,scn,gaps}});
  const rank=PATHS.map(p=>p.id).sort((x,y)=>out[y].fit-out[x].fit);
  return{paths:out,rank,dim}}
const cAnswered=c=>{const a=(c&&c.a)||{};return{int:CQ_INT.filter((_,i)=>a['i'+i]).length,scn:CQ_SCN.filter((_,i)=>a['s'+i]!=null).length,val:CQ_VAL.filter((_,i)=>a['v'+i]!=null).length,skl:SKILLS.filter(k=>a['k_'+k[0]]!=null).length,open:CQ_OPEN.filter((_,i)=>(a['o'+i]||'').trim().length>10).length}};
const cTotals={int:CQ_INT.length,scn:CQ_SCN.length,val:CQ_VAL.length,skl:SKILLS.length,open:CQ_OPEN.length};

/* ---------- shared renderers (used by Adnan's app and by the Advisor view) ---------- */
function dimBars(dim){return Object.keys(DIMS).map(d=>{const v=dim[d];return`<div style="margin:6px 0"><div class="row" style="font-size:.86rem"><span>${DIMS[d]}</span><span class="spacer"></span><b>${v==null?'—':Math.round(v*100)}</b></div><div class="prog"><i style="width:${v==null?0:v*100}%"></i></div></div>`}).join('')}
function pathRanking(R,n){return R.rank.slice(0,n||8).map((id,i)=>{const p=PATH[id],r=R.paths[id];return`<div style="margin:9px 0"><div class="row" style="font-size:.92rem;flex-wrap:nowrap"><span>${i+1}. ${esc(p.name)}</span><span class="spacer"></span><b>${r.fit}</b></div><div class="prog"><i style="width:${r.fit}%"></i></div></div>`}).join('')}
function pathCard(R,id,rank){const p=PATH[id],r=R.paths[id];return`<div class="card" style="border-left:4px solid var(--gold2)"><div class="eyebrow">Fit ${r.fit} / 100${rank?' · #'+rank:''}</div><h3 style="margin-top:4px">${esc(p.name)}</h3><p class="note">${esc(p.what)}</p>
  ${r.why.length?`<p style="margin:6px 0"><b>Why it fits you</b></p><ul style="margin-top:0">${r.why.map(w=>`<li>You rated highly: ${esc(w.toLowerCase())}</li>`).join('')}${r.scn.map(s=>`<li>You chose: ${esc(s.toLowerCase())}</li>`).join('')}</ul>`:''}
  ${r.gaps.length?`<p style="margin:6px 0"><b>Skills to build</b></p><p class="note" style="margin-top:0">${r.gaps.map(esc).join(' · ')}</p>`:B('skok','<p class="note"><b>Skills:</b> you already rate yourself project-level or better on the core skills.</p>')}
  <p class="note" style="margin:6px 0 0"><b>Typical titles:</b> ${esc(p.roles)}<br><b>Where in KSA:</b> ${esc(p.sectors)}</p>
  <div class="row note" style="margin-top:8px;gap:12px;font-size:.78rem"><span>Interests ${r.fi}</span><span>Day-in-life ${r.fs}</span><span>Values ${r.fv}</span><span>Skills ready ${r.fr}</span></div></div>`}
function compassValuesHTML(c){const a=(c&&c.a)||{};return CQ_VAL.map((v,i)=>a['v'+i]==null?'':`<div class="note">• ${esc(v[a['v'+i]])}</div>`).join('')}
function compassSkillsHTML(c){const a=(c&&c.a)||{};return`<div class="tablewrap"><table class="t">${SKILLS.map(([k,n])=>`<tr><td>${esc(n)}</td><td>${a['k_'+k]==null?'—':SKL[a['k_'+k]]}</td></tr>`).join('')}</table></div>`}
function compassOpenHTML(c){const a=(c&&c.a)||{};return CQ_OPEN.map((q,i)=>(a['o'+i]||'').trim()?`<p><b class="muted" style="font-size:.85rem">${esc(q)}</b><br>${esc(a['o'+i])}</p>`:'').join('')||'<p class="note">Nothing written yet.</p>'}

/* ---------- Adnan's Compass view ---------- */
function C(){if(!state.compass)state.compass={a:{},part:'int',done:0,hist:[]};if(!state.compass.hist)state.compass.hist=[];return state.compass}
function vCompass(part){const c=C();
  if(part==='results'||(!part&&c.done))return compassResults();
  if(!part&&!Object.keys(c.a).length)return compassIntro();
  part=part||c.part||'int';c.part=part;const n=cAnswered(c);const pi=CPARTS.findIndex(x=>x[0]===part);
  const head=`<div class="row"><a href="#/compass" class="note" onclick="state.compass.part='${part}'">← Compass</a><span class="spacer"></span><small class="muted">Part ${pi+1} of 5</small></div><h1 style="margin-bottom:4px">${CPARTS[pi][1]}</h1>
  <div class="chips" style="margin:8px 0 14px">${CPARTS.map(([k,nm])=>`<button class="chip ${k===part?'on':''}" onclick="go('#/compass/${k}')">${nm} ${n[k]}/${cTotals[k]}</button>`).join('')}</div>`;
  let body='';const a=c.a;
  if(part==='int')body=`<p class="note">${B('int','How much would you <b>enjoy</b> each activity? Not how good you are at it; that comes later. 1 = would avoid, 5 = would love it.')}</p>${CQ_INT.map((q,i)=>`<div class="card" style="padding:12px 14px;margin:8px 0"><div style="font-size:.95rem;margin-bottom:8px">${esc(q[0])}</div><div class="conf">${[1,2,3,4,5].map(v=>`<button data-k="i${i}" data-v="${v}" class="${a['i'+i]===v?'on':''}">${v}</button>`).join('')}</div></div>`).join('')}`;
  if(part==='scn')body=`<p class="note">Two realistic days at work. Pick the one you would rather have, even if both sound fine.</p>${CQ_SCN.map((pr,i)=>`<div class="card" style="padding:12px 14px"><div class="eyebrow">Choice ${i+1}</div>${pr.map((o,j)=>`<button class="qopt ${a['s'+i]===j?'right':''}" data-k="s${i}" data-v="${j}">${esc(o[0])}</button>`).join('')}</div>`).join('')}`;
  if(part==='val')body=`<p class="note">Which is closer to you right now? There are no right answers.</p>${CQ_VAL.map((v,i)=>`<div class="card" style="padding:12px 14px">${[0,1].map(j=>`<button class="qopt ${a['v'+i]===j?'right':''}" data-k="v${i}" data-v="${j}">${esc(v[j])}</button>`).join('')}</div>`).join('')}`;
  if(part==='skl')body=`<p class="note">Be honest: this is for planning, not grading. 0 = none, 1 = aware of it, 2 = coursework, 3 = used it in a real project, 4 = confident.</p>${SKILLS.map(([k,nm])=>`<div class="card" style="padding:12px 14px;margin:8px 0"><div class="row" style="margin-bottom:8px"><span style="font-size:.95rem">${esc(nm)}</span><span class="spacer"></span><small class="muted" id="lbl_${k}">${a['k_'+k]==null?'':SKL[a['k_'+k]]}</small></div><div class="conf">${[0,1,2,3,4].map(v=>`<button data-k="k_${k}" data-v="${v}" class="${a['k_'+k]===v?'on':''}">${v}</button>`).join('')}</div></div>`).join('')}`;
  if(part==='open')body=`<p class="note">A few honest sentences each. Your advisor reads these, so write what is true, not what sounds good.</p>${CQ_OPEN.map((q,i)=>`<label class="f">${esc(q)}</label><textarea data-o="o${i}" placeholder="Write freely…">${esc(a['o'+i]||'')}</textarea>`).join('')}`;
  const next=CPARTS[pi+1];
  view().innerHTML=head+body+`<div class="ctl">${pi?`<button class="sbtn alt" onclick="go('#/compass/${CPARTS[pi-1][0]}')">← Back</button>`:''}<span class="spacer"></span>${next?`<button class="sbtn" id="cnext">Next: ${next[1]} →</button>`:`<button class="sbtn gold" id="cfin">See my results →</button>`}</div><p class="note" id="cmsg"></p>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=+b.dataset.v;a[k]=v;$$(`[data-k="${k}"]`).forEach(x=>{x.classList.toggle('on',x===b);if(x.classList.contains('qopt'))x.classList.toggle('right',x===b)});const l=$('#lbl_'+k.slice(2));if(l)l.textContent=SKL[v];save();
    const cs=b.closest('.card'),nx=cs&&cs.nextElementSibling;if(nx&&nx.classList.contains('card')&&part==='int'&&!$$('[data-k]',nx).some(x=>x.classList.contains('on')))nx.scrollIntoView({behavior:'smooth',block:'center'})});
  $$('[data-o]').forEach(t=>t.oninput=()=>{a[t.dataset.o]=t.value;clearTimeout(t._t);t._t=setTimeout(save,800)});
  const nb=$('#cnext');if(nb)nb.onclick=()=>{save();go('#/compass/'+next[0])};
  const fb=$('#cfin');if(fb)fb.onclick=()=>{$$('[data-o]').forEach(t=>a[t.dataset.o]=t.value);const k=cAnswered(c);const miss=CPARTS.filter(([p])=>p!=='open'&&k[p]<cTotals[p]).map(x=>x[1]);
    if(miss.length){$('#cmsg').innerHTML=`Almost there. Still unanswered in: <b>${miss.join(', ')}</b>.`;return}
    const R=compassScore(c);const first=!c.done;c.done=Date.now();c.hist.push({t:Date.now(),top:R.rank.slice(0,3).map(id=>[id,R.paths[id].fit])});if(c.hist.length>12)c.hist=c.hist.slice(-12);
    logEvent('compass','compass','Top paths: '+R.rank.slice(0,3).map(id=>PATH[id]._en||PATH[id].name).join(', '));if(first)addXP(60);else save();checkBadges();go('#/compass/results')}}
function compassIntro(){view().innerHTML=`<div class="eyebrow">Compass</div><h1>Find the work that fits you</h1>
  <div class="card">${B('cintro','<p>Before choosing a direction, Compass maps what you <b>enjoy</b>, how you like to <b>work</b>, what you <b>value</b>, and what you can <b>already do</b>. It then scores nine career paths open to an electrical engineer in Saudi Arabia.</p><ul><li><b>Five short parts</b>, about 15 minutes. Your answers save as you go.</li><li><b>No right answers.</b> It works only if you answer as you are, not as you think you should be.</li><li><b>It is a starting point.</b> The results open a conversation with your advisor; they do not decide for you.</li><li>You can retake it any time; your advisor sees how your answers change.</li></ul>')}
  <div class="ctl"><button class="sbtn gold" onclick="go('#/compass/int')">Start Compass →</button></div></div>
  <div class="card"><h3>The nine paths</h3>${PATHS.map(p=>`<p style="margin:8px 0"><b>${esc(p.name)}</b><br><span class="note">${esc(p.what)}</span></p>`).join('')}</div>`}
function compassResults(){const c=C();const R=compassScore(c);if(!R){go('#/compass/int');return}const top=R.rank.slice(0,3);const gap=R.paths[top[0]].fit-R.paths[top[1]].fit;const foc=ADV.focus&&PATH[ADV.focus];
  view().innerHTML=`<div class="row"><div class="eyebrow">Compass results · ${new Date(c.done).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div><span class="spacer"></span><button class="sbtn alt sm" onclick="go('#/compass/int')">Edit answers</button></div><h1>Your top paths</h1>
  <p class="note">${gap<5?B('close',`Your top two paths are close (${R.paths[top[0]].fit} vs ${R.paths[top[1]].fit}). That is useful information: talk to people doing both jobs before choosing.`,{a:R.paths[top[0]].fit,b:R.paths[top[1]].fit}):B('clear',`<b>${esc(PATH[top[0]].name)}</b> stands out for you. Test it against reality: speak to two people doing this job.`,{p:esc(PATH[top[0]].name)})}</p>
  ${foc?`<div class="card" style="background:var(--goldsoft);border:0"><div class="eyebrow">Your advisor's suggested focus</div><b>${esc(foc.name)}</b></div>`:''}
  ${top.map((id,i)=>pathCard(R,id,i+1)).join('')}
  <div class="grid g2"><div class="card"><h3>All nine paths</h3>${pathRanking(R)}</div><div class="card"><h3>How you like to work</h3><p class="note" style="margin-top:0">From your interest ratings, 0–100.</p>${dimBars(R.dim)}</div></div>
  <div class="card"><h3>What next</h3>${B('next',`<ol><li>Open <a href="#/m/l02">Choose a direction</a> to turn these results into a decision memo.</li><li>Add two people doing your top path to <a href="#/pipeline/net">Network</a> and ask for a 20-minute call.</li><li>Start the track that closes your biggest skill gap: <a href="#/track/${PATH[top[0]].track}">${esc(TRACKS.find(x=>x.id===PATH[top[0]].track).name)}</a>.</li></ol>`,{tr:PATH[top[0]].track,tn:esc(TRACKS.find(x=>x.id===PATH[top[0]].track).name)})}</div>
  ${c.hist.length>1?`<div class="card"><h3>How your results changed</h3>${c.hist.slice().reverse().map(h=>`<div class="note">${new Date(h.t).toLocaleDateString('en-GB')} · ${h.top.map(([id,f])=>esc(PATH[id].name)+' '+f).join(' · ')}</div>`).join('')}</div>`:''}
  <p class="note">Compass is self-report. It reflects how you see yourself today; experience will sharpen it.</p>`}

{id:'l01',track:'launch',title:'Map the market: where electronics engineers work',mins:35,blurb:'Which Saudi sectors hire electrical engineers like you, why they are hiring now, and how to build a target list.',
 lab:{key:'market',name:'Build your target-employer map',intro:'Turn sectors into named employers. Each one you add lands in your Pipeline.'},
 cards:[
  {h:'Hiring follows national programmes',b:`<p>Most new electronics jobs in Saudi Arabia come from <b>localisation</b>: the state wants more of what it buys (defence systems, vehicles, telecom equipment, chips) to be designed and made locally. Every localisation target creates demand for Saudi engineers who can work with hardware and embedded software.</p><p>Understanding <i>why</i> a company is hiring lets you speak its language in an interview.</p>`},
  {h:'The sectors that fit your profile',b:`<ul><li><b>Defence and security electronics:</b> radar, communications, electronic warfare, test systems.</li><li><b>Aerospace and UAV:</b> avionics, sensors, autonomy. Closest to your LiDAR work.</li><li><b>Automotive and EV:</b> new vehicle plants need electronics, validation and quality engineers.</li><li><b>Telecom and networks:</b> operators and vendors; networks and security.</li><li><b>Industrial automation and energy:</b> controllers, instrumentation, OT systems.</li><li><b>Semiconductors and research:</b> smaller, earlier-stage, but strategic.</li></ul>`},
  {h:'Three kinds of employer',b:`<p><b>National champions</b> (large state-linked companies): structured graduate programmes, stability, clearance processes. <b>Foreign OEMs and their joint ventures</b>: strong technical training, international exposure. <b>Startups and integrators</b>: faster responsibility, less structure. A healthy target list mixes all three.</p>`},
  {h:'Entry routes for graduates',b:`<ul><li><b>Graduate development programmes</b> at large employers: rotations, training, usually annual intakes.</li><li><b>Direct entry</b> as a junior engineer: apply to specific roles.</li><li><b>On-the-job training schemes</b> such as HRDF's Tamheer, which places graduates in private-sector companies for paid training; often a bridge into a job.</li><li><b>Research engineer roles</b> at universities and national labs.</li></ul>`},
  {h:'A target list beats a job board',b:`<p>Most graduates scroll job boards and apply to whatever appears. Stronger candidates choose <b>15–25 target employers</b> first, follow them, find people who work there, and apply when roles open; often before they are widely advertised. Your list should cover at least three sectors so you are not exposed to one hiring cycle.</p>`}],
 quiz:[
  {q:'What is the main driver of new electronics engineering jobs in Saudi Arabia?',o:['Tourism growth','Localisation of what the country buys and builds','Falling oil prices','Remote work'],a:1,w:'Localisation targets in defence, automotive, telecom and semiconductors create local engineering demand.'},
  {q:'Which sector is closest to Adnan\'s LiDAR experience?',o:['Retail','Aerospace and UAV','Banking','Hospitality'],a:1,w:'Drones and autonomous systems depend on LiDAR and sensor fusion.'},
  {q:'Why mix national champions, foreign OEMs and startups in a target list?',o:['To look busy','They differ in structure, training and speed, and spread your risk','Startups always pay more','OEMs never hire Saudis'],a:1,w:'Different employer types offer different trade-offs and hiring cycles.'},
  {q:'Tamheer is best described as…',o:['A university degree','A paid on-the-job training programme placing graduates in companies','A visa type','A coding bootcamp'],a:1,w:'Run through HRDF, it can bridge graduates into employment.'},
  {q:'How many target employers is a sensible starting list?',o:['1–2','15–25','200+','Only those advertising today'],a:1,w:'Enough to cover sectors and cycles, few enough to research properly.'},
  {q:'The best reason to understand why a company is hiring is…',o:['To negotiate a higher salary immediately','To speak its language and show how you help it reach its goals','To avoid the interview','It does not matter'],a:1,w:'Linking yourself to the employer\'s mission makes you a stronger candidate.'}],
 srs:[{q:'Main driver of electronics hiring in KSA?',a:'Localisation: building locally what the country buys (defence, vehicles, telecom, chips).'},{q:'Three employer types to mix?',a:'National champions, foreign OEMs / joint ventures, startups and integrators.'},{q:'Four graduate entry routes?',a:'Graduate programmes, direct entry, on-the-job training (e.g. Tamheer), research engineer roles.'},{q:'Target list size and spread?',a:'15–25 employers across at least three sectors.'}],
 read:[{t:'Saudi Vision 2030',s:'Official programme site',u:'https://www.vision2030.gov.sa/'},{t:'Tamheer on-the-job training (HRDF)',s:'Search: current programme details',u:GS('Tamheer HRDF on-the-job training program graduates')},{t:'Find people at your target companies',s:'LinkedIn search',u:LI('embedded engineer Riyadh')}]},

{id:'l02',track:'launch',title:'Choose a direction: from Compass to a decision',mins:30,blurb:'Turn your Compass results into a 90-day direction you can test, without locking yourself in.',
 lab:{key:'decide',name:'Decision memo: your top two paths',intro:'Write the case for and against your top two paths, then commit to a direction for 90 days.'},
 cards:[
  {h:'A direction, not a destiny',b:`<p>Your first job is an experiment, not a life sentence. The goal is a direction good enough to act on for <b>90 days</b>, with built-in checks. Engineers who wait for certainty usually drift into whatever offer arrives first.</p>`},
  {h:'Passion follows skill',b:`<p>Research on job satisfaction suggests people grow to love work where they become <b>good</b>, gain <b>autonomy</b> and see <b>impact</b>. "Follow your passion" works poorly when you have not tried the work yet. So choose the path where you can build rare, valuable skills, and let interest deepen with mastery.</p>`},
  {h:'Use evidence, not imagination',b:`<p>Compass measures how you <i>imagine</i> the work. Reality checks are better: talk to two people doing the job, read real job ads, try a weekend mini-project. Each one either strengthens or weakens the case. Write down what would change your mind <i>before</i> you start.</p>`},
  {h:'Adjacent paths keep options open',b:`<p>Many paths share foundations. Embedded, perception and test all need C/C++, buses, debugging and Python. Choosing one as primary and an adjacent one as secondary lets you apply to both without diluting your story.</p>`},
  {h:'The 90-day commitment',b:`<p>Write one sentence: <i>"For the next 90 days I will target ___ roles in ___ sectors, build ___ to prove it, and review with my advisor on ___."</i> Then act on it. At the review, keep, adjust or switch, based on what you learned.</p>`}],
 quiz:[
  {q:'Why commit to a direction for 90 days rather than "forever"?',o:['It is easier to forget','It allows action now while keeping a planned review point','Employers require it','Compass expires'],a:1,w:'A bounded commitment lets you act and learn without false certainty.'},
  {q:'According to the "passion follows skill" view, satisfaction grows mainly from…',o:['Picking the most exciting title','Becoming good, gaining autonomy and seeing impact','The highest starting salary','Avoiding difficulty'],a:1,w:'Mastery, autonomy and impact are the strongest drivers.'},
  {q:'What is the best test of a path before choosing it?',o:['A personality quiz only','Talking to people doing the job and trying a small project','Asking friends what sounds good','Waiting for an offer'],a:1,w:'Direct evidence beats imagination.'},
  {q:'Why write what would change your mind in advance?',o:['To make the memo longer','To avoid moving the goalposts after the evidence comes in','Advisors require it','It is not useful'],a:1,w:'Pre-commitment protects you from confirmation bias.'},
  {q:'Embedded, perception and test engineering share…',o:['Nothing','Foundations such as C/C++, buses, debugging and Python','Only salary bands','Only employers'],a:1,w:'Adjacent paths reuse core skills, so a secondary path is cheap to keep open.'},
  {q:'If the top two Compass paths are within five points, the right next step is…',o:['Pick randomly','Gather evidence on both, e.g. one conversation in each','Retake Compass until one wins','Ignore both'],a:1,w:'Close scores mean self-report cannot separate them; reality can.'}],
 srs:[{q:'The 90-day sentence?',a:'Target ___ roles in ___ sectors, build ___ to prove it, review with advisor on ___.'},{q:'Passion follows…?',a:'Skill: mastery, autonomy and impact drive satisfaction.'},{q:'Two cheap reality checks for a path?',a:'Talk to two practitioners; do a small weekend project.'},{q:'Why keep an adjacent secondary path?',a:'Shared foundations let you apply to both without diluting your story.'}],
 read:[{t:'So Good They Can\'t Ignore You',s:'Cal Newport, 2012',n:'Career capital over passion',u:GS('So Good They Can\'t Ignore You Cal Newport summary career capital')},{t:'Designing Your Life',s:'Burnett & Evans, 2016',n:'Prototyping a career',u:GS('Designing Your Life Burnett Evans prototype conversations')},{t:'Your Compass results',s:'In this app',u:'#/compass/results'}]},

{id:'l03',track:'launch',title:'A CV that gets interviews',mins:45,blurb:'How screeners read a CV in seconds, and a line-by-line rebuild of yours.',
 lab:{key:'cvfix',name:'CV workbench',intro:'Your own CV bullets, diagnosed. Rewrite them until they pass four checks.'},
 cards:[
  {h:'Your CV gets seconds, not minutes',b:`<p>A recruiter skims for: the <b>role you want</b>, the <b>degree</b>, <b>relevant experience</b> and <b>proof</b> (numbers, named tools, links). Many large employers also use an <b>applicant tracking system</b> that filters on keywords from the advert. Clear headings and the advert's own words get you through both.</p>`},
  {h:'The bullet formula',b:`<p><b>Action verb + what you did + how + result.</b> Example: <i>"Characterised thermal behaviour of 12 LiDAR units from 25–60 °C and proposed a chassis change that cut peak temperature by ~8 °C."</i> Only use numbers that are true; if you do not know one, measure it or estimate honestly.</p>`},
  {h:'Three problems in your current CV',b:`<ul><li><b>A copy-paste error:</b> the heart-rate project's first bullet describes your LiDAR co-op work. A screener will notice and may question attention to detail.</li><li><b>No numbers</b> anywhere: no GPA, no scale, no results.</li><li><b>Under-selling verbs:</b> "managed", "basic", "assisted" for work you actually engineered.</li></ul>`},
  {h:'Structure for a graduate engineer',b:`<p>Header (name, phone, email, <b>full</b> LinkedIn and GitHub URLs) → 3-line summary naming the role you want → Education (with GPA if strong and relevant courses) → <b>Experience</b> (the co-op) → Projects → Skills → Languages. One page. Consistent dates and headings. Your Japanese is a differentiator: keep it visible.</p>`},
  {h:'One CV per path',b:`<p>Keep a master CV, then tailor a version for each target path: the perception version leads with the LiDAR work; the embedded version leads with C/C++, the ESP32 project and buses; the test version leads with the thermal and power testing. Same facts, different order and emphasis.</p>`}],
 quiz:[
  {q:'An applicant tracking system mainly…',o:['Writes your CV','Filters CVs by keywords and structure before a human reads them','Interviews you','Checks your GPA with the university'],a:1,w:'Use the advert\'s own terms and standard headings.'},
  {q:'Which bullet is strongest?',o:['Responsible for testing LiDAR units.','Assisted with thermal tests.','Characterised thermal behaviour of 12 LiDAR units and proposed a chassis change that cut peak temperature by ~8 °C.','Did many tests in different environments and presented.'],a:2,w:'Verb, scope, method and result.'},
  {q:'What is the risk of the copy-paste error in the heart-rate project?',o:['None','It suggests weak attention to detail, a key engineering trait','It improves keyword matching','It shows versatility'],a:1,w:'Screeners treat small errors as signals.'},
  {q:'The "Training" section on a graduate CV should be titled…',o:['Hobbies','Experience','References','Other'],a:1,w:'A co-op is real experience; call it that.'},
  {q:'If you do not know the exact number for a result, you should…',o:['Invent a convincing figure','Measure it, or give an honest estimate marked as approximate','Leave the bullet out entirely','Write "many"'],a:1,w:'Never invent figures; interviewers will ask about them.'},
  {q:'Why tailor a CV version per path?',o:['To hide facts','To put the most relevant evidence first for each audience','Because employers require three CVs','It is not useful'],a:1,w:'Same facts, different emphasis.'}],
 srs:[{q:'Bullet formula?',a:'Action verb + what + how + result (with a true number).'},{q:'Four checks for a bullet?',a:'Verb first, has a number, under two lines, not repeated.'},{q:'Graduate CV order?',a:'Header, summary, education, experience, projects, skills, languages.'},{q:'Why tailor per path?',a:'Lead with the evidence that matters to that audience.'}],
 read:[{t:'Applicant tracking systems',s:'Wikipedia overview',u:WIKI('Applicant_tracking_system')},{t:'Engineering resume examples and advice',s:'Search university career-centre guides',u:GS('engineering resume bullet points action verbs university career center')},{t:'Your CV workbench',s:'Open the lab in this mission',u:'#/m/l03/lab'}]},

{id:'l04',track:'launch',title:'LinkedIn and a GitHub portfolio',mins:35,blurb:'Recruiters search before they advertise. Make sure they find you, and that your projects prove what your CV claims.',
 lab:{key:'profile',name:'Headline builder and profile checklist',intro:'Build a headline recruiters search for, and work through a ten-point profile checklist.'},
 cards:[
  {h:'Recruiters search, then call',b:`<p>Many technical roles in the region are filled by recruiters searching LinkedIn for keywords and locations before, or instead of, advertising. If your headline says only "Electrical Engineering Graduate", you are invisible to a search for "embedded engineer Riyadh".</p>`},
  {h:'The headline is your search result',b:`<p>Formula: <b>target role | 2–3 strengths | proof</b>. For example: <i>Embedded & Perception Engineer | C/C++ · LiDAR · ESP32 | KSU EE, LiDAR co-op</i>. Under 120 characters. It should match the words in the jobs you want.</p>`},
  {h:'GitHub is your evidence',b:`<p>For hardware and embedded roles, a clean repository is rare among graduates and memorable. Your touchless terminal is ideal: code, a <b>README</b> with what it does and why, a wiring diagram, a photo or GIF of it working, and what you would improve. A recruiter does not read code; an engineer interviewing you will.</p>`},
  {h:'Signals of seriousness',b:`<ul><li>A clear photo and an "About" in the first person, ending with what you are looking for.</li><li>Skills pinned to match target roles.</li><li>Posts: a short write-up of a project or something you learned, every few weeks.</li><li>Connections at your target employers, with a short note when you connect.</li></ul>`},
  {h:'Consistency across documents',b:`<p>Your CV, LinkedIn and GitHub tell one story with the same facts and dates. Inconsistencies (a different job title, a missing project) make screeners hesitate.</p>`}],
 quiz:[
  {q:'Why does the LinkedIn headline matter so much?',o:['It is printed on your degree','Recruiter searches match on it, so it decides whether you appear','It sets your salary','It is not visible'],a:1,w:'The headline is your search result.'},
  {q:'Which headline is strongest for Adnan\'s targets?',o:['Student','Electrical Engineering Graduate','Embedded & Perception Engineer | C/C++ · LiDAR · ESP32 | KSU EE','Looking for any opportunity'],a:2,w:'Target role, strengths and proof, in searchable words.'},
  {q:'What makes a GitHub project useful to an interviewer?',o:['Many empty repositories','A README explaining purpose and design, a diagram, a demo, and clean code','Private repositories only','Only stars'],a:1,w:'Make it easy to understand what you built and how.'},
  {q:'The "About" section should end with…',o:['A quote','What you are looking for','Your national ID','Your hobbies list'],a:1,w:'Tell readers how to help you.'},
  {q:'Why keep CV, LinkedIn and GitHub consistent?',o:['Design reasons only','Inconsistent facts make screeners hesitate','Required by law','It is not important'],a:1,w:'One story, the same facts.'},
  {q:'How often is a reasonable cadence for a short professional post?',o:['Every hour','Every few weeks','Never','Only after getting a job'],a:1,w:'Regular but light: it signals curiosity and keeps you visible.'}],
 srs:[{q:'Headline formula?',a:'Target role | 2–3 strengths | proof, under 120 characters.'},{q:'Four parts of a strong project README?',a:'What and why, how it works (diagram), demo (photo/GIF), what you would improve.'},{q:'About section should end with?',a:'What you are looking for.'},{q:'Why does GitHub matter for hardware roles?',a:'It is rare, memorable evidence that backs your CV claims.'}],
 read:[{t:'Managing your GitHub profile README',s:'GitHub Docs',u:'https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-github-profile/customizing-your-profile/managing-your-profile-readme'},{t:'LinkedIn profile best practices',s:'LinkedIn Help',u:GS('LinkedIn Help profile best practices headline about section')},{t:'Example embedded project READMEs',s:'GitHub search',u:'https://github.com/search?q=esp32+lidar&type=repositories'}]},

{id:'l05',track:'launch',title:'Your story: the 30-second pitch and the timeline question',mins:30,blurb:'Answer "tell me about yourself" in 30 seconds, and handle the seven-year degree question calmly and briefly.',
 lab:{key:'pitch',name:'Pitch builder with timer',intro:'Write your present–past–future pitch, time it, and write your timeline answer.'},
 cards:[
  {h:'"Tell me about yourself" is a test',b:`<p>It is usually the first question, and it tests whether you can communicate clearly under mild pressure. It is <b>not</b> an invitation to recite your CV. Aim for 30–60 seconds that make the interviewer want to ask about your best project.</p>`},
  {h:'Present → past → future',b:`<p><b>Present:</b> who you are as an engineer now. <b>Past:</b> one or two proofs (the LiDAR co-op, the touchless terminal). <b>Future:</b> what you want next and why this employer. End on the future so the conversation moves forward.</p>`},
  {h:'Addressing the timeline',b:`<p>Your degree ran from 2019 to 2026. Interviewers may ask. The pattern that works: <b>brief, honest, no over-explaining, then pivot</b> to what you learned or what you did. One or two sentences. Rehearse it until it sounds calm. A long, defensive answer creates more doubt than the gap itself.</p>`},
  {h:'Turn it into an asset where true',b:`<p>If the extra time included the co-op, self-taught skills, Japanese, or projects, say so. If it was a hard period, you do not need to share details; say it was a personal or academic challenge you worked through, and point to the evidence that you are ready now: strong recent projects and the co-op.</p>`},
  {h:'Practise out loud',b:`<p>Written pitches read well and sound stiff. Say it aloud ten times, record yourself once, and cut any sentence you stumble on. Practise the timeline answer with your advisor so it no longer feels uncomfortable.</p>`}],
 quiz:[
  {q:'"Tell me about yourself" mainly tests…',o:['Your memory of your CV','Clear, confident communication under mild pressure','Your family background','Salary expectations'],a:1,w:'Keep it short, structured and forward-looking.'},
  {q:'The recommended pitch structure is…',o:['Past → present → hobbies','Present → past → future','Future → salary → past','Chronological from school'],a:1,w:'Ending on the future moves the conversation on.'},
  {q:'The best way to handle a question about a long degree is…',o:['A long detailed explanation','Avoid answering','Brief and honest, then pivot to what you learned and what you can do now','Blame the university'],a:2,w:'Short and calm; long defensive answers create doubt.'},
  {q:'Must you share personal details behind a gap?',o:['Yes, always in full','No; a brief honest framing is enough, followed by evidence of readiness','Only if asked twice','Only in writing'],a:1,w:'You control the level of detail.'},
  {q:'About how many words is a 30-second pitch?',o:['20','About 75','300','500'],a:1,w:'Roughly 2.5 spoken words per second.'},
  {q:'Why practise aloud rather than only writing?',o:['It is not necessary','Written text often sounds stiff when spoken; speaking exposes awkward parts','Interviewers prefer reading','To memorise word for word'],a:1,w:'Cut what you stumble on.'}],
 srs:[{q:'Pitch structure?',a:'Present → past (1–2 proofs) → future (why them).'},{q:'Timeline answer pattern?',a:'Brief, honest, no over-explaining, then pivot to learning and readiness.'},{q:'30-second pitch length?',a:'About 75 words.'},{q:'How to rehearse?',a:'Aloud ten times, record once, cut what you stumble on.'}],
 read:[{t:'How to answer "tell me about yourself"',s:'Harvard Business Review',u:HBRS('tell me about yourself interview')},{t:'Explaining gaps in your education or career',s:'Search: career-centre guidance',u:GS('how to explain a longer than usual degree in a job interview')},{t:'Your pitch builder',s:'Open the lab in this mission',u:'#/m/l05/lab'}]},

{id:'l06',track:'launch',title:'Networking and informational interviews',mins:35,blurb:'In Saudi engineering, introductions open doors. Learn to ask for 20 minutes of someone\'s time, and to use it well.',
 lab:{key:'outreach',name:'Outreach message builder',intro:'Draft short, specific messages and add people straight to your Network list.'},
 cards:[
  {h:'Why networking matters here',b:`<p>Many roles, especially in specialised engineering, are filled through referrals and introductions before or alongside formal advertising. A referred candidate is more likely to be interviewed. Networking is not asking for jobs; it is <b>learning from people</b> who can later vouch for you.</p>`},
  {h:'The informational interview',b:`<p>A 20-minute conversation where you ask a practitioner about their work. You learn what the job is really like (evidence for your decision memo), how their company hires, and which skills matter. You also become a name they remember.</p>`},
  {h:'Who to ask first',b:`<ul><li><b>Warm contacts:</b> family friends, your advisor's network, co-op colleagues, KSU alumni.</li><li><b>Alumni:</b> search LinkedIn for KSU electrical engineering graduates at your targets.</li><li><b>Speakers and authors:</b> people who presented or posted about work you admire; mention it specifically.</li></ul>`},
  {h:'Good questions',b:`<ul><li>What does a normal week look like in your role?</li><li>What do graduates find hardest in the first year?</li><li>Which skills separated the strongest juniors you have seen?</li><li>How does your team usually hire graduates?</li><li>Who else would you suggest I speak to?</li></ul><p>The last question turns one contact into several.</p>`},
  {h:'Follow-up is the real work',b:`<p>Send thanks the same day, mentioning one thing you learned. Act on their advice and tell them later that you did. Log what you learned in your Network list. Two conversations a week, sustained for two months, changes a job search.</p>`}],
 quiz:[
  {q:'The main purpose of an informational interview is…',o:['To ask for a job directly','To learn about the work and how hiring happens from a practitioner','To sell yourself for an hour','To get salary data only'],a:1,w:'Learning first; the relationship follows.'},
  {q:'A reasonable length to request is…',o:['Two hours','About 20 minutes','A full day','Five minutes'],a:1,w:'Small asks get more yeses.'},
  {q:'Which question multiplies your network?',o:['How much do you earn?','Who else would you suggest I speak to?','Can you get me a job?','What is your address?'],a:1,w:'One conversation leads to more.'},
  {q:'When should you send a thank-you?',o:['Never','The same day, mentioning something specific you learned','After you get a job','Only if they helped a lot'],a:1,w:'Specific and prompt.'},
  {q:'The best first contacts are usually…',o:['CEOs of large companies','Warm contacts and alumni','Random profiles','HR departments only'],a:1,w:'Shared connections raise response rates.'},
  {q:'A sustainable networking pace is about…',o:['20 a day','Two conversations a week','One per year','Only when desperate'],a:1,w:'Consistency beats bursts.'}],
 srs:[{q:'Informational interview purpose?',a:'Learn about the work and how hiring happens; build a relationship.'},{q:'Five good questions?',a:'Typical week; hardest part for graduates; skills of strong juniors; how they hire; who else to talk to.'},{q:'Follow-up rule?',a:'Thank the same day with one specific learning; later tell them what you did with their advice.'},{q:'Weekly target?',a:'Two conversations.'}],
 read:[{t:'Informational interview',s:'Wikipedia overview',u:WIKI('Informational_interview')},{t:'Find KSU electrical engineering alumni',s:'LinkedIn search',u:LI('King Saud University electrical engineering embedded')},{t:'Your Network list',s:'In this app',u:'#/pipeline/net'}]},

{id:'l07',track:'launch',title:'Reading job ads and passing the screen',mins:30,blurb:'Decode an advert into must-haves and nice-to-haves, and apply in a way that gets past the first filter.',
 lab:{key:'jobad',name:'Sort a real-style job advert',intro:'Classify ten advert lines, then compare with the reasoning.'},
 cards:[
  {h:'Adverts mix three kinds of line',b:`<p><b>Must-haves</b> are screened hard (degree, core language, eligibility). <b>Nice-to-haves</b> are wish lists; graduates who meet most must-haves and some nice-to-haves should apply. <b>Culture signals</b> ("fast-paced", "team player") tell you which stories to prepare.</p>`},
  {h:'Apply when you meet the core',b:`<p>A common mistake is waiting until you match every line. If you meet the must-haves and a reasonable share of the rest, apply, and use your cover note or summary to address the most important gap ("I am building an RTOS project to strengthen…").</p>`},
  {h:'Mirror the language',b:`<p>Applicant tracking systems and busy screeners look for the advert's own words. If the advert says "C/C++ for microcontrollers" and your CV says "Arduino IDE", you may not match. Use the precise terms truthfully, in your summary and skills.</p>`},
  {h:'Eligibility and clearance',b:`<p>Defence and some government-linked roles require nationality and security clearance, which can lengthen the process. Apply early and keep other applications moving while you wait.</p>`},
  {h:'Track everything',b:`<p>Log each application in your Pipeline with the date, the version of your CV, the contact and the next step. Follow up politely after one to two weeks if you have a contact. A tracked search is faster and less stressful than a scattered one.</p>`}],
 quiz:[
  {q:'"Proficiency in C/C++ for microcontrollers" in an embedded advert is most likely…',o:['A culture signal','A must-have','Irrelevant','A nice-to-have'],a:1,w:'Core to the role and likely tested.'},
  {q:'"Eager to learn in a fast-paced environment" is…',o:['A must-have skill','A culture signal: prepare a story that shows it','A hard filter','A salary indicator'],a:1,w:'Show it with evidence.'},
  {q:'Should a graduate apply if they meet the must-haves but only some nice-to-haves?',o:['No, never','Yes, and address the key gap briefly','Only if a friend works there','Only after a master\'s'],a:1,w:'Waiting for a perfect match loses opportunities.'},
  {q:'Why mirror the advert\'s wording?',o:['To copy text dishonestly','Screening systems and readers look for those exact terms; use them truthfully','It is required by law','It is not useful'],a:1,w:'Precise, truthful keyword alignment.'},
  {q:'Clearance-required roles mean you should…',o:['Avoid them','Apply early and keep other applications moving','Wait for one before applying elsewhere','Ignore the requirement'],a:1,w:'They take longer; parallelise.'},
  {q:'What should you log for each application?',o:['Nothing','Date, CV version, contact and next step','Only the company name','Only rejections'],a:1,w:'Tracking enables timely follow-up.'}],

{id:'l08',track:'launch',title:'Behavioural interviews: STAR stories',mins:40,blurb:'Most interviews include "tell me about a time…". Prepare five true stories you can adapt to any question.',
 lab:{key:'star',name:'STAR story bank',intro:'Write at least three complete stories from your co-op and projects.'},
 cards:[
  {h:'Past behaviour predicts future behaviour',b:`<p>Behavioural questions ("Tell me about a time you…") are used because how you acted before is a reasonable predictor of how you will act again. Interviewers score structure, ownership and results.</p>`},
  {h:'The STAR structure',b:`<p><b>Situation</b> (one or two sentences of context) → <b>Task</b> (your responsibility) → <b>Action</b> (what <i>you</i> did, step by step: the longest part) → <b>Result</b> (what changed, ideally with a number, and what you learned).</p>`},
  {h:'Common traps',b:`<ul><li>Too much situation, too little action.</li><li>"We" throughout, so your contribution is invisible.</li><li>No result, or a vague one ("it went well").</li><li>Stories that run over two minutes.</li></ul>`},
  {h:'A bank of five covers most questions',b:`<p>Prepare five stories: a hard technical problem, attention to detail, working under constraints, teamwork or conflict, and learning something fast. Each can be adapted: the LiDAR testing story can answer questions about pressure, rigour or presenting results.</p>`},
  {h:'Engineering-specific stories',b:`<p>Engineering interviewers love specifics: the datasheet you checked, the measurement that surprised you, the trade-off you chose. Include one technical detail per story; it signals that you really did the work.</p>`}],
 quiz:[
  {q:'In STAR, which part should be longest?',o:['Situation','Task','Action','Result'],a:2,w:'Interviewers score what you did.'},
  {q:'Why say "I" rather than "we" in the Action?',o:['It sounds arrogant but is required','It makes your own contribution visible','Interviewers dislike teams','It is shorter'],a:1,w:'Credit the team briefly, then describe your part.'},
  {q:'A strong Result includes…',o:['"It went well"','A concrete outcome, ideally a number, and what you learned','Nothing; results are optional','Your grade'],a:1,w:'Concrete and measurable.'},
  {q:'How many prepared stories cover most behavioural questions?',o:['One','About five, adapted as needed','Twenty','None; improvise'],a:1,w:'A small, flexible bank.'},
  {q:'A good target length for a spoken STAR story is…',o:['10 seconds','About 90 seconds to two minutes','Five minutes','Ten minutes'],a:1,w:'Long enough for detail, short enough to hold attention.'},
  {q:'Why add one technical detail to each story?',o:['To confuse the interviewer','It signals you really did the work','It is required','To fill time'],a:1,w:'Specifics build credibility.'}],
 srs:[{q:'STAR?',a:'Situation, Task, Action (longest, "I"), Result (concrete, with learning).'},{q:'Four STAR traps?',a:'Too much situation; "we"; vague result; too long.'},{q:'Five stories to prepare?',a:'Hard technical problem, attention to detail, constraints, teamwork or conflict, fast learning.'},{q:'Credibility booster?',a:'One technical detail per story.'}],
 read:[{t:'The STAR method',s:'Wikipedia overview',u:WIKI('Situation,_task,_action,_result')},{t:'Behavioural interview questions for engineers',s:'Search: common questions',u:GS('behavioral interview questions for embedded engineers examples')},{t:'Your STAR bank',s:'Open the lab in this mission',u:'#/m/l08/lab'}]},

{id:'l09',track:'launch',title:'Technical interviews for embedded and hardware roles',mins:45,blurb:'What embedded interviewers ask, how to think aloud, and a drill of twelve core questions with model answers.',
 lab:{key:'drill',name:'Technical drill: 12 core questions',intro:'Answer aloud, reveal the model answer, score yourself.'},
 cards:[
  {h:'What gets tested',b:`<ul><li><b>C fundamentals:</b> pointers, volatile, bit manipulation, memory.</li><li><b>Microcontroller concepts:</b> interrupts, timers, DMA, peripherals.</li><li><b>Buses:</b> UART, SPI, I2C, CAN.</li><li><b>Circuits:</b> pull-ups, decoupling, simple analog.</li><li><b>Debugging approach:</b> how you find a fault.</li><li><b>Your projects:</b> they will go deep on one.</li></ul>`},
  {h:'Think aloud',b:`<p>Interviewers score your <b>reasoning</b> as much as the answer. State assumptions, sketch the system, try the simple case first, and say what you would measure. "I am not sure, but I would check X by doing Y" is far better than silence.</p>`},
  {h:'Know your own projects cold',b:`<p>Expect: why the ESP32? Why that sensor? What was the data rate over serial? How did your debounce work? What would you change? Re-read your code and prepare a one-minute walkthrough with a diagram.</p>`},
  {h:'Common practical tests',b:`<p>Writing a small C function (reverse bits, ring buffer, parse a packet), reading a datasheet excerpt, or debugging a provided snippet. Practise writing C by hand without an IDE; it reveals gaps that autocomplete hides.</p>`},
  {h:'After the interview',b:`<p>Write down every question you were asked the same day, mark the ones you struggled with, and study those. Over five interviews this becomes the best preparation material you have.</p>`}],
 quiz:[
  {q:'Variables shared between an ISR and the main loop should usually be declared…',o:['static only','volatile (and protected if access is not atomic)','const','register'],a:1,w:'volatile forces real memory access; atomicity is a separate concern.'},
  {q:'Which bus uses addressing so many devices share two wires?',o:['UART','SPI','I2C','RS-232'],a:2,w:'I2C: SDA and SCL with device addresses.'},
  {q:'If you do not know an answer in a technical interview, the best response is…',o:['Stay silent','Guess confidently','Say what you would check and how, reasoning aloud','Change the subject'],a:2,w:'Reasoning earns credit.'},
  {q:'Why practise writing C without an IDE?',o:['IDEs are banned at work','It exposes gaps that autocomplete hides, as in whiteboard tests','It is faster','It is not useful'],a:1,w:'Interviews often use paper or a plain editor.'},
  {q:'A new board does not boot. What do you check first?',o:['Rewrite the firmware','Power rails, clocks and reset, then the debug connection','Order a new board','The enclosure'],a:1,w:'Work from power outward.'},
  {q:'What is the value of noting every interview question afterwards?',o:['None','It builds a personal question bank aimed at your weak spots','To complain online','To send to HR'],a:1,w:'Your best study material.'}],
 srs:[{q:'volatile means?',a:'Value may change outside visible program flow; always access memory. Not atomic.'},{q:'UART vs SPI vs I2C?',a:'UART async point-to-point; SPI sync, fast, chip-selects; I2C two shared wires with addresses and pull-ups.'},{q:'Board will not boot: order of checks?',a:'Power, clocks, reset, debug link, boot pins, minimal firmware.'},{q:'If stuck in an interview?',a:'Reason aloud: assumptions, simple case, what you would measure.'}],
 read:[{t:'Embedded C Coding Standard',s:'Barr Group',u:GS('Barr Group Embedded C Coding Standard')},{t:'Embedded systems interview questions',s:'Search: practice sets',u:GS('embedded systems interview questions volatile interrupt DMA I2C SPI')},{t:'I2C bus',s:'Wikipedia',u:WIKI('I%C2%B2C')}]},

{id:'l10',track:'launch',title:'Offers and choosing the first job',mins:30,blurb:'How to compare offers, what to ask before accepting, and how to negotiate respectfully.',
 lab:{key:'offer',name:'Weighted offer comparison',intro:'Weight what matters to you, score up to three offers, and see where the decision really lies.'},
 cards:[
  {h:'The first job is about learning rate',b:`<p>Early in a career, the difference between two salaries matters less than the difference in <b>what you will learn</b> and <b>who will teach you</b>. A role with a strong technical lead and real responsibility can be worth more over five years than a slightly higher salary in a role with little growth.</p>`},
  {h:'Questions to ask before accepting',b:`<ul><li>Who will I report to, and can I meet them?</li><li>What will I be working on in the first six months?</li><li>How are graduates trained and evaluated?</li><li>What happened to the last few graduates in this team?</li><li>What is the full package (housing, transport, allowances, training budget)?</li></ul>`},
  {h:'Negotiating respectfully',b:`<p>Graduate offers often have little room on base salary but some on start date, training, allowances or job title. Be appreciative, specific and calm: ask once, with a reason. Never accept and then keep interviewing elsewhere as if you had not.</p>`},
  {h:'Deadlines and multiple offers',b:`<p>If you have one offer and are waiting on another, it is acceptable to ask politely for a short extension. Tell the second employer you have an offer with a deadline; this sometimes speeds them up. Be honest throughout; the industry is small.</p>`},
  {h:'Decide, then commit',b:`<p>Use a weighted comparison to think clearly, discuss it with your advisor, then commit fully. Give your first role at least 18–24 months unless something is seriously wrong; depth comes from staying long enough to own something.</p>`}],
 quiz:[
  {q:'Early in a career, which usually matters most over five years?',o:['A small salary difference','What you learn and who teaches you','Office location only','Job title wording'],a:1,w:'Learning rate compounds.'},
  {q:'Which is a good question before accepting?',o:['Can I skip training?','What will I work on in the first six months, and who will I report to?','How many days off can I take immediately?','None; just accept'],a:1,w:'It tells you about learning and management.'},
  {q:'Where is there often room to negotiate in a graduate offer?',o:['Nowhere','Start date, training, allowances or title','Only base salary','Company policy'],a:1,w:'Base salary is often fixed by band.'},
  {q:'If you need time while waiting for another offer, you should…',o:['Ignore the deadline','Ask politely for a short extension and be honest','Accept both','Lie about another offer'],a:1,w:'Honesty protects your reputation.'},
  {q:'How long should you generally stay in a first role?',o:['Three months','At least 18–24 months unless something is seriously wrong','Ten years minimum','Until the first bonus'],a:1,w:'Long enough to own something.'},
  {q:'A weighted offer comparison is best used to…',o:['Make the decision automatically','Clarify your priorities and spot trade-offs before deciding','Impress employers','Avoid talking to anyone'],a:1,w:'If the result feels wrong, revisit the weights.'}],
 srs:[{q:'First-job priority?',a:'Learning rate and quality of mentorship.'},{q:'Five pre-acceptance questions?',a:'Manager; first six months; training and evaluation; past graduates; full package.'},{q:'Negotiable items for graduates?',a:'Start date, training, allowances, title.'},{q:'Minimum stay in a first role?',a:'18–24 months, unless something is seriously wrong.'}],
 read:[{t:'15 Rules for Negotiating a Job Offer',s:'Harvard Business Review, 2014',n:'Deepak Malhotra',u:HBRS('15 rules for negotiating a job offer')},{t:'Your Pipeline',s:'In this app',u:'#/pipeline'},{t:'Talk it through with your advisor',s:'Advisor inbox',u:'#/inbox'}]}
]);

/* ================= Japanese practice mode =================
   JA_DATA (ui, tracks, m, compass, re, furi) is generated by make.py from build/src/ja/*.json.
   English stays the source of truth. In Japanese mode the mission, track and Compass texts are
   swapped in memory at boot (never saved), UI phrases are translated by exact match in the DOM,
   and furigana is added to kanji from a reading map built at build time.
   The Advisor view (follow.html) always stays in English. */
const KANJI=/[一-鿿々]/;
const JAON=()=>!FOLLOW&&typeof JA_DATA!=='undefined'&&!!state.settings&&state.settings.lang==='ja';
const t=s=>JAON()&&JA_DATA.ui[s]||s;
const B=(k,en,v)=>{let j=JAON()&&JA_DATA.ui['@'+k];if(!j)return en;if(v)for(const x in v)j=j.split('{'+x+'}').join(v[x]);return j};
const enT=(h,b)=>JAON()?`<details class="enx"><summary>EN</summary>${h?`<b>${h}</b>`:''}${b||''}</details>`:'';
const enTitle=m=>(m&&m._en&&m._en.title)||(m&&m.title)||'';
let JRE=[],FRE=null,jaObs=null;
function jaInit(){if(!JAON())return;const J=JA_DATA;document.documentElement.lang='ja';
  JRE=(J.re||[]).map(([r,s])=>[new RegExp(r),s]);
  const ks=Object.keys(J.furi).sort((a,b)=>b.length-a.length);FRE=ks.length?new RegExp(ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'):null;
  TRACKS.forEach(tr=>{const j=J.tracks[tr.id];if(j){tr._en={name:tr.name};tr.name=j.name;tr.sub=j.sub;tr.titles=j.titles}});
  Object.keys(J.m).forEach(id=>{const m=M[id],j=J.m[id];if(!m)return;m._en={title:m.title};m.title=j.title;m.blurb=j.blurb;m.lab=Object.assign({},m.lab,j.lab);
    m.cards=j.cards.map((c,i)=>({h:c.h,b:c.b,en:m.cards[i]}));m.quiz=j.quiz.map((q,i)=>({q:q.q,o:q.o,w:q.w,a:m.quiz[i].a,en:m.quiz[i]}));m.srs=j.srs.map((s,i)=>({q:s.q,a:s.a,en:m.srs[i]}));if(j.reflect)m.reflect=j.reflect;
    m.read=m.read.map((r,i)=>Object.assign({},r,j.read&&j.read[i]?{s:j.read[i]}:{}))});
  const C=J.compass;CQ_INT.forEach((q,i)=>{if(C.int[i])q[0]=C.int[i]});CQ_SCN.forEach((pr,i)=>{if(C.scn[i]){pr[0][0]=C.scn[i][0];pr[1][0]=C.scn[i][1]}});CQ_VAL.forEach((v,i)=>{if(C.val[i]){v[0]=C.val[i][0];v[1]=C.val[i][1]}});
  C.open.forEach((s,i)=>CQ_OPEN[i]=s);SKILLS.forEach(s=>{if(C.skills[s[0]])s[1]=C.skills[s[0]]});C.skl.forEach((s,i)=>SKL[i]=s);Object.keys(C.dims).forEach(k=>DIMS[k]=C.dims[k]);CPARTS.forEach(p=>{if(C.parts[p[0]])p[1]=C.parts[p[0]]});
  PATHS.forEach(p=>{const j=C.paths[p.id];if(j){p._en=p.name;Object.assign(p,j)}});LEVELS.forEach(l=>{if(J.ui[l[1]])l[1]=J.ui[l[1]]});
  const go2=()=>{if(jaObs)jaObs.takeRecords();[document.querySelector('header.top'),$('#tabs'),$('#view'),$('#toast')].forEach(e=>e&&jaPass(e));if(jaObs)jaObs.takeRecords()};
  let raf=0;jaObs=new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(go2)});
  ['header.top','#tabs','#view','#toast'].forEach(s=>{const e=document.querySelector(s);if(e)jaObs.observe(e,{childList:true,subtree:true,characterData:true})});go2()}
function furi(v){return FRE?esc(v).replace(FRE,w=>JA_DATA.furi[w]):esc(v)}
function jaPass(root){const U=JA_DATA.ui,fon=state.settings.furi!==false;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;if(!p||!p.closest||p.closest('textarea,script,style,ruby,.jf,.enx,[data-nojp]'))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{let v=n.nodeValue;const tr=v.trim();let ch=false;
    if(U[tr]){v=v.replace(tr,U[tr]);ch=true}else{for(const [re,rep] of JRE){if(re.test(tr)){v=v.replace(re,rep);ch=true;break}}}
    if(fon&&KANJI.test(v)){const s=document.createElement('span');s.className='jf';s.innerHTML=furi(v);n.replaceWith(s)}else if(ch)n.nodeValue=v});
  root.querySelectorAll&&root.querySelectorAll('[placeholder]').forEach(e=>{const p=e.getAttribute('placeholder');if(U[p])e.setAttribute('placeholder',U[p])})}
