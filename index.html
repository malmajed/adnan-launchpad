const CVFIX=['Rename "Training" to "Experience"','Put the full LinkedIn URL (it is cut off)','Add GPA if 3.5/5 or above (or 2.75/4)','One date format everywhere (e.g. Jun 2026 – Aug 2026)','Consistent heading style and bullet symbols','Add a GitHub link with the touchless-terminal code','Summary names the roles you want, not only your degree','Fits on one page with clear white space'];
const VERBS=/^(built|designed|developed|engineered|implemented|tested|validated|debugged|reduced|improved|increased|optimi[sz]ed|automated|integrated|deployed|led|wrote|created|characteri[sz]ed|measured|analy[sz]ed|corrected|redesigned|prototyped|programmed|ported|calibrated|delivered|identified|achieved)\b/i;
function cvCheck(t,all){const x=(t||'').trim();return{verb:VERBS.test(x),num:/\d/.test(x),len:x.length>=60&&x.length<=230,uniq:all.filter(y=>y.trim()&&y.trim()===x).length<=1}}
LABS.cvfix=(el,m,done)=>{state.cv=state.cv||{};const cv=state.cv;cv.b=cv.b||CV0.map(b=>'');cv.fix=cv.fix||{};
  const draw=()=>{const all=cv.b;el.innerHTML=`${B('cvintro',`<p class="note">These are the bullets from your current CV with a diagnosis. Rewrite each one. A strong bullet <b>starts with a verb</b>, <b>contains a number</b> (scale, speed, accuracy, count), stays <b>under two lines</b>, and is <b>not repeated</b>. Only use numbers that are true; if you do not know one, measure it or estimate honestly ("~").</p>`)}
    ${CV0.map((b,i)=>{const k=cvCheck(all[i],all);return`<div class="card" style="padding:12px 14px;margin:8px 0"><div class="eyebrow">${esc(b.s)}</div><p class="note" style="margin:4px 0"><s>${esc(b.o)}</s></p><p style="margin:4px 0;font-size:.88rem;color:var(--bad)">${esc(b.f)}</p><textarea data-cv="${i}" style="min-height:64px" placeholder="Your rewrite…">${esc(all[i]||'')}</textarea><div class="row note" style="gap:10px;font-size:.8rem"><span>${k.verb?'✅':'⬜'} verb first</span><span>${k.num?'✅':'⬜'} has a number</span><span>${k.len?'✅':'⬜'} length</span><span>${k.uniq?'✅':'⬜'} unique</span></div></div>`}).join('')}
    <div class="card" style="padding:12px 14px"><h3>Summary (3 lines)</h3><textarea id="cvsum" placeholder="Name the role you want, your strongest proof, and what you bring.">${esc(cv.sum||'')}</textarea></div>
    <div class="card" style="padding:12px 14px"><h3>Format fixes</h3>${CVFIX.map((f,i)=>`<label class="goal"><input type="checkbox" data-fx="${i}" ${cv.fix[i]?'checked':''}><span>${f}</span></label>`).join('')}</div>
    <div class="ctl"><button class="sbtn" id="cvs">Save and check</button><span class="note" id="cvm"></span></div>`;
    $$('[data-fx]',el).forEach(x=>x.onchange=()=>{cv.fix[x.dataset.fx]=x.checked;save()});
    $('#cvs',el).onclick=()=>{$$('[data-cv]',el).forEach(t=>cv.b[+t.dataset.cv]=t.value.trim());cv.sum=$('#cvsum',el).value.trim();cv.t=Date.now();save();const ok=CV0.filter((_,i)=>{const k=cvCheck(cv.b[i],cv.b);return k.verb&&k.num&&k.len&&k.uniq}).length;const fx=Object.values(cv.fix).filter(Boolean).length;draw();
      $('#cvm',el).textContent=`${ok}/6 bullets pass all four checks · ${fx}/8 format fixes.`;if(ok>=5&&fx>=6&&cv.sum.length>60){logEvent('cv','l03','CV rewritten');done()}}};draw()};
function cvAdvisorHTML(s){const cv=s.cv||{};if(!cv.b||!cv.b.some(Boolean))return'';return`<div class="card"><h3>CV workbench</h3>${cv.sum?`<p><b>Summary:</b> ${esc(cv.sum)}</p>`:''}${CV0.map((b,i)=>cv.b[i]?`<div style="margin:8px 0"><small class="muted">${esc(b.s)} · was: ${esc(b.o.slice(0,70))}…</small><br>${esc(cv.b[i])}</div>`:'').join('')}<p class="note">Format fixes done: ${Object.values(cv.fix||{}).filter(Boolean).length}/8</p></div>`}

LABS.profile=(el,m,done)=>{const C0=CUST('profile');C0.c=C0.c||{};const L=['Professional photo and a simple banner','Headline written (see builder below)','About section: 4–6 lines, first person, ends with what you are looking for','Experience entry for the co-op with 2–3 bullets from your CV','Projects section: touchless terminal and heart-rate monitor, with links','Skills: top 5 pinned are the ones your target roles ask for','Open to Work set to the roles and cities you want (recruiters only, if you prefer)','GitHub: touchless-terminal repo with a README, wiring diagram, a GIF or photo','GitHub profile README: who you are, what you build, how to reach you','Five or more connections at your target employers'];
  el.innerHTML=`<h3 style="margin-top:0">Headline builder</h3>${B('hl',`<p class="note">Formula: <b>target role</b> | <b>2–3 strengths</b> | <b>proof</b>. Under 120 characters.</p>`)}<div class="grid g3"><input class="tin" id="h1" placeholder="Embedded & Perception Engineer" value="${esc(C0.h1||'')}"><input class="tin" id="h2" placeholder="C/C++ · LiDAR · ESP32" value="${esc(C0.h2||'')}"><input class="tin" id="h3" placeholder="KSU EE '26 · LiDAR co-op" value="${esc(C0.h3||'')}"></div><div class="readout" id="hl" style="margin-top:8px"></div>
   <h3>Profile checklist</h3>${L.map((x,i)=>`<label class="goal"><input type="checkbox" data-pc="${i}" ${C0.c[i]?'checked':''}><span>${x}</span></label>`).join('')}<div class="note" id="pcm"></div>`;
  const upd=()=>{['h1','h2','h3'].forEach(k=>C0[k]=$('#'+k,el).value.trim());const h=[C0.h1,C0.h2,C0.h3].filter(Boolean).join(' | ');$('#hl',el).innerHTML=h?`<b>${esc(h)}</b> <small class="muted">(${h.length} chars${h.length>120?', too long':''})</small>`:'Your headline appears here.';const n=Object.values(C0.c).filter(Boolean).length;$('#pcm',el).textContent=n+'/10 done';save();if(n>=8&&h.length>20&&h.length<=120)done()};
  $$('#h1,#h2,#h3',el).forEach(i=>i.oninput=upd);$$('[data-pc]',el).forEach(x=>x.onchange=()=>{C0.c[x.dataset.pc]=x.checked;upd()});upd()};

LABS.pitch=(el,m,done)=>{const C0=CUST('pitch');
  el.innerHTML=`${B('pitchintro',`<p class="note">Present → past → future, about 75 words (30 seconds at a calm pace). Then write your honest one-line answer to "Your degree took seven years. Why?" and pivot to what you learned.</p>`)}
   <label class="f">Present: who you are now</label><textarea id="p1" style="min-height:56px" placeholder="I'm an electrical engineer from KSU who builds sensing systems…">${esc(C0.p1||'')}</textarea>
   <label class="f">Past: your strongest proof</label><textarea id="p2" style="min-height:56px" placeholder="At my co-op I tested LiDAR units… and I built…">${esc(C0.p2||'')}</textarea>
   <label class="f">Future: what you want and why them</label><textarea id="p3" style="min-height:56px" placeholder="I'm looking for an embedded or perception role where…">${esc(C0.p3||'')}</textarea>
   <div class="readout" id="pw"></div><div class="ctl"><button class="sbtn alt" id="pt">▶ Practise with a 30-second timer</button><span class="timer" id="ptm"></span></div>
   <label class="f">The timeline answer (one or two sentences: honest, short, then pivot)</label><textarea id="p4" style="min-height:56px" placeholder="State the reason briefly and factually, then: …and what I took from it is…">${esc(C0.p4||'')}</textarea>`;
  let tt=null;const upd=()=>{['p1','p2','p3','p4'].forEach(k=>C0[k]=$('#'+k,el).value.trim());const w=[C0.p1,C0.p2,C0.p3].join(' ').split(/\s+/).filter(Boolean).length;$('#pw',el).innerHTML=`<b>${w} words</b> · ~${Math.round(w/2.5)} seconds. ${w<60?'A little short.':w>100?'Too long: cut to the strongest proof.':'Good length.'}`;save();if(w>=60&&w<=100&&C0.p4.split(/\s+/).length>=12)done()};
  $$('textarea',el).forEach(t=>t.oninput=upd);upd();
  $('#pt',el).onclick=()=>{clearInterval(tt);let s=30;$('#ptm',el).textContent=s+'s';tt=setInterval(()=>{s--;$('#ptm',el).textContent=s>0?s+'s':'Time';if(s<=0){clearInterval(tt);logEvent('pitch','l05','Practised pitch')}},1000)}};

LABS.outreach=(el,m,done)=>{const C0=CUST('outreach');C0.n=C0.n||0;
  el.innerHTML=`${B('outintro',`<p class="note">Write a short, specific message asking for a 20-minute conversation. Not a job request: a request to learn. Fill the fields; the draft builds itself. Edit it so it sounds like you.</p>`)}
   <div class="grid g2"><div><label class="f">Their first name</label><input class="tin" id="o1"></div><div><label class="f">Their role and company</label><input class="tin" id="o2" placeholder="firmware engineer at …"></div><div><label class="f">Connection or reason you chose them</label><input class="tin" id="o3" placeholder="KSU alumnus / your talk on … / Dr. Mohammed suggested I reach out"></div><div><label class="f">What you want to understand</label><input class="tin" id="o4" placeholder="what the first two years in perception work look like"></div></div>
   <label class="f">Draft</label><textarea id="od" style="min-height:150px"></textarea><div class="ctl"><button class="sbtn alt" id="ocp">Copy</button><button class="sbtn" id="oad">Add to Network</button><span class="note" id="om">${C0.n} added from this lab</span></div>`;
  const build=()=>{const v=k=>$('#'+k,el).value.trim();$('#od',el).value=`Hello ${v('o1')||'[name]'},\n\nI'm Adnan, an electrical engineering graduate from King Saud University. ${v('o3')?v('o3').replace(/^./,c=>c.toUpperCase())+'. ':''}I noticed you work as ${v('o2')||'[role and company]'}, and I'm exploring this direction after a co-op testing LiDAR units and a project streaming LiDAR depth data from an ESP32.\n\nWould you be open to a 20-minute call in the next two weeks? I'd value your view on ${v('o4')||'[what you want to understand]'}.\n\nThank you,\nAdnan Alabdullatif`};
  $$('#o1,#o2,#o3,#o4',el).forEach(i=>i.oninput=build);build();
  $('#ocp',el).onclick=()=>{try{navigator.clipboard.writeText($('#od',el).value)}catch(e){}toast('Draft copied')};
  $('#oad',el).onclick=()=>{const n=$('#o1',el).value.trim();if(!n){toast('Add their name');return}state.contacts.push({id:uid(),n,r:$('#o2',el).value.trim(),via:$('#o3',el).value.trim(),path:'',status:'To contact',learned:'Draft: '+$('#od',el).value.slice(0,400),t:Date.now()});C0.n++;save();$('#om',el).textContent=C0.n+' added from this lab';toast('Added to Network');if(C0.n>=2)done()}};

LABS.jobad=(el,m,done)=>classifyLab(el,done,{intro:'A fictional advert: <b>Embedded Software Engineer, defence electronics, Riyadh</b>. Sort each line. Must-haves are screened hard; nice-to-haves are where a strong graduate can still win.',cats:['Must-have','Nice-to-have','Culture / soft signal'],
 items:[['B.Sc. in Electrical, Computer or Electronics Engineering','Must-have','Hard filter, often checked first.'],['Proficiency in C/C++ for microcontrollers','Must-have','Core of the job; expect a technical test.'],['Experience with RTOS (FreeRTOS, Zephyr or similar)','Nice-to-have','Graduates rarely have it; a small RTOS project closes the gap.'],['Familiarity with communication buses: UART, SPI, I2C, CAN','Must-have','Basic embedded literacy; interviewers probe it.'],['Exposure to DO-178C or MIL-STD standards','Nice-to-have','Learned on the job; awareness is a plus.'],['Saudi national (security clearance required)','Must-have','Eligibility filter in defence roles.'],['Comfortable working in cross-functional teams','Culture / soft signal','Prepare a STAR story about integration with others.'],['Eager to learn and grow in a fast-paced environment','Culture / soft signal','Show it with evidence of self-driven projects.'],['Experience with Altium or similar PCB tools','Nice-to-have','You have this: put it where the screener sees it.'],['0–2 years of experience','Must-have','Graduate level: co-op and projects count as experience.']],
 why:'Match your CV wording to the must-haves (applicant tracking systems scan for them), then use projects to cover nice-to-haves.',pass:8});

const STARQ=[['Testing under pressure','Your LiDAR thermal and power testing at the co-op'],['Attention to detail','Finding and correcting errors in the NXP board schematics'],['Solving a hard technical problem','Streaming 64-zone depth data and building debounce and ROI logic'],['Working within constraints','Fitting the heart-rate monitor into limited RAM'],['Learning something new fast','Learning Japanese, or a tool you taught yourself']];
LABS.star=(el,m,done)=>{state.stories=state.stories||[];const S=state.stories;
  el.innerHTML=`${B('star',`<p class="note">Build at least <b>three</b> STAR stories from your real experience. Keep each to about 90 seconds spoken. The Action is the longest part and uses "I", not "we". The Result is concrete: a number, a decision someone made, or what changed.</p>`)}
   ${STARQ.map(([c,h],i)=>{const s=S[i]||{};return`<div class="card" style="padding:12px 14px;margin:8px 0"><div class="eyebrow">${c}</div><p class="note" style="margin:4px 0">Suggested: ${h}</p>${[['s','Situation'],['t','Task'],['a','Action (what you did)'],['r','Result']].map(([k,l])=>`<label class="f">${l}</label><textarea data-st="${i}_${k}" style="min-height:${k==='a'?80:50}px">${esc(s[k]||'')}</textarea>`).join('')}<div class="note" data-sk="${i}"></div></div>`}).join('')}
   <div class="ctl"><button class="sbtn" id="sts">Save and check</button><span class="note" id="stm"></span></div>`;
  const chk=i=>{const s=S[i]||{};const ok={all:['s','t','a','r'].every(k=>(s[k]||'').length>15),i:/\bI\b/.test(s.a||''),res:/\d/.test(s.r||'')||(s.r||'').length>60};return ok};
  const show=()=>STARQ.forEach((_,i)=>{const k=chk(i);$(`[data-sk="${i}"]`,el).textContent=`${k.all?'✅':'⬜'} all four parts · ${k.i?'✅':'⬜'} "I" in the action · ${k.res?'✅':'⬜'} concrete result`});show();
  $('#sts',el).onclick=()=>{$$('[data-st]',el).forEach(t=>{const [i,k]=t.dataset.st.split('_');S[+i]=S[+i]||{c:STARQ[+i][0]};S[+i][k]=t.value.trim()});save();show();const n=STARQ.filter((_,i)=>{const k=chk(i);return k.all&&k.i&&k.res}).length;$('#stm',el).textContent=n+' complete stories';if(n>=3){logEvent('star','l08',n+' STAR stories');done()}}};
function storiesAdvisorHTML(s){const S=(s.stories||[]).filter(x=>x&&x.a);if(!S.length)return'';return`<div class="card"><h3>STAR stories</h3>${S.map(x=>`<div style="margin:10px 0"><b>${esc(x.c||'')}</b><p class="note" style="margin:2px 0"><b>S</b> ${esc(x.s||'')} <b>T</b> ${esc(x.t||'')}</p><p style="margin:2px 0"><b>A</b> ${esc(x.a||'')}</p><p style="margin:2px 0"><b>R</b> ${esc(x.r||'')}</p></div>`).join('')}</div>`}

const DRILL=[
 ['What does the <code>volatile</code> keyword tell the compiler, and when do you need it?','It tells the compiler the value can change outside the program\'s visible flow, so every access must really read or write memory. Needed for hardware registers, variables shared with an ISR, and memory shared between threads or cores. It does not make access atomic.'],
 ['What should an interrupt service routine avoid, and why?','Keep it short: no blocking calls, no long loops, no printf, usually no dynamic allocation. Set a flag or push to a buffer and let the main loop or a task do the work. Long ISRs delay other interrupts and break timing.'],
 ['Compare UART, SPI and I2C.','UART: asynchronous, two wires, point-to-point, agreed baud rate. SPI: synchronous, full duplex, fast, one chip-select per device. I2C: two wires shared by many devices with addresses, slower, open-drain with pull-ups, acknowledgements.'],
 ['Why does I2C need pull-up resistors, and how do you size them?','Lines are open-drain: devices only pull low, so resistors pull high. Smaller values give faster rise times but more current; the bus capacitance and speed mode set the range (often a few kΩ).'],
 ['How would you debounce a mechanical button?','Hardware: RC filter plus Schmitt trigger. Software: sample at a fixed rate and accept a change only after it is stable for N samples (e.g. 10–20 ms), or use a state machine. Avoid blocking delays in an ISR.'],
 ['Polling versus interrupts: when would you choose each?','Polling is simple and predictable when events are frequent or timing is fixed. Interrupts suit rare or asynchronous events and save power. Very high-rate data usually goes to DMA.'],
 ['What is DMA and why use it?','Direct memory access moves data between peripherals and memory without the CPU, e.g. ADC samples or a UART stream into a buffer. It frees the CPU and reduces jitter; you handle completion with an interrupt.'],
 ['A sensor reading is noisy. Walk through your approach.','Check the hardware first (grounding, decoupling, reference, sampling rate versus the signal), then filter: averaging or a moving average, a low-pass IIR, a median filter for spikes, a Kalman filter when you have a model. Measure before and after.'],
 ['What is a race condition? Give an embedded example.','A bug where the result depends on timing. Example: main loop reads a 32-bit counter in two halves on an 8-bit MCU while an ISR updates it. Fix with a critical section, atomic access, or a double-read check.'],
 ['How does a time-of-flight LiDAR measure distance?','It emits light pulses (or modulated light) and measures the round-trip time or phase shift; distance = c × t / 2. Accuracy depends on timing resolution, signal strength, ambient light and target reflectivity.'],
 ['What would you check first when a new board does not boot?','Power rails and current draw, clocks and reset line, the programming or debug connection, boot pins, then firmware: start from a minimal blink. Work from power outward.'],
 ['Explain stack versus heap in an embedded system.','The stack holds local variables and call frames and grows automatically; overflow corrupts memory silently. The heap is dynamic allocation, which fragments and is often avoided or restricted in embedded and safety-critical code.']];
LABS.drill=(el,m,done)=>{const C0=CUST('drill');C0.s=C0.s||{};let i=0;
  const draw=()=>{const n=Object.keys(C0.s).length;const [q,a]=DRILL[i];el.innerHTML=`<p class="note">Answer aloud first, as if in the interview (60–90 seconds). Then reveal the model answer and score yourself honestly. ${n}/${DRILL.length} scored.</p><div class="card concept"><div class="eyebrow">Question ${i+1} of ${DRILL.length}</div><h3 style="font-family:var(--sans);font-size:1.02rem">${q}</h3><div id="ma" hidden><div class="model">${a}</div><div class="ctl">${[['Missed it',0],['Partly',1],['Nailed it',2]].map(([t,v])=>`<button class="sbtn ${C0.s[i]===v?'':'alt'} sm" data-sc="${v}">${t}</button>`).join('')}</div></div><div class="ctl"><button class="sbtn" id="rv">Show model answer</button></div></div><div class="ctl"><button class="sbtn alt" id="pv" ${i?'':'disabled'}>← Previous</button><span class="spacer"></span><button class="sbtn alt" id="nx">${i<DRILL.length-1?'Next →':'Back to start'}</button></div>`;
   $('#rv',el).onclick=()=>{$('#ma',el).hidden=false;$('#rv',el).remove()};$('#pv',el).onclick=()=>{i--;draw()};$('#nx',el).onclick=()=>{i=(i+1)%DRILL.length;draw()};
   $$('[data-sc]',el).forEach(b=>b.onclick=()=>{C0.s[i]=+b.dataset.sc;save();const k=Object.keys(C0.s).length;if(k>=8){const tot=Object.values(C0.s).reduce((x,y)=>x+y,0);logEvent('drill','l09',`Technical drill ${tot}/${k*2}`);done()}if(i<DRILL.length-1){i++;draw()}else draw()})};draw()};

LABS.offer=(el,m,done)=>{const C0=CUST('offer');const CR=[['learn','Learning and mentorship in year one',5],['path','Fit with my target path',5],['pay','Salary and benefits',3],['stab','Stability and contract terms',3],['loc','Location and commute',2],['brand','Growth and name on my CV',3]];
  C0.n=C0.n||['Offer A','Offer B','Offer C'];C0.w=C0.w||Object.fromEntries(CR.map(c=>[c[0],c[2]]));C0.s=C0.s||{};
  el.innerHTML=`${B('offerintro',`<p class="note">Weight each criterion for <b>you</b> (1–5), then score each offer (1–5). Use real offers or two plausible ones from your target list. The total is a prompt for thinking, not the answer: if the result feels wrong, your weights are telling you something.</p>`)}<div class="tablewrap"><table class="t"><tr><th>Criterion</th><th>Weight</th>${[0,1,2].map(k=>`<th><input class="tin" data-on="${k}" value="${esc(C0.n[k])}" style="min-width:90px"></th>`).join('')}</tr>${CR.map(([id,l])=>`<tr><td>${l}</td><td><input class="tin" type="number" min="1" max="5" data-w="${id}" value="${C0.w[id]}" style="width:60px"></td>${[0,1,2].map(k=>`<td><input class="tin" type="number" min="0" max="5" data-s="${k}_${id}" value="${C0.s[k+'_'+id]??''}" style="width:60px"></td>`).join('')}</tr>`).join('')}<tr><td><b>Weighted score</b></td><td></td>${[0,1,2].map(k=>`<td><b data-tot="${k}">—</b></td>`).join('')}</tr></table></div><div class="readout" id="ofr"></div>`;
  const calc=()=>{$$('[data-on]',el).forEach(x=>C0.n[+x.dataset.on]=x.value);$$('[data-w]',el).forEach(x=>C0.w[x.dataset.w]=Math.max(1,Math.min(5,+x.value||1)));$$('[data-s]',el).forEach(x=>{if(x.value!=='')C0.s[x.dataset.s]=Math.max(0,Math.min(5,+x.value));else delete C0.s[x.dataset.s]});
    const W=CR.reduce((a,c)=>a+C0.w[c[0]],0);const tot=[0,1,2].map(k=>CR.every(c=>C0.s[k+'_'+c[0]]!=null)?CR.reduce((a,c)=>a+C0.w[c[0]]*C0.s[k+'_'+c[0]],0)/W:null);
    tot.forEach((t,k)=>$(`[data-tot="${k}"]`,el).textContent=t==null?'—':t.toFixed(2));const sc=tot.map((t,k)=>[t,k]).filter(x=>x[0]!=null).sort((a,b)=>b[0]-a[0]);save();
    $('#ofr',el).innerHTML=sc.length>=2?`<b>${esc(C0.n[sc[0][1]])}</b> leads by ${(sc[0][0]-sc[1][0]).toFixed(2)}. ${sc[0][0]-sc[1][0]<.3?'That is close: decide on learning and path fit, which compound over a career.':'A clear lead, if your weights are honest.'}`:'Score at least two offers.';if(sc.length>=2)done()};
  $$('input',el).forEach(x=>x.oninput=calc);calc()};

boot();
