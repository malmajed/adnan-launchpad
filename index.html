<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Adnan">
<meta name="theme-color" content="#0B1F3A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{height:100%}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Adnan's Launchpad</title>
<style>
:root{--navy:#0B1F3A;--navy2:#13294B;--char:#1F2328;--gold:#0E7C72;--gold2:#17A897;--goldsoft:#DDF3EF;--bg:#F5F3EE;--sur:#FFFFFF;--sur2:#FAF8F3;--ink:#1A1F2B;--mut:#5B6270;--line:#E2DDD1;--ok:#2E7D4F;--oksoft:#E3F2E8;--bad:#B3261E;--badsoft:#FBE7E5;--shadow:0 1px 2px rgba(11,31,58,.06),0 4px 14px rgba(11,31,58,.06);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#3FD0BE;--gold2:#4FD6C4;--goldsoft:#0F2A2A;--bg:#08111F;--sur:#0F1B2E;--sur2:#14233A;--ink:#E7EAF0;--mut:#9AA5B6;--line:#22324C;--ok:#5CC28A;--oksoft:#12301F;--bad:#F07A72;--badsoft:#3A1714;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--gold:#3FD0BE;--gold2:#4FD6C4;--goldsoft:#0F2A2A;--bg:#08111F;--sur:#0F1B2E;--sur2:#14233A;--ink:#E7EAF0;--mut:#9AA5B6;--line:#22324C;--ok:#5CC28A;--oksoft:#12301F;--bad:#F07A72;--badsoft:#3A1714;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.65rem}h2{font-size:1.3rem}h3{font-size:1.08rem}h4{margin:0 0 .5rem;font-size:1rem}
p{margin:.35rem 0 .7rem}
small,.note{color:var(--mut);font-size:.88rem}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--gold2)}
.brand{font-family:var(--serif);font-size:1.12rem;font-weight:600;color:#fff;text-decoration:none;white-space:nowrap}
.brand b{color:var(--gold2);font-weight:600}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:#C9D2E3}
.lvl .bar{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold2);border-radius:3px;transition:width .5s}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:34px;height:34px;font-size:1rem;cursor:pointer;flex:none}
.syncDot{width:9px;height:9px;border-radius:50%;background:#6B7280;flex:none}
.syncDot.ok{background:#5CC28A}.syncDot.busy{background:var(--gold2)}.syncDot.err{background:#F07A72}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--sur);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:600 .7rem var(--sans);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;position:relative}
.tabs button span{font-size:1.25rem;line-height:1}
.tabs button.on{color:var(--gold)}
.tabs .badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:9px;font-size:.62rem;padding:0 5px;min-width:16px}
@media(min-width:900px){.tabs{top:0;bottom:auto;left:auto;right:16px;width:auto;background:none;border:0;padding:0;height:56px;align-items:center;gap:4px}.tabs button{flex-direction:row;color:#C9D2E3;font-size:.82rem;padding:6px 10px;border-radius:8px}.tabs button span{font-size:1rem}.tabs button.on{color:var(--gold2);background:rgba(255,255,255,.07)}.top{padding-right:520px;min-height:56px}main{padding-bottom:40px}.tabs .badge{right:2px;top:-2px}}
.card{background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.gold{border-top:3px solid var(--gold2)}
.grid{display:grid;gap:12px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.g2m{grid-template-columns:1fr 1fr}
.stat{background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:600 1.5rem var(--serif);color:var(--ink)}
.stat small{display:block}
.eyebrow{font:700 .7rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.sbtn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:10px;padding:10px 16px;font:600 .92rem var(--sans);cursor:pointer;min-height:42px}
:root[data-theme="dark"] .sbtn{background:var(--gold2);color:#0B1F3A;border-color:var(--gold2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sbtn{background:var(--gold2);color:#0B1F3A;border-color:var(--gold2)}}
.sbtn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.sbtn.gold{background:var(--gold2);border-color:var(--gold2);color:#0B1F3A}
.sbtn.sm{padding:6px 10px;min-height:32px;font-size:.82rem}
.sbtn:disabled{opacity:.45;cursor:default}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tin,textarea,select{width:100%;background:var(--sur2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--sans)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.tin:focus,textarea:focus,select:focus{outline:2px solid var(--gold2);outline-offset:1px}
label.f{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 4px}
.readout{background:var(--sur2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.readout.ok{background:var(--oksoft);border-color:var(--ok)}.readout.bad{background:var(--badsoft);border-color:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--sur2);border:1px solid var(--line);color:var(--mut)}
.pill.done{background:var(--oksoft);color:var(--ok);border-color:transparent}
.pill.gold{background:var(--goldsoft);color:var(--gold);border-color:transparent}
.trackhead{border-radius:14px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));margin-bottom:14px;border:1px solid #1d3560}
.trackhead h1{color:#fff}.trackhead p{color:#C9D2E3}
.tcard{display:block;text-decoration:none;color:inherit;cursor:pointer}
.tcard .ico{font-size:1.6rem}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--gold2)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;gap:12px;align-items:center;background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.mitem .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 .85rem var(--sans);background:var(--sur2);border:1px solid var(--line)}
.mitem.done .n{background:var(--gold2);color:#0B1F3A;border-color:var(--gold2)}
.mitem.lock{opacity:.55;cursor:default}
.mitem .t{flex:1;min-width:0}.mitem .t b{display:block;font-weight:600}.mitem .t small{display:block}
.steps{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto}
.steps button{flex:1;min-width:0;white-space:nowrap;background:var(--sur);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font:600 .8rem var(--sans);color:var(--mut);cursor:pointer}
.steps button.on{border-color:var(--gold2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold2)}
.steps button.ok::before{content:"✓ ";color:var(--ok)}
.concept{min-height:200px}
.concept h3{font-size:1.2rem}
.concept ul{padding-left:1.2rem;margin:.3rem 0}.concept li{margin:.25rem 0}
.formula{font-family:var(--mono);background:var(--sur2);border-left:3px solid var(--gold2);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:.9rem;overflow-x:auto}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold2)}
.qopt{display:block;width:100%;text-align:left;background:var(--sur2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer}
.qopt.right{background:var(--oksoft);border-color:var(--ok)}.qopt.wrong{background:var(--badsoft);border-color:var(--bad)}
.qopt:disabled{cursor:default}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--mut);background:var(--sur2)}
.tablewrap{overflow-x:auto}
.exhibit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sur2);margin:10px 0}
.exhibit .eyebrow{margin-bottom:4px}
.casebody p{font-family:var(--serif);font-size:1.03rem;line-height:1.65}
.dropcap::first-letter{font-family:var(--serif);float:left;font-size:3rem;line-height:.9;padding:4px 8px 0 0;color:var(--gold)}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.rubric input{margin-top:4px;width:18px;height:18px;flex:none}
.model{border-left:3px solid var(--gold2);background:var(--goldsoft);padding:10px 12px;border-radius:6px;margin:8px 0}
.model ul{margin:.3rem 0;padding-left:1.2rem}
.timer{font:600 1rem var(--mono);padding:4px 10px;border-radius:8px;background:var(--sur2);border:1px solid var(--line)}
.timer.over{color:var(--bad);border-color:var(--bad)}
.tree ul{list-style:none;padding-left:18px;margin:4px 0;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border:0}
.tree li{margin:4px 0}
.tree .node{display:flex;gap:6px;align-items:center}
.tree .node input{flex:1;padding:7px 9px;font-size:.92rem}
.tree .node button{flex:none}
.slide{aspect-ratio:16/9;background:#fff;color:#1A1F2B;border:1px solid #cfd5df;border-radius:6px;padding:4.5% 5%;font-size:clamp(9px,2.1vw,14px);display:flex;flex-direction:column;gap:3%;box-shadow:var(--shadow);overflow:hidden}
.slide .st{font:600 1.25em/1.25 var(--sans);color:#0B1F3A}
.slide .sb{flex:1;display:flex;gap:4%;min-height:0}
.slide .src{font-size:.7em;color:#6b7280}
.pyr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0}
.pyr .box{background:var(--sur2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;text-align:center}
.pyr .gt{background:var(--navy);color:#fff;border-color:var(--navy);max-width:520px}
.pyr .lvl2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pyr .lvl2 .col{display:flex;flex-direction:column;gap:6px}
.pyr .sup{font-size:.78rem;background:var(--sur)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font:11px var(--sans)}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--sur)}
.bdg .e{font-size:1.7rem;filter:grayscale(1);opacity:.35}
.bdg.on .e{filter:none;opacity:1}
.bdg small{display:block;font-size:.72rem;line-height:1.25;margin-top:4px}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash .q{font:600 1.15rem var(--serif)}
.flash .a{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.goal{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.goal input[type=checkbox]{width:20px;height:20px;flex:none}
.goal span{flex:1}
.goal.done span{text-decoration:line-through;color:var(--mut)}
.reading a{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.reading a small{display:block}
.reading a b{color:var(--gold);font-weight:600}
#thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;border:1px solid var(--gold2);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:50;max-width:90vw;font-size:.92rem;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.duelLobby,.duelBoard{background:var(--sur2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.duelBoard{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duelBoard>div{background:var(--sur);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.duelBoard>div.me{border-color:var(--gold2)}
.duelBoard .dsc{display:block;font:600 1.8rem var(--serif)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.big{font:600 1.6rem var(--serif);font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sur2);border-radius:999px;padding:6px 12px;font:600 .82rem var(--sans);color:var(--ink);cursor:pointer}
.chip.on{background:var(--gold2);border-color:var(--gold2);color:#0B1F3A}
.conf{display:flex;gap:6px}.conf button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--sur2);color:var(--ink);font:600 .9rem var(--sans);cursor:pointer}.conf button.on{background:var(--gold2);color:#0B1F3A;border-color:var(--gold2)}
.followbar{background:var(--goldsoft);color:var(--ink);border:1px solid var(--gold2);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.88rem}
@media(max-width:380px){h1{font-size:1.4rem}.lvl{font-size:.7rem}}

@media(max-width:600px){.nxtlvl{display:none}.steps{gap:4px}.steps button{font-size:.74rem;padding:8px 2px}}

.g2m label.f{font-size:.78rem;min-height:2.4em}

/* ---- colour system: track colours and icon tiles ---- */
.ic{display:block;flex:none}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tc,var(--navy2));color:#fff;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tile.soft{background:color-mix(in srgb,var(--tc) 14%,var(--sur));color:var(--tc);box-shadow:none;border:1px solid color-mix(in srgb,var(--tc) 30%,transparent)}
.tile.glass{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.trk{padding:0;overflow:hidden;border:0}
.trkband{display:flex;align-items:center;gap:12px;padding:16px;color:#fff}
.trkband h3{color:#fff;margin:0}.trkband small{color:rgba(255,255,255,.85);display:block;line-height:1.35}
.trkpct{font:600 1.3rem var(--serif);color:#fff}
.trkbody{padding:12px 16px 14px}
.trkbody .prog i,.trackhead+.mlist .prog i{background:var(--tc)}
.icorow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.mini{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--sur))}
.mini.on{background:var(--tc);color:#fff}
.mitem{border-left:4px solid var(--tc,var(--line))}
.mitem.done{background:color-mix(in srgb,var(--tc) 6%,var(--sur))}
.mitem .mnum{display:block;color:var(--tc);font:700 .68rem var(--sans);letter-spacing:.06em;text-transform:uppercase}
.mitem.lock .tile{filter:grayscale(1);opacity:.6}
.mhead{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--tc) 9%,var(--sur));border:1px solid color-mix(in srgb,var(--tc) 25%,transparent);margin:6px 0 4px}
.mhead .tile{width:54px;height:54px;border-radius:14px}
.steps button{display:flex;align-items:center;justify-content:center;gap:5px}
.steps button.on{border-color:var(--tc,var(--gold2));box-shadow:inset 0 -3px 0 var(--tc,var(--gold2));color:var(--tc,var(--ink))}
.steps button.ok::before{content:none}.steps button.ok{color:var(--ok)}
[style*="--tc"] .sbtn:not(.alt):not(.gold){background:var(--tc);border-color:var(--tc);color:#fff}
[style*="--tc"] .eyebrow{color:var(--tc)}
[style*="--tc"] .prog i{background:var(--tc)}
.upnext{border-top:4px solid var(--tc)}
.upnext .tile{margin-top:2px}
.tabs button span{display:grid;place-items:center;height:24px}
@media(max-width:600px){.steps button span{display:none}.steps button{padding:9px 0}}

.trackhead p{color:rgba(255,255,255,.92)}

.kpis .stat{border-top:4px solid var(--k);background:color-mix(in srgb,var(--k) 7%,var(--sur))}
.kpis .stat:nth-child(1){--k:#C9A227}.kpis .stat:nth-child(2){--k:#E0662A}.kpis .stat:nth-child(3){--k:#0E8C8C}.kpis .stat:nth-child(4){--k:#3C5FD0}
.kpis .stat small:first-child{color:var(--k);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.7rem}

.sbtn,.qopt{scroll-margin-bottom:96px}

/* mission-icon tooltips */
.trk{overflow:visible}.trkband{border-radius:14px 14px 0 0}
.mini{position:relative;cursor:pointer;transition:transform .12s}
.mini:hover{transform:translateY(-1px);background:var(--tc);color:#fff}
.mini.off{cursor:default}
.mini[data-tip]:hover::after,.mini[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--tc);padding:6px 10px;border-radius:8px;font:600 .78rem/1.3 var(--sans);white-space:nowrap;z-index:40;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mini[data-tip]:hover::before{content:"";position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--tc);z-index:40}
.icorow .mini:nth-child(-n+2):hover::after{left:0;transform:none}
.icorow .mini:nth-child(n+12):hover::after{left:auto;right:0;transform:none}

.ico{font-size:1.4rem;width:36px;text-align:center}
html[lang=ja] body{font-family:var(--sans),"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
html[lang=ja] h1,html[lang=ja] h2,html[lang=ja] h3{font-family:var(--serif),"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
html[lang=ja] #view{line-height:1.85}
rt{font-size:.55em;font-weight:400;opacity:.8;letter-spacing:0}
details.enx{margin:10px 0 0;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:.88rem;color:var(--mut)}
details.enx summary{cursor:pointer;font:600 .75rem var(--sans);letter-spacing:.08em;color:var(--gold)}
details.enx[open] summary{margin-bottom:6px}
ruby{ruby-align:center}
.tabs button span.jf,.tabs button .jf span{display:inline;height:auto;font-size:inherit;line-height:inherit}
html[lang=ja] .tabs button{font-size:.68rem}

</style>
</head>
<body><header class="top">

<script>
/* ============================================================
   Launchpad core (from the launchpad kit)
   1) Cloud sync (Google Sheet via Apps Script web app)
   2) Photo upload to Google Drive (lab notebook)
   3) Online rooms: DUEL (seeded duels + live scores) — turn-based games use DUEL.post/get
   Requirements: a global `state` object, save()/logEvent() helpers, and
   small DOM hooks: #syncStat, #syncDot (status), #photoIn/#photoBtn/#photoMsg/#thumbs (notebook).
   ============================================================ */
/* ---------- profiles (one Sheet, one state per person) ---------- */
const USERS=[{id:'adnan',name:'Adnan'}];
const USER='adnan';
const LSKEY='adl-state';
/* ---------- state helpers ---------- */
let state={progress:{},custom:{},time:{},log:[]};try{state=Object.assign(state,JSON.parse(localStorage.getItem(LSKEY)||'{}'))}catch(e){}
function save(){state.savedAt=Date.now();try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(e){}schedulePush()}
function logEvent(type,mod,detail){state.log=state.log||[];state.log.push({t:Date.now(),type,mod,detail});if(state.log.length>200)state.log=state.log.slice(-200)}
// App must define renderTop(), renderMap(), renderParent() (can be no-ops) and parentMode.
/* ---------- cloud sync (Google Sheet via Apps Script) ---------- */
const SYNC_DEFAULT={url:'',key:'',akey:''}; // set via the device link or Settings; akey (advisor key) only on the advisor's devices
/* ---------- advisor channel: written only from the Advisor view, read by Adnan's app ---------- */
const ADV0={name:'Dr. Mohammed',notes:[],focus:'',updated:0};
let ADV=Object.assign({},ADV0);try{const a=JSON.parse(localStorage.getItem('adl-advisor')||'null');if(a)ADV=Object.assign({},ADV0,a)}catch(e){}
function setADV(a){if(!a)return;ADV=Object.assign({},ADV0,a);try{localStorage.setItem('adl-advisor',JSON.stringify(ADV))}catch(e){}}
async function advPush(){if(!SYNC.url||!SYNC.akey)throw new Error('Advisor key missing');ADV.updated=Date.now();setADV(ADV);const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:SYNC.key,akey:SYNC.akey,advisor:ADV})});const j=await r.json();if(j.error)throw new Error(j.error);return j}
let SYNC=Object.assign({},SYNC_DEFAULT);try{const o=JSON.parse(localStorage.getItem('adl-sync')||'null');if(o&&o.url)SYNC=o}catch(e){}
let pushT=null,syncStatus='off',parentMode=false;
function setSyncStatus(s,msg){syncStatus=s;const el=document.getElementById('syncStat');if(el)el.innerHTML=msg;const dot=document.getElementById('syncDot');if(dot)dot.className='syncDot '+s}
function schedulePush(){if(!SYNC.url||!USER)return;clearTimeout(pushT);pushT=setTimeout(pushState,1500)}
async function pushState(){if(!SYNC.url)return;try{setSyncStatus('busy','Saving to Drive…');const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:SYNC.key,state,device:navigator.platform,user:USER})});const j=await r.json();if(j.error)throw new Error(j.error);setSyncStatus('ok','Saved to Drive '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))}catch(e){setSyncStatus('err','Not saved to Drive: '+e.message)}}
async function pullState(){if(!SYNC.url||!USER)return false;try{setSyncStatus('busy','Loading from Drive…');const r=await fetch(SYNC.url+'?key='+encodeURIComponent(SYNC.key)+'&user='+USER+'&t='+Date.now());const j=await r.json();if(j.error)throw new Error(j.error);if(j.advisor)setADV(j.advisor);
  if(j.state&&(j.state.savedAt||0)>(state.savedAt||0)){state=Object.assign({progress:{},custom:{},time:{},log:[]},j.state);try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(e){}renderTop();renderMap();if(parentMode)renderParent();setSyncStatus('ok','Loaded from Drive (saved '+new Date(state.savedAt).toLocaleString('en-GB')+')');return true}
  setSyncStatus('ok','Drive is up to date');if((state.savedAt||0)>(j.state?j.state.savedAt||0:0))pushState();return false}catch(e){setSyncStatus('err','Could not reach Drive: '+e.message);return false}}
function saveSyncSettings(){SYNC={url:document.getElementById('syncUrl').value.trim(),key:document.getElementById('syncKey').value.trim(),akey:SYNC.akey||''};try{localStorage.setItem('adl-sync',JSON.stringify(SYNC))}catch(e){}if(SYNC.url)pullState().then(()=>pushState());else setSyncStatus('off','Cloud sync is off')}

/* ---------- lab notebook ---------- */
function setupNotebook(m){const inp=document.getElementById('photoIn'),btn=document.getElementById('photoBtn'),msg=document.getElementById('photoMsg');const draw=()=>{document.getElementById('thumbs').innerHTML=(state.photos||[]).filter(p=>p.mod===m.id).map(p=>`<a href="${p.url}" target="_blank" rel="noopener" title="${new Date(p.t).toLocaleString('en-GB')}"><img src="${p.thumb||''}" alt=""></a>`).join('')};draw();
  btn.onclick=()=>inp.click();inp.onchange=async()=>{const f=inp.files[0];if(!f)return;msg.textContent='Uploading…';try{const [big,thumb]=await Promise.all([shrink(f,1000,0.72),shrink(f,160,0.6)]);const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:SYNC.key,photo:big,mission:m.id,name:(USER||'')+' '+m.title,user:USER})});const j=await r.json();if(j.error)throw new Error(j.error);(state.photos=state.photos||[]).push({t:Date.now(),mod:m.id,url:j.url,thumb});if(state.photos.length>40)state.photos=state.photos.slice(-40);logEvent('photo',m.id,'Notebook photo');save();draw();msg.textContent='Saved to Drive ✓';toast('📷 Saved to your notebook on Drive')}catch(e){msg.textContent='Could not upload: '+e.message}inp.value=''}}
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

const SHUF=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RNG=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const DUEL={
  code(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c},
  async post(body){const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({key:SYNC.key},body))});return r.json()},
  async get(code){const r=await fetch(SYNC.url+'?key='+encodeURIComponent(SYNC.key)+'&game='+code+'&t='+Date.now());return (await r.json()).game},
  async create(game,extra){const code=this.code();const D=Object.assign({},extra||{},{code,game,seed:Math.floor(Math.random()*1e9),names:[(state.name||'Majed'),'?'],guest:false,started:false,p:[{score:0,prog:'',done:false,t:0},{score:0,prog:'',done:false,t:0}],v:0});const r=await this.post({game:code,create:true,data:D});if(!r.ok)throw 'create';return r.game},
  async join(code,name){const g=await this.get(code);if(!g)throw 'Room not found. Check the code.';if(g.guest)throw 'That room is full.';g.names[1]=name||'Player 2';g.guest=true;g.started=true;g.t0=Date.now();const r=await this.post({game:code,v:g.v,data:g});if(!r.ok)throw 'Could not join. Try again.';return r.game},
  // write my slot with conflict retry
  async update(D,me,patch){for(let k=0;k<4;k++){Object.assign(D.p[me],patch);const r=await this.post({game:D.code,v:D.v,data:D});if(r.ok){const mine=D.p[me];Object.assign(D,r.game);D.p[me]=mine;return D}if(r.conflict&&r.game){const mine=Object.assign({},D.p[me]);Object.assign(D,r.game);D.p[me]=mine;continue}throw 'net'}return D},
  poll(D,me,onChange){const id=setInterval(async()=>{try{const g=await this.get(D.code);if(g&&g.v>D.v){const mine=D.p[me];Object.assign(D,g);if(mine&&(mine.score||mine.done))D.p[me]=mine;onChange(D)}}catch(e){}},2500);return()=>clearInterval(id)},
  board(D,me){return`<div class="duelBoard">${[0,1].map(i=>`<div class="${i===me?'me':''}"><b>${i===me?'🧑‍🚀':'🧔'} ${D.names[i]}</b><span class="dsc">${D.p[i].score}</span><small>${D.p[i].done?'✅ finished':(D.p[i].prog||'…')}</small></div>`).join('')}</div>`},
  // lobby UI: renders into box, calls onStart(D,me) on both devices when the game begins
  lobby(box,game,onStart,title,extra){let stop=null;const draw=()=>{box.innerHTML=`<div class="duelLobby"><b>🌐 ${title||'Online duel'}</b> — same challenge, two devices, live scores.<div class="ctl"><button class="sbtn alt" id="dHost">Create a room</button><input id="dCode" class="tin" style="max-width:110px;text-transform:uppercase" maxlength="4" placeholder="CODE"><input id="dName" class="tin" style="max-width:150px" placeholder="your name"><button class="sbtn" id="dJoin">Join</button></div><p class="note" id="dMsg">${SYNC.url?'One player creates the room and shares the 4-letter code.':'Online needs the Drive sync set up.'}</p></div>`;
      box.querySelector('#dHost').onclick=async()=>{try{const D=await DUEL.create(game,typeof extra==='function'?extra():extra);box.innerHTML=`<div class="duelLobby">Room code: <b style="font-size:1.8rem;letter-spacing:4px">${D.code}</b><br>Waiting for the other player to join… <button class="sbtn" id="dCancel">Cancel</button></div>`;box.querySelector('#dCancel').onclick=()=>{if(stop)stop();draw()};stop=DUEL.poll(D,0,g=>{if(g.started){stop();onStart(D,0)}})}catch(e){box.querySelector('#dMsg').textContent='Could not create the room. Check the internet connection.'}};
      box.querySelector('#dJoin').onclick=async()=>{const code=box.querySelector('#dCode').value.trim().toUpperCase(),name=box.querySelector('#dName').value.trim()||'Player 2';if(code.length!==4)return;try{const D=await DUEL.join(code,name);onStart(D,1)}catch(e){box.querySelector('#dMsg').textContent=typeof e==='string'?e:'Could not join. Check the internet connection.'}}};draw();return()=>{if(stop)stop()}},
  // result panel: waits for both, then declares a winner (higher score; tie → lower time)
  result(box,D,me,onAgain){let stop=null;const draw=()=>{const a=D.p[0],b=D.p[1];const both=a.done&&b.done;let txt='';if(both){const w=a.score!==b.score?(a.score>b.score?0:1):(a.t<=b.t?0:1);const tie=a.score===b.score&&a.t===b.t;txt=tie?'🤝 It is a tie!':`🏆 <b>${D.names[w]}</b> wins!`;if(!tie&&w===me&&me===0&&!D._xp){D._xp=1;addXP(30);confetti();toast('🏆 <b>Duel won!</b> +30 XP')}if(!tie&&w===me&&me!==0)confetti();if(!D._log){D._log=1;logEvent('duel',(current&&current.id)||'rooms',D.game+' duel: '+D.names[0]+' '+a.score+' – '+b.score+' '+D.names[1]);save()}}else txt=`⏳ Waiting for <b>${D.names[a.done?1:0]}</b> to finish…`;
      box.innerHTML=`${DUEL.board(D,me)}<div class="readout">${txt}</div><div class="ctl">${both?`<button class="sbtn alt" id="dAgain">Back</button>`:''}</div>`;const ag=box.querySelector('#dAgain');if(ag)ag.onclick=()=>{if(stop)stop();onAgain()};if(both&&stop){stop();stop=null}};draw();if(!(D.p[0].done&&D.p[1].done))stop=DUEL.poll(D,me,draw);return()=>{if(stop)stop()}}
};

understand": "知りたいこと", "Draft": "下書き", "Add to Network": "人脈に追加", "Must-have": "必須", "Nice-to-have": "あれば尚可", "Culture / soft signal": "社風・ソフトスキルのサイン", "Check": "チェック", "— choose —": "— 選択 —", "Situation": "状況", "Action (what you did)": "行動(あなたがしたこと)", "Show model answer": "模範解答を見る", "Missed it": "できなかった", "Partly": "一部できた", "Nailed it": "完璧", "← Previous": "← 前へ", "Back to start": "最初に戻る", "Criterion": "基準", "Weight": "重み", "Weighted score": "加重スコア", "Learning and mentorship in year one": "一年目の学びと指導", "Fit with my target path": "目標のパスとの一致", "Salary and benefits": "給与と福利厚生", "Stability and contract terms": "安定性と契約条件", "Location and commute": "勤務地と通勤", "Growth and name on my CV": "成長と履歴書上の社名", "Score at least two offers.": "少なくとも二つのオファーを採点しましょう。", "Earned so far": "これまでの獲得", "Compass complete": "コンパス完了", "First mission": "最初のミッション", "Five missions": "ミッション5個", "Career Launch complete": "キャリア準備 完了", "Four weekly check-ins": "週のふりかえり4回", "Five applications sent": "応募5件", "First interview": "初めての面接", "First offer": "初めての内定", "Five conversations logged": "面談5回", "Perfect test score": "テスト満点", "7-day streak": "7日連続", "50 reviews": "復習50回", "First build photo": "最初の制作写真", "Hit all weekly targets": "週の目標をすべて達成", "IoT & smart cities": "IoT・スマートシティ", "All nine paths": "九つのパスすべて", "The nine paths": "九つのパス", "Fifteen minutes. It maps your interests, values and skills against nine engineering career paths in Saudi Arabia.": "15分。あなたの興味・価値観・スキルを、サウジアラビアにある九つのエンジニアのキャリアパスと照らし合わせます。", "@int": "それぞれの活動を、どれくらい<b>楽しめそう</b>ですか。得意かどうかではありません(それは後で聞きます)。1=避けたい、5=大好き。", "@cintro": "<p>方向を決める前に、コンパスはあなたが何を<b>楽しみ</b>、どう<b>働きたい</b>か、何を<b>大切に</b>し、何が<b>すでにできる</b>かを整理します。そして、サウジアラビアで電気エンジニアに開かれた九つのキャリアパスを採点します。</p><ul><li><b>短い五つのパート</b>で、約15分。回答はその都度保存されます。</li><li><b>正解はありません。</b>こうあるべきと思う自分ではなく、ありのままの自分で答えたときだけ役に立ちます。</li><li><b>これは出発点です。</b>結果はアドバイザーとの対話のきっかけであり、あなたの代わりに決めるものではありません。</li><li>いつでもやり直せます。回答の変化はアドバイザーにも見えます。</li></ul>", "@skok": "<p class=\"note\"><b>スキル:</b>中心となるスキルは、すでにプロジェクトで使えるレベル以上と自己評価しています。</p>", "@close": "上位二つのパスの差は小さいです({a}対{b})。これは大切な情報です。決める前に、両方の仕事をしている人に話を聞きましょう。", "@clear": "<b>{p}</b>があなたには際立っています。現実で確かめましょう。この仕事をしている人二人に話を聞いてください。", "@next": "<ol><li><a href=\"#/m/l02\">方向を決める</a>を開いて、この結果を決定メモにまとめましょう。</li><li>一位のパスで働いている人を二人、<a href=\"#/pipeline/net\">人脈</a>に追加して、20分の面談をお願いしましょう。</li><li>一番大きなスキルの差を埋めるトラックを始めましょう:<a href=\"#/track/{tr}\">{tn}</a>。</li></ol>", "@welcome": "<p>これはあなたのキャリアのためのプラットフォームです。あなたの履歴書と、組込みシステムとセンシングの強みをもとに作られていて、あなたのことを知るほど適応していきます。</p><ul><li><b>コンパス</b>は、あなたが楽しめること、大切にしていること、できることを整理し、九つのエンジニアのキャリアパスを順位づけします。</li><li><b>トラック</b>はミッションの集まりです。短いコンセプト、実践ラボ、自己テスト、ふりかえり。キャリア準備は使えます。技術トラックは順次公開します。</li><li><b>パイプライン</b>では、目標の企業、応募、人脈づくりを一か所で管理します。</li><li><b>週のふりかえり</b>で、様子と助けが必要なことをアドバイザーに伝えます。</li></ul><p class=\"note\"><b>誰が何を見られるか。</b>アドバイザー({adv})は、あなたの進み具合、コンパスの回答、週のふりかえり、パイプラインを見ることができ、メモやタスクを送れます。ミッションのふりかえりは、設定で共有を選ばない限り非公開です。</p>", "@market": "<p class=\"note\">下の会社名は<b>調べるための出発点</b>であり、採用中のリストではありません。各社の採用ページとLinkedInで最新の募集を確認してください。少なくとも<b>三つ</b>の業界から、<b>八社</b>以上の具体的な企業を追加しましょう。追加した企業は目標としてパイプラインに入ります。</p>", "@cvintro": "<p class=\"note\">今の履歴書の箇条書きと、その診断です。一つずつ書き直してください。強い箇条書きは、<b>動詞で始まり</b>、<b>数字を含み</b>(規模、速度、精度、件数)、<b>二行以内</b>で、<b>重複しない</b>ものです。履歴書は英語のままで書いてください。数字は本当のものだけを。分からなければ測るか、正直に概算(「~」)しましょう。</p>", "@star": "<p class=\"note\">実際の経験から、<b>三つ</b>以上のSTARストーリーを作りましょう。話して約90秒に収めます。行動の部分を一番長くし、「私たち」ではなく「私」で語ります。結果は具体的に:数字、誰かが下した判断、何が変わったか。面接に備えて英語で書くことをおすすめします。</p>", "@offerintro": "<p class=\"note\"><b>あなた</b>にとっての各基準の重み(1〜5)を決め、各オファーを採点します(1〜5)。実際のオファーか、目標リストから考えられる二社を使いましょう。合計は考えるためのきっかけで、答えではありません。結果に違和感があれば、重みが何かを教えてくれています。</p>", "@hl": "<p class=\"note\">型:<b>目標の職種</b> | <b>強み2〜3個</b> | <b>実績</b>。120文字以内。LinkedInの見出しは英語で作りましょう。</p>", "@pitchintro": "<p class=\"note\">現在 → 過去 → 未来の順に、約75語(落ち着いて話して30秒)。そのあと、「学位に7年かかったのはなぜですか」への正直な一行の答えを書き、学んだことへ話題を移します。ピッチは英語で書いて練習しましょう。</p>", "@outintro": "<p class=\"note\">20分の面談をお願いする、短くて具体的なメッセージを書きましょう。仕事の依頼ではなく、学ぶためのお願いです。項目を埋めると下書きができます(英語)。自分らしい言葉に直してください。</p>", "@decintro": "<p class=\"note\">上位二つのパスを正直に比べましょう。どちらのパスも入れ替えられます。</p>"}, "re": [["Mission (\\d+) of (\\d+)", "ミッション $1/$2"], ["^Mission (\\d+) · ✓ done$", "ミッション $1 · ✓ 完了"], ["^Mission (\\d+)$", "ミッション $1"], ["^Concept (\\d+) of (\\d+)$", "コンセプト $1/$2"], ["^Question (\\d+) of (\\d+)$", "問題 $1/$2"], ["^(\\d+) correct$", "$1問正解"], ["^(\\d+) of (\\d+) missions( · coming soon)?$", "ミッション $1/$2"], ["^(\\d+) of (\\d+) complete$", "$1/$2 完了"], ["^Coming in batch (\\d+)$", "第$1弾で公開予定"], ["^~(\\d+) min$", "約$1分"], ["^Continue · ", "続き · "], ["^Up next · ", "次は · "], ["^(\\d+) open tasks?$", "未完了のタスク $1件"], ["^Part (\\d+) of 5$", "パート $1/5"], ["^Fit (\\d+) / 100 · #(\\d+)$", "適合度 $1/100 · 第$2位"], ["^Fit (\\d+) / 100$", "適合度 $1/100"], ["^Choice (\\d+)$", "選択 $1"], ["^Interests (\\d+)$", "興味 $1"], ["^Day-in-life (\\d+)$", "仕事の一日 $1"], ["^Values (\\d+)$", "価値観 $1"], ["^Skills ready (\\d+)$", "スキル準備度 $1"], ["^You rated highly: ", "高く評価:"], ["^You chose: ", "選んだもの:"], ["^(\\d+) cards? due\\.$", "$1枚の復習カードがあります。"], ["^(\\d+)/10 done$", "$1/10 完了"], ["^(\\d+) complete stories$", "完成したストーリー $1件"], ["^(\\d+) words$", "$1語"]], "tracks": {"launch": {"name": "キャリア準備", "sub": "市場マップ、履歴書、自己紹介、人脈、面接、内定", "titles": ["市場を知る:電子エンジニアが働く場所", "方向を決める:コンパスから決断へ", "面接につながる履歴書", "LinkedInとGitHubのポートフォリオ", "自己紹介:30秒ピッチと在学期間の質問", "人脈づくりと話を聞く面談", "求人広告の読み方と書類選考", "行動面接:STARストーリー", "組込み・ハードウェア職の技術面接", "内定と最初の仕事の選び方"]}, "emb": {"name": "組込みの基礎を深める", "sub": "ファームウェア、バス、RTOS、組込みLinux、基板、試験", "titles": ["組込みC:メモリ、ポインタ、volatile", "割り込み、タイマー、リアルタイムの考え方", "バス:UART、SPI、I2C、CAN", "RTOSの基礎", "組込みLinuxの要点", "電源と低消費電力設計", "回路図から動く基板へ", "ハードウェアのデバッグ:オシロとロジアナ", "試験、検証、認定", "信頼性と安全規格"]}, "per": {"name": "認識と自律", "sub": "LiDAR、点群、センサーフュージョン、ROS 2、総まとめの制作", "titles": ["自律システムのセンサー", "LiDARの原理:飛行時間から点群へ", "点群処理", "座標系と変換", "カルマンフィルタ", "センサーフュージョン", "ROS 2の実践", "コンピュータビジョンの要点", "自己位置推定とSLAMの考え方", "総まとめ:LiDAR搭載ローバー"]}, "ind": {"name": "産業と日本", "sub": "サウジの国産化、各業界、日本のパートナー、JLPT、留学", "titles": ["国産化とビジョン2030:あなたの仕事がある理由", "防衛・航空宇宙エレクトロニクス", "自動車とEV", "半導体", "通信、ネットワーク、セキュリティ", "日本企業と働く", "ビジネス日本語へのJLPTの道", "大学院進学:日本とその先"]}}, "m": {"l01": {"title": "市場を知る:電子エンジニアが働く場所", "blurb": "あなたのような電気エンジニアを採用するサウジの業界、今採用している理由、目標企業リストの作り方。", "lab": {"name": "目標企業マップを作る", "intro": "業界を具体的な企業名に変えましょう。追加した企業はパイプラインに入ります。"}, "cards": [{"h": "採用は国の計画に従う", "b": "<p>サウジアラビアの新しい電子系の仕事の多くは<b>国産化</b>から生まれています。国が購入しているもの(防衛システム、車、通信機器、半導体)を、より多く国内で設計・製造することが目標です。国産化の目標が一つ増えるたびに、ハードウェアと組込みソフトウェアを扱えるサウジ人エンジニアの需要が生まれます。</p><p>会社が<i>なぜ</i>採用しているのかを理解すれば、面接で相手の言葉で話せます。</p>"}, {"h": "あなたのプロフィールに合う業界", "b": "<ul><li><b>防衛・安全保障エレクトロニクス:</b>レーダー、通信、電子戦、試験システム。</li><li><b>航空宇宙・UAV:</b>アビオニクス、センサー、自律。LiDARの経験に一番近い分野です。</li><li><b>自動車・EV:</b>新しい自動車工場には、電子、検証、品質のエンジニアが必要です。</li><li><b>通信・ネットワーク:</b>通信事業者とベンダー。ネットワークとセキュリティ。</li><li><b>産業オートメーションとエネルギー:</b>制御装置、計装、OTシステム。</li><li><b>半導体と研究:</b>規模は小さく初期段階ですが、戦略的です。</li></ul>"}, {"h": "三種類の雇用主", "b": "<p><b>国の代表的な企業</b>(国とつながりのある大企業):体系的な新卒プログラム、安定性、審査手続き。<b>海外メーカーとその合弁会社</b>:しっかりした技術研修、国際的な経験。<b>スタートアップとインテグレーター</b>:早く責任を持てるが、仕組みは少ない。良い目標リストは三種類を組み合わせます。</p>"}, {"h": "新卒の入り口", "b": "<ul><li>大企業の<b>新卒育成プログラム</b>:ローテーション、研修、多くは年一回の採用。</li><li>若手エンジニアとしての<b>直接採用</b>:特定の職種に応募します。</li><li>HRDFのタミールのような<b>職場での研修制度</b>:新卒を民間企業での有給研修に配置し、就職への橋渡しになることが多いです。</li><li>大学や国の研究所の<b>研究エンジニア職</b>。</li></ul>"}, {"h": "求人サイトより目標リスト", "b": "<p>多くの新卒は求人サイトを眺めて、出てきたものに応募します。強い候補者は、まず<b>15〜25社の目標企業</b>を選び、フォローし、そこで働く人を見つけ、募集が出たら応募します。広く告知される前のことも多いです。一つの採用サイクルに左右されないよう、リストは少なくとも三つの業界にまたがるべきです。</p>"}], "quiz": [{"q": "サウジアラビアで新しい電子系エンジニアの仕事を生む主な要因は何ですか。", "o": ["観光の成長", "国が買い、作るものの国産化", "原油価格の下落", "リモートワーク"], "w": "防衛、自動車、通信、半導体の国産化目標が、国内のエンジニア需要を生んでいます。"}, {"q": "アドナンのLiDARの経験に一番近い業界はどれですか。", "o": ["小売", "航空宇宙・UAV", "銀行", "ホテル"], "w": "ドローンと自律システムはLiDARとセンサーフュージョンに依存しています。"}, {"q": "なぜ目標リストに国の代表的企業、海外メーカー、スタートアップを混ぜるのですか。", "o": ["忙しく見せるため", "仕組み、研修、スピードが異なり、リスクを分散できるから", "スタートアップは必ず給料が高いから", "海外メーカーはサウジ人を採用しないから"], "w": "雇用主の種類によって、得られるものと採用の時期が異なります。"}, {"q": "タミールの説明として最も適切なのはどれですか。", "o": ["大学の学位", "新卒を企業に配置する有給の職場研修プログラム", "ビザの種類", "プログラミング講座"], "w": "HRDFが運営し、新卒の就職への橋渡しになり得ます。"}, {"q": "最初の目標企業リストとして適切な数は。", "o": ["1〜2社", "15〜25社", "200社以上", "今日募集している会社だけ"], "a": 1, "w": "業界と時期をカバーでき、しっかり調べられる数です。"}, {"q": "会社がなぜ採用しているかを理解する一番の理由は。", "o": ["すぐに高い給料を交渉するため", "相手の言葉で話し、目標達成にどう貢献できるかを示すため", "面接を避けるため", "関係ない"], "w": "自分を雇用主の使命と結びつけると、より強い候補者になります。"}], "srs": [{"q": "サウジで電子系の採用を生む主な要因は。", "a": "国産化:国が買っているもの(防衛、車、通信、半導体)を国内で作ること。"}, {"q": "組み合わせるべき三種類の雇用主は。", "a": "国の代表的企業、海外メーカー・合弁会社、スタートアップとインテグレーター。"}, {"q": "新卒の四つの入り口は。", "a": "新卒プログラム、直接採用、職場研修(タミールなど)、研究エンジニア職。"}, {"q": "目標リストの規模と広がりは。", "a": "15〜25社、少なくとも三つの業界にまたがる。"}], "read": ["公式サイト", "検索:最新のプログラム情報", "LinkedIn検索"]}, "l02": {"title": "方向を決める:コンパスから決断へ", "blurb": "コンパスの結果を、縛られすぎずに試せる90日間の方向に変えましょう。", "lab": {"name": "決定メモ:上位二つのパス", "intro": "上位二つのパスについて賛成と反対の根拠を書き、90日間の方向を決めましょう。"}, "cards": [{"h": "運命ではなく、方向", "b": "<p>最初の仕事は一生の決定ではなく、実験です。目標は、<b>90日間</b>行動するのに十分な方向を決め、確認の機会を組み込むことです。確信を待つエンジニアは、たいてい最初に来たオファーに流されてしまいます。</p>"}, {"h": "情熱はスキルの後に来る", "b": "<p>仕事の満足度の研究によれば、人は自分が<b>上達し</b>、<b>裁量</b>を得て、<b>影響</b>を実感できる仕事を好きになっていきます。まだ経験していない仕事について「情熱に従え」はうまく働きません。希少で価値のあるスキルを築ける道を選び、熟達とともに興味を深めましょう。</p>"}, {"h": "想像ではなく証拠を使う", "b": "<p>コンパスが測るのは、あなたが仕事をどう<i>想像しているか</i>です。現実の確認のほうが優れています。その仕事をしている二人に話を聞く、本物の求人広告を読む、週末に小さなプロジェクトを試す。どれも判断を強めるか弱めます。始める<i>前に</i>、何があれば考えが変わるかを書いておきましょう。</p>"}, {"h": "隣り合うパスで選択肢を残す", "b": "<p>多くのパスは土台を共有しています。組込み、認識、試験はどれもC/C++、バス、デバッグ、Pythonが必要です。一つを主、隣り合う一つを副に選べば、話の一貫性を保ったまま両方に応募できます。</p>"}, {"h": "90日間のコミットメント", "b": "<p>一文で書きましょう:<i>「今後90日間、私は___業界の___職を目指し、それを証明するために___を作り、___にアドバイザーとふりかえる。」</i>そして行動します。ふりかえりでは、学んだことをもとに、続ける・調整する・切り替えるを決めます。</p>"}], "quiz": [{"q": "なぜ「永遠に」ではなく90日間の方向を決めるのですか。", "o": ["忘れやすいから", "今行動しながら、計画的なふりかえりの機会を残せるから", "雇用主が求めるから", "コンパスの有効期限が切れるから"], "w": "期限付きのコミットメントなら、偽りの確信なしに行動して学べます。"}, {"q": "「情熱はスキルの後に来る」という考えでは、満足度は主に何から生まれますか。", "o": ["一番わくわくする肩書きを選ぶこと", "上達、裁量、影響の実感", "一番高い初任給", "困難を避けること"], "w": "熟達、裁量、影響が最も強い要因です。"}, {"q": "パスを選ぶ前の一番良い確かめ方は。", "o": ["性格診断だけ", "その仕事をしている人に話を聞き、小さなプロジェクトを試す", "友達に良さそうか聞く", "オファーを待つ"], "w": "直接の証拠は想像に勝ります。"}, {"q": "何があれば考えが変わるかを前もって書くのはなぜですか。", "o": ["メモを長くするため", "証拠が出た後でゴールを動かさないため", "アドバイザーが求めるから", "役に立たない"], "w": "事前の約束が確証バイアスから守ってくれます。"}, {"q": "組込み、認識、試験エンジニアリングが共有しているものは。", "o": ["何もない", "C/C++、バス、デバッグ、Pythonなどの土台", "給与水準だけ", "雇用主だけ"], "w": "隣り合うパスは中心スキルを再利用するので、副のパスを残すコストは小さいです。"}, {"q": "コンパスの上位二つの差が5点以内なら、次にすべきことは。", "o": ["ランダムに選ぶ", "両方について証拠を集める(それぞれ一人と面談するなど)", "一方が勝つまでやり直す", "両方を無視する"], "w": "差が小さいとき、自己申告では区別できません。現実なら区別できます。"}], "srs": [{"q": "90日間の一文は。", "a": "___業界の___職を目指し、___を作って証明し、___にアドバイザーとふりかえる。"}, {"q": "情熱は何の後に来る。", "a": "スキル:熟達、裁量、影響が満足度を生む。"}, {"q": "パスを確かめる手軽な方法二つは。", "a": "実務者二人と話す。週末に小さなプロジェクトをする。"}, {"q": "隣り合う副のパスを持つ理由は。", "a": "土台が共通なので、話をぶらさずに両方に応募できる。"}], "read": ["キャル・ニューポート、2012年", "バーネット、エバンス、2016年", "このアプリ内"]}, "l03": {"title": "面接につながる履歴書", "blurb": "採用担当者が数秒で履歴書をどう読むか、そしてあなたの履歴書を一行ずつ作り直します。", "lab": {"name": "履歴書ワークベンチ", "intro": "あなた自身の箇条書きを診断しました。四つのチェックに合格するまで書き直しましょう。"}, "cards": [{"h": "履歴書に与えられるのは数分ではなく数秒", "b": "<p>採用担当者はざっと見て、<b>希望する職種</b>、<b>学位</b>、<b>関連する経験</b>、<b>証拠</b>(数字、ツール名、リンク)を探します。多くの大企業は、求人広告のキーワードでふるい分ける<b>応募者追跡システム</b>も使っています。分かりやすい見出しと、広告と同じ言葉を使えば、両方を通過できます。</p>"}, {"h": "箇条書きの型", "b": "<p><b>行動の動詞+何をしたか+どのように+結果。</b>例:<i>「12台のLiDARユニットの25〜60 °Cでの熱特性を評価し、ピーク温度を約8 °C下げる筐体の変更を提案した。」</i>数字は本当のものだけを使います。分からなければ、測るか正直に概算しましょう。</p>"}, {"h": "今の履歴書の三つの問題", "b": "<ul><li><b>コピペの誤り:</b>心拍数プロジェクトの最初の箇条書きが、LiDARのインターンの内容になっています。採用担当者は気づき、注意力を疑うかもしれません。</li><li>どこにも<b>数字がない</b>:GPA、規模、結果がない。</li><li><b>控えめすぎる動詞:</b>実際に設計した仕事に「管理した」「基本的な」「補助した」。</li></ul>"}, {"h": "新卒エンジニアの構成", "b": "<p>ヘッダー(名前、電話、メール、LinkedInとGitHubの<b>完全な</b>URL)→ 希望職種を書いた3行の要約 → 学歴(良ければGPAと関連科目)→ <b>職歴</b>(インターン)→ プロジェクト → スキル → 語学。1ページ。日付と見出しの形式をそろえます。日本語は差別化要素なので、目立つ所に残しましょう。</p>"}, {"h": "パスごとに一つの履歴書", "b": "<p>基本の履歴書を一つ作り、目標のパスごとに調整します。認識向けはLiDARの仕事を先頭に。組込み向けはC/C++、ESP32のプロジェクト、バスを先頭に。試験向けは熱と電源の試験を先頭に。事実は同じで、順番と強調が違います。</p>"}], "quiz": [{"q": "応募者追跡システムが主にすることは。", "o": ["履歴書を書く", "人が読む前に、キーワードと構成で履歴書をふるい分ける", "面接をする", "大学にGPAを確認する"], "w": "広告と同じ言葉と、標準的な見出しを使いましょう。"}, {"q": "一番強い箇条書きはどれですか(履歴書の言語は英語)。", "o": ["Responsible for testing LiDAR units.", "Assisted with thermal tests.", "Characterised thermal behaviour of 12 LiDAR units and proposed a chassis change that cut peak temperature by ~8 °C.", "Did many tests in different environments and presented."], "w": "動詞、範囲、方法、結果がそろっています。"}, {"q": "心拍数プロジェクトのコピペの誤りのリスクは。", "o": ["ない", "エンジニアに大切な注意力が弱いと思われる", "キーワードの一致が増える", "多才さを示せる"], "w": "採用担当者は小さな誤りをサインとして受け取ります。"}, {"q": "新卒の履歴書の「Training」の欄名は何にすべきですか。", "o": ["Hobbies", "Experience", "References", "Other"], "w": "インターンは本物の経験です。そう呼びましょう。"}, {"q": "結果の正確な数字が分からないときは。", "o": ["それらしい数字を作る", "測るか、概算と分かる形で正直に見積もる", "その箇条書きを全部消す", "「たくさん」と書く"], "w": "数字を作ってはいけません。面接で質問されます。"}, {"q": "パスごとに履歴書を調整する理由は。", "o": ["事実を隠すため", "相手ごとに最も関連する証拠を先に出すため", "雇用主が三つの履歴書を求めるから", "役に立たない"], "w": "事実は同じで、強調が違います。"}], "srs": [{"q": "箇条書きの型は。", "a": "行動の動詞+何を+どのように+結果(本当の数字で)。"}, {"q": "箇条書きの四つのチェックは。", "a": "動詞で始まる、数字がある、二行以内、重複しない。"}, {"q": "新卒の履歴書の順番は。", "a": "ヘッダー、要約、学歴、職歴、プロジェクト、スキル、語学。"}, {"q": "パスごとに調整する理由は。", "a": "その相手にとって大切な証拠を先頭に出すため。"}], "read": ["ウィキペディアの概要", "検索:大学のキャリアセンターの案内", "このミッションのラボを開く"]}, "l04": {"title": "LinkedInとGitHubのポートフォリオ", "blurb": "採用担当者は広告を出す前に検索します。見つけてもらえるように、そしてプロジェクトで履歴書の内容を証明できるようにしましょう。", "lab": {"name": "見出しビルダーとプロフィールのチェックリスト", "intro": "採用担当者が検索する見出しを作り、10項目のチェックリストを進めましょう。"}, "cards": [{"h": "採用担当者は検索してから連絡する", "b": "<p>この地域の技術職の多くは、採用担当者が広告を出す前に、あるいは出す代わりに、LinkedInでキーワードと場所を検索して埋まります。見出しが「Electrical Engineering Graduate」だけだと、「embedded engineer Riyadh」の検索に出てきません。</p>"}, {"h": "見出しは検索結果そのもの", "b": "<p>型:<b>目標の職種 | 強み2〜3個 | 実績</b>。例:<i>Embedded & Perception Engineer | C/C++ · LiDAR · ESP32 | KSU EE, LiDAR co-op</i>。120文字以内。希望する求人で使われる言葉と合わせましょう。</p>"}, {"h": "GitHubはあなたの証拠", "b": "<p>ハードウェアや組込みの職では、きれいなリポジトリを持つ新卒は珍しく、記憶に残ります。非接触端末のプロジェクトは理想的です。コード、何をするか・なぜ作ったかを書いた<b>README</b>、配線図、動いている写真やGIF、改善したい点。採用担当者はコードを読みませんが、面接するエンジニアは読みます。</p>"}, {"h": "本気度のサイン", "b": "<ul><li>はっきりした写真と、一人称で書き、何を探しているかで締めくくる「About」。</li><li>目標の職種に合わせて固定したスキル。</li><li>投稿:数週間に一度、プロジェクトや学んだことの短い紹介。</li><li>目標企業の人とのつながり。つながるときに短いメッセージを添える。</li></ul>"}, {"h": "書類の一貫性", "b": "<p>履歴書、LinkedIn、GitHubは、同じ事実と日付で一つの物語を語ります。食い違い(違う肩書き、抜けているプロジェクト)があると、採用担当者はためらいます。</p>"}], "quiz": [{"q": "なぜLinkedInの見出しがそれほど重要なのですか。", "o": ["学位証明書に印刷されるから", "採用担当者の検索が見出しと照合され、表示されるかが決まるから", "給料が決まるから", "見えないから"], "w": "見出しは検索結果そのものです。"}, {"q": "アドナンの目標に最も強い見出しは。", "o": ["Student", "Electrical Engineering Graduate", "Embedded & Perception Engineer | C/C++ · LiDAR · ESP32 | KSU EE", "Looking for any opportunity"], "w": "目標の職種、強み、実績を、検索される言葉で。"}, {"q": "面接官にとって役に立つGitHubのプロジェクトとは。", "o": ["空のリポジトリがたくさん", "目的と設計を説明するREADME、図、デモ、きれいなコード", "非公開のリポジトリだけ", "スターの数だけ"], "w": "何をどう作ったかを分かりやすくしましょう。"}, {"q": "「About」の最後に書くべきことは。", "o": ["名言", "何を探しているか", "身分証番号", "趣味の一覧"], "w": "読む人にどう助けてほしいかを伝えましょう。"}, {"q": "履歴書、LinkedIn、GitHubを一致させる理由は。", "o": ["デザインのためだけ", "事実の食い違いがあると採用担当者がためらうから", "法律で決まっているから", "重要ではない"], "w": "一つの物語、同じ事実。"}, {"q": "短い仕事関連の投稿の妥当な頻度は。", "o": ["一時間ごと", "数週間に一度", "しない", "就職してからだけ"], "w": "定期的に、でも軽く。好奇心を示し、存在感を保てます。"}], "srs": [{"q": "見出しの型は。", "a": "目標の職種 | 強み2〜3個 | 実績、120文字以内。"}, {"q": "強いREADMEの四つの要素は。", "a": "何となぜ、仕組み(図)、デモ(写真・GIF)、改善点。"}, {"q": "Aboutの締めくくりは。", "a": "何を探しているか。"}, {"q": "ハードウェア職でGitHubが大切な理由は。", "a": "珍しく記憶に残る証拠で、履歴書の内容を裏づけるから。"}], "read": ["GitHubドキュメント", "LinkedInヘルプ", "GitHub検索"]}, "l05": {"title": "自己紹介:30秒ピッチと在学期間の質問", "blurb": "「自己紹介をしてください」に30秒で答え、7年間の在学についての質問に落ち着いて短く答えましょう。", "lab": {"name": "タイマー付きピッチビルダー", "intro": "現在・過去・未来のピッチを書いて時間を計り、在学期間への答えを書きましょう。"}, "cards": [{"h": "「自己紹介をしてください」は試験", "b": "<p>多くの場合最初の質問で、少しの緊張の中で分かりやすく話せるかを見ています。履歴書を読み上げる場では<b>ありません</b>。面接官が一番のプロジェクトについて聞きたくなるような30〜60秒を目指しましょう。</p>"}, {"h": "現在 → 過去 → 未来", "b": "<p><b>現在:</b>今のエンジニアとしてのあなた。<b>過去:</b>一つか二つの証拠(LiDARのインターン、非接触端末)。<b>未来:</b>次に望むことと、その会社を選ぶ理由。未来で終えると、会話が前に進みます。</p>"}, {"h": "在学期間について", "b": "<p>学位は2019年から2026年まででした。面接官が聞くかもしれません。うまくいく型は、<b>短く、正直に、説明しすぎず、そして話題を移す</b>ことです。学んだことや、したことへ。一、二文で。落ち着いて聞こえるまで練習しましょう。長く防御的な答えは、期間そのものより疑いを生みます。</p>"}, {"h": "本当なら強みに変える", "b": "<p>その時間にインターン、独学したスキル、日本語、プロジェクトがあったなら、そう伝えましょう。大変な時期だったなら、詳しく話す必要はありません。個人的または学業上の困難を乗り越えたと伝え、今は準備ができている証拠(最近の強いプロジェクトとインターン)を示しましょう。</p>"}, {"h": "声に出して練習する", "b": "<p>書いたピッチは読むと良くても、話すと硬く聞こえます。声に出して10回言い、一度録音し、つまずく文は削りましょう。在学期間への答えは、気まずさがなくなるまでアドバイザーと練習しましょう。</p>"}], "quiz": [{"q": "「自己紹介をしてください」で主に見られているのは。", "o": ["履歴書の暗記", "少しの緊張の中での分かりやすく自信のある話し方", "家族の背景", "希望給与"], "w": "短く、構成立てて、前向きに。"}, {"q": "おすすめのピッチの構成は。", "o": ["過去 → 現在 → 趣味", "現在 → 過去 → 未来", "未来 → 給与 → 過去", "学校から年代順"], "w": "未来で終えると会話が前に進みます。"}, {"q": "長い在学期間の質問への一番良い答え方は。", "o": ["長く詳しく説明する", "答えない", "短く正直に答え、学んだことと今できることへ話題を移す", "大学のせいにする"], "w": "短く落ち着いて。長い防御的な答えは疑いを生みます。"}, {"q": "期間の背景にある個人的な事情を話さなければなりませんか。", "o": ["はい、常にすべて", "いいえ。短く正直な説明と、準備ができている証拠で十分", "二回聞かれたら", "書面でだけ"], "w": "どこまで話すかはあなたが決められます。"}, {"q": "30秒のピッチはおよそ何語ですか(英語)。", "o": ["20語", "約75語", "300語", "500語"], "w": "話すとおよそ1秒に2.5語です。"}, {"q": "書くだけでなく声に出して練習する理由は。", "o": ["必要ない", "書いた文は話すと硬く聞こえることが多く、話すとぎこちない所が分かるから", "面接官は読むほうが好きだから", "一字一句暗記するため"], "w": "つまずく所は削りましょう。"}], "srs": [{"q": "ピッチの構成は。", "a": "現在 → 過去(証拠一、二個)→ 未来(その会社を選ぶ理由)。"}, {"q": "在学期間への答えの型は。", "a": "短く、正直に、説明しすぎず、学んだことと準備ができていることへ話題を移す。"}, {"q": "30秒ピッチの長さは。", "a": "約75語。"}, {"q": "練習の仕方は。", "a": "声に出して10回、一度録音し、つまずく所を削る。"}], "read": ["ハーバード・ビジネス・レビュー", "検索:キャリアセンターの案内", "このミッションのラボを開く"]}, "l06": {"title": "人脈づくりと話を聞く面談", "blurb": "サウジのエンジニアリングでは、紹介が扉を開きます。20分の時間をお願いする方法と、その時間の使い方を学びましょう。", "lab": {"name": "連絡メッセージビルダー", "intro": "短く具体的なメッセージを下書きし、人脈リストにそのまま追加しましょう。"}, "cards": [{"h": "ここで人脈が大切な理由", "b": "<p>多くの職、特に専門的なエンジニアリング職は、正式な募集の前や並行して、推薦や紹介で埋まります。推薦された候補者は面接に呼ばれやすいです。人脈づくりは仕事をお願いすることではなく、あとであなたを推薦してくれる人から<b>学ぶこと</b>です。</p>"}, {"h": "話を聞く面談", "b": "<p>実務者に仕事について聞く20分の会話です。仕事の実際(決定メモの証拠)、その会社の採用の仕方、大切なスキルが分かります。そして、相手の記憶に残る名前になります。</p>"}, {"h": "最初に誰に頼むか", "b": "<ul><li><b>身近なつながり:</b>家族の知人、アドバイザーの人脈、インターン先の同僚、KSUの卒業生。</li><li><b>卒業生:</b>LinkedInで、目標企業にいるKSU電気工学の卒業生を探しましょう。</li><li><b>講演者や筆者:</b>尊敬する仕事について発表や投稿をした人。具体的に触れましょう。</li></ul>"}, {"h": "良い質問", "b": "<ul><li>あなたの仕事の普通の一週間はどんな感じですか。</li><li>新卒が一年目で一番苦労することは何ですか。</li><li>一番伸びた若手と他の人の違いは、どんなスキルでしたか。</li><li>あなたのチームは普段どうやって新卒を採用しますか。</li><li>ほかに話を聞くべき人はいますか。</li></ul><p>最後の質問で、一人のつながりが何人にも広がります。</p>"}, {"h": "本当の仕事はフォローアップ", "b": "<p>当日中にお礼を送り、学んだことを一つ書きます。助言を実行し、あとで実行したことを伝えます。学んだことを人脈リストに記録しましょう。週に二回の面談を二か月続ければ、就職活動が変わります。</p>"}], "quiz": [{"q": "話を聞く面談の主な目的は。", "o": ["直接仕事をお願いする", "実務者から仕事の実際と採用の仕方を学ぶ", "一時間自分を売り込む", "給与データだけを得る"], "w": "まず学ぶこと。関係はその後についてきます。"}, {"q": "お願いする時間として妥当なのは。", "o": ["2時間", "約20分", "丸一日", "5分"], "w": "小さなお願いほど承諾されやすいです。"}, {"q": "人脈を広げる質問はどれですか。", "o": ["いくら稼いでいますか。", "ほかに話を聞くべき人はいますか。", "仕事をもらえますか。", "住所は。"], "w": "一つの会話が次の会話につながります。"}, {"q": "お礼はいつ送るべきですか。", "o": ["送らない", "当日中に、学んだことを具体的に書いて", "就職してから", "とても助けてもらったときだけ"], "w": "具体的に、すぐに。"}, {"q": "最初の連絡先として一番良いのは、ふつう。", "o": ["大企業のCEO", "身近なつながりと卒業生", "ランダムなプロフィール", "人事部だけ"], "w": "共通のつながりがあると返事が来やすいです。"}, {"q": "続けられる人脈づくりのペースは。", "o": ["1日20人", "週に二回の面談", "年に一回", "困ったときだけ"], "w": "一気にやるより、続けることが大切です。"}], "srs": [{"q": "話を聞く面談の目的は。", "a": "仕事と採用の実際を学び、関係を築くこと。"}, {"q": "良い質問五つは。", "a": "普通の一週間、新卒が苦労すること、伸びる若手のスキル、採用の仕方、ほかに話すべき人。"}, {"q": "フォローアップの原則は。", "a": "当日中に学んだことを一つ添えてお礼。あとで助言をどう活かしたか伝える。"}, {"q": "週の目標は。", "a": "面談二回。"}], "read": ["ウィキペディアの概要", "LinkedIn検索", "このアプリ内"]}, "l07": {"title": "求人広告の読み方と書類選考", "blurb": "広告を必須条件と歓迎条件に分け、最初のふるい分けを通過する応募の仕方を学びましょう。", "lab": {"name": "実際に近い求人広告を分類する", "intro": "広告の10行を分類し、理由と比べましょう。"}, "cards": [{"h": "広告には三種類の行がある", "b": "<p><b>必須条件</b>は厳しく選考されます(学位、中心となる言語、応募資格)。<b>歓迎条件</b>は希望リストです。必須条件のほとんどと歓迎条件の一部を満たす新卒は応募すべきです。<b>社風のサイン</b>(「スピード感のある」「チームプレーヤー」)は、どんなストーリーを準備すべきかを教えてくれます。</p>"}, {"h": "中心の条件を満たしたら応募する", "b": "<p>よくある間違いは、すべての行を満たすまで待つことです。必須条件と、残りの妥当な割合を満たしていれば応募し、要約や添え状で一番大切な差に触れましょう(「スキルを強化するためにRTOSのプロジェクトに取り組んでいます」など)。</p>"}, {"h": "言葉を合わせる", "b": "<p>応募者追跡システムと忙しい担当者は、広告と同じ言葉を探します。広告が「C/C++ for microcontrollers」で、履歴書が「Arduino IDE」だと一致しないかもしれません。正確な用語を、正直に、要約とスキル欄で使いましょう。</p>"}, {"h": "応募資格とセキュリティクリアランス", "b": "<p>防衛や一部の政府関連の職では、国籍とセキュリティクリアランスが必要で、手続きが長くなることがあります。早めに応募し、待つ間もほかの応募を進めましょう。</p>"}, {"h": "すべて記録する", "b": "<p>応募ごとに、日付、使った履歴書の版、担当者、次の行動をパイプラインに記録します。担当者がいれば、一、二週間後に丁寧に確認しましょう。記録された就職活動は、ばらばらな活動より速く、ストレスも少ないです。</p>"}], "quiz": [{"q": "組込み職の広告にある「Proficiency in C/C++ for microcontrollers」は、おそらく。", "o": ["社風のサイン", "必須条件", "関係ない", "歓迎条件"], "w": "仕事の中心で、試験される可能性が高いです。"}, {"q": "「Eager to learn in a fast-paced environment」は。", "o": ["必須スキル", "社風のサイン:それを示すストーリーを準備する", "厳しい足切り条件", "給与の目安"], "w": "証拠で示しましょう。"}, {"q": "必須条件を満たし、歓迎条件は一部だけの新卒は応募すべきですか。", "o": ["いいえ、決して", "はい。大切な差に短く触れる", "友達がいるときだけ", "修士を取ってから"], "w": "完全一致を待つと機会を逃します。"}, {"q": "広告の言葉に合わせる理由は。", "o": ["文章を不正にコピーするため", "選考システムも人もその言葉を探すから(正直に使う)", "法律で決まっているから", "役に立たない"], "w": "正確で正直なキーワードの一致。"}, {"q": "クリアランスが必要な職では。", "o": ["避ける", "早めに応募し、ほかの応募も進める", "結果を待ってからほかに応募する", "条件を無視する"], "w": "時間がかかるので、並行して進めましょう。"}, {"q": "応募ごとに記録すべきことは。", "o": ["何もない", "日付、履歴書の版、担当者、次の行動", "会社名だけ", "不採用だけ"], "w": "記録があれば、適切な時期に確認できます。"}], "srs": [{"q": "広告の三種類の行は。", "a": "必須条件、歓迎条件、社風のサイン。"}, {"q": "いつ応募するか。", "a": "必須条件と、残りの妥当な割合を満たしたとき。"}, {"q": "キーワードの原則は。", "a": "広告の正確な用語を、正直に使う。"}, {"q": "確認の時期は。", "a": "担当者がいれば、応募の一、二週間後。"}], "read": ["ウィキペディアの概要", "LinkedIn求人検索", "このアプリ内"]}, "l08": {"title": "行動面接:STARストーリー", "blurb": "ほとんどの面接に「〜したときのことを話してください」があります。どんな質問にも応用できる、本当のストーリーを五つ準備しましょう。", "lab": {"name": "STARストーリーの蓄え", "intro": "インターンとプロジェクトから、完成したストーリーを少なくとも三つ書きましょう。"}, "cards": [{"h": "過去の行動は未来の行動を予測する", "b": "<p>行動に関する質問(「〜したときのことを話してください」)が使われるのは、過去の行動が今後の行動のある程度の予測になるからです。面接官は、構成、当事者意識、結果を評価します。</p>"}, {"h": "STARの構成", "b": "<p><b>状況</b>(背景を一、二文)→ <b>課題</b>(あなたの責任)→ <b>行動</b>(<i>あなた</i>がしたことを順に。一番長い部分)→ <b>結果</b>(何が変わったか。できれば数字と、学んだこと)。</p>"}, {"h": "よくある落とし穴", "b": "<ul><li>状況が長すぎて、行動が短すぎる。</li><li>ずっと「私たち」で、あなたの貢献が見えない。</li><li>結果がない、またはあいまい(「うまくいった」)。</li><li>2分を超えるストーリー。</li></ul>"}, {"h": "五つの蓄えでほとんどの質問に対応できる", "b": "<p>五つ準備しましょう:難しい技術的問題、細部への注意、制約の中での仕事、チームワークや対立、速い学習。どれも応用できます。LiDARの試験のストーリーは、プレッシャー、厳密さ、結果の発表についての質問に使えます。</p>"}, {"h": "エンジニアらしいストーリー", "b": "<p>エンジニアの面接官は具体的な話が大好きです。確認したデータシート、驚いた測定結果、選んだトレードオフ。各ストーリーに技術的な詳細を一つ入れましょう。本当にその仕事をしたというサインになります。</p>"}], "quiz": [{"q": "STARで一番長くすべき部分は。", "o": ["状況", "課題", "行動", "結果"], "w": "面接官はあなたがしたことを評価します。"}, {"q": "行動の部分で「私たち」ではなく「私」と言う理由は。", "o": ["傲慢に聞こえるが決まりだから", "あなた自身の貢献が見えるから", "面接官はチームが嫌いだから", "短いから"], "w": "チームには短く触れ、その後あなたの役割を説明しましょう。"}, {"q": "強い結果に含まれるのは。", "o": ["「うまくいった」", "具体的な成果(できれば数字)と学んだこと", "何もない(結果は任意)", "成績"], "w": "具体的で測れるもの。"}, {"q": "ほとんどの行動面接の質問に対応できる準備の数は。", "o": ["一つ", "約五つ(必要に応じて応用)", "二十", "なし(即興で)"], "w": "小さくて柔軟な蓄え。"}, {"q": "話すSTARストーリーの目安の長さは。", "o": ["10秒", "約90秒〜2分", "5分", "10分"], "w": "詳しく話せて、注意を保てる長さです。"}, {"q": "各ストーリーに技術的な詳細を一つ入れる理由は。", "o": ["面接官を混乱させるため", "本当にその仕事をしたというサインになるから", "決まりだから", "時間を埋めるため"], "w": "具体性が信頼を生みます。"}], "srs": [{"q": "STARとは。", "a": "状況、課題、行動(一番長く、「私」で)、結果(具体的に、学びも)。"}, {"q": "STARの四つの落とし穴は。", "a": "状況が長すぎる、「私たち」、あいまいな結果、長すぎる。"}, {"q": "準備する五つのストーリーは。", "a": "難しい技術的問題、細部への注意、制約、チームワークや対立、速い学習。"}, {"q": "信頼を高めるには。", "a": "各ストーリーに技術的な詳細を一つ。"}], "read": ["ウィキペディアの概要", "検索:よくある質問", "このミッションのラボを開く"]}, "l09": {"title": "組込み・ハードウェア職の技術面接", "blurb": "組込みの面接官が何を聞くか、考えを声に出す方法、そして模範解答付きの中心的な12問の練習。", "lab": {"name": "技術練習:中心の12問", "intro": "声に出して答え、模範解答を見て、自己採点しましょう。"}, "cards": [{"h": "何が試されるか", "b": "<ul><li><b>Cの基礎:</b>ポインタ、volatile、ビット操作、メモリ。</li><li><b>マイコンの概念:</b>割り込み、タイマー、DMA、周辺機能。</li><li><b>バス:</b>UART、SPI、I2C、CAN。</li><li><b>回路:</b>プルアップ、デカップリング、簡単なアナログ。</li><li><b>デバッグの進め方:</b>どうやって不具合を見つけるか。</li><li><b>あなたのプロジェクト:</b>一つについて深く聞かれます。</li></ul>"}, {"h": "考えを声に出す", "b": "<p>面接官は答えと同じくらい<b>考え方</b>を評価します。前提を言い、システムを図にし、まず簡単な場合を試し、何を測るかを話しましょう。「確信はありませんが、Yをして、Xを確認します」は、沈黙よりずっと良いです。</p>"}, {"h": "自分のプロジェクトを完全に理解する", "b": "<p>予想される質問:なぜESP32ですか。なぜそのセンサーですか。シリアル通信のデータレートは。デバウンスはどう動きましたか。何を変えたいですか。コードを読み直し、図を使った1分の説明を準備しましょう。</p>"}, {"h": "よくある実技テスト", "b": "<p>短いC関数を書く(ビットの反転、リングバッファ、パケットの解析)、データシートの抜粋を読む、渡されたコードをデバッグする。IDEなしで手でCを書く練習をしましょう。自動補完が隠している弱点が見えます。</p>"}, {"h": "面接のあとで", "b": "<p>聞かれた質問を当日中にすべて書き出し、苦労したものに印をつけて勉強しましょう。五回の面接で、これが一番の準備資料になります。</p>"}], "quiz": [{"q": "割り込み処理とメインループで共有する変数は、ふつうどう宣言しますか。", "o": ["staticだけ", "volatile(アクセスが原子的でなければ保護も)", "const", "register"], "w": "volatileは実際のメモリアクセスを強制します。原子性は別の問題です。"}, {"q": "アドレスを使い、多くのデバイスが2本の線を共有するバスは。", "o": ["UART", "SPI", "I2C", "RS-232"], "w": "I2C:アドレス付きのSDAとSCL。"}, {"q": "技術面接で答えが分からないときの一番良い対応は。", "o": ["黙る", "自信を持って当てずっぽうで答える", "何をどう確認するかを、考えを声に出して話す", "話題を変える"], "w": "考え方が評価されます。"}, {"q": "IDEなしでCを書く練習をする理由は。", "o": ["職場でIDEは禁止だから", "ホワイトボードのテストのように、自動補完が隠す弱点が見えるから", "速いから", "役に立たない"], "w": "面接では紙や簡単なエディタを使うことが多いです。"}, {"q": "新しい基板が起動しません。最初に何を確認しますか。", "o": ["ファームウェアを書き直す", "電源ライン、クロック、リセット、次にデバッグ接続", "新しい基板を注文する", "筐体"], "w": "電源から外側へ進めましょう。"}, {"q": "面接後にすべての質問を書き出す価値は。", "o": ["ない", "弱点を狙った自分だけの問題集ができる", "ネットで文句を言うため", "人事に送るため"], "w": "一番の勉強材料になります。"}], "srs": [{"q": "volatileの意味は。", "a": "見えるプログラムの流れの外で値が変わり得るので、常にメモリにアクセスする。原子的ではない。"}, {"q": "UART、SPI、I2Cの違いは。", "a": "UARTは非同期で一対一。SPIは同期で速く、チップセレクトを使う。I2Cは共有の2本線でアドレスとプルアップ。"}, {"q": "基板が起動しないときの確認順は。", "a": "電源、クロック、リセット、デバッグ接続、ブートピン、最小限のファームウェア。"}, {"q": "面接で詰まったら。", "a": "考えを声に出す:前提、簡単な場合、何を測るか。"}], "read": ["バー・グループ", "検索:練習問題集", "ウィキペディア"]}, "l10": {"title": "内定と最初の仕事の選び方", "blurb": "オファーの比べ方、承諾する前に聞くこと、敬意を持った交渉の仕方。", "lab": {"name": "重み付きオファー比較", "intro": "自分にとって大切なことに重みをつけ、最大三つのオファーを採点し、決め手がどこにあるかを見ましょう。"}, "cards": [{"h": "最初の仕事は学ぶ速さで選ぶ", "b": "<p>キャリアの初めは、二つの給料の差より、<b>何を学べるか</b>と<b>誰が教えてくれるか</b>の差のほうが大切です。強い技術リーダーと本物の責任がある仕事は、成長の少ない少し高い給料の仕事より、五年間で大きな価値を生むことがあります。</p>"}, {"h": "承諾する前に聞くこと", "b": "<ul><li>誰の下で働きますか。その人に会えますか。</li><li>最初の六か月、何に取り組みますか。</li><li>新卒はどう育成され、評価されますか。</li><li>このチームの最近の新卒はどうなりましたか。</li><li>待遇の全体は(住宅、交通、手当、研修予算)。</li></ul>"}, {"h": "敬意を持って交渉する", "b": "<p>新卒のオファーは基本給の余地が小さいことが多いですが、入社日、研修、手当、肩書きには余地があることがあります。感謝を示し、具体的に、落ち着いて。理由を添えて一度だけお願いしましょう。承諾したあとで、何もなかったように他社の面接を続けてはいけません。</p>"}, {"h": "期限と複数のオファー", "b": "<p>一つのオファーがあり、別の結果を待っているなら、短い延長を丁寧にお願いしても構いません。二社目には期限付きのオファーがあることを伝えましょう。早めてくれることがあります。最初から最後まで正直に。業界は狭いです。</p>"}, {"h": "決めたら、打ち込む", "b": "<p>重み付きの比較で考えを整理し、アドバイザーと話し、決めたら全力で取り組みましょう。深刻な問題がない限り、最初の仕事には少なくとも18〜24か月をかけましょう。深い力は、何かを任されるまで長くいることで身につきます。</p>"}], "quiz": [{"q": "キャリアの初め、五年間で一番大切になることが多いのは。", "o": ["少しの給料の差", "何を学び、誰が教えてくれるか", "勤務地だけ", "肩書きの言い回し"], "w": "学ぶ速さは複利のように効きます。"}, {"q": "承諾する前の良い質問はどれですか。", "o": ["研修を省けますか。", "最初の六か月は何に取り組み、誰の下で働きますか。", "すぐに何日休めますか。", "聞かずに承諾する"], "w": "学びと上司について分かります。"}, {"q": "新卒のオファーで交渉の余地があることが多いのは。", "o": ["どこにもない", "入社日、研修、手当、肩書き", "基本給だけ", "会社の方針"], "w": "基本給は等級で決まっていることが多いです。"}, {"q": "別のオファーを待つ間、時間が必要なときは。", "o": ["期限を無視する", "短い延長を丁寧にお願いし、正直に話す", "両方を承諾する", "別のオファーがあると嘘をつく"], "w": "正直さがあなたの評判を守ります。"}, {"q": "最初の仕事には、一般にどれくらいいるべきですか。", "o": ["3か月", "深刻な問題がない限り少なくとも18〜24か月", "最低10年", "最初のボーナスまで"], "w": "何かを任されるまで長く。"}, {"q": "重み付きのオファー比較の一番良い使い方は。", "o": ["自動的に決めてもらう", "決める前に優先順位を明確にし、トレードオフに気づく", "雇用主に見せるため", "誰とも話さないため"], "w": "結果に違和感があれば、重みを見直しましょう。"}], "srs": [{"q": "最初の仕事で優先することは。", "a": "学ぶ速さと、指導の質。"}, {"q": "承諾前の五つの質問は。", "a": "上司、最初の六か月、育成と評価、過去の新卒、待遇の全体。"}, {"q": "新卒が交渉できることは。", "a": "入社日、研修、手当、肩書き。"}, {"q": "最初の仕事の最低期間は。", "a": "深刻な問題がない限り18〜24か月。"}], "read": ["ハーバード・ビジネス・レビュー、2014年", "このアプリ内", "アドバイザーの受信箱"]}}, "compass": {"int": ["新しい基板にはんだ付けをして、プローブで測定し、初めて立ち上げること", "ハードウェアのレジスタを直接操作するCコードを書くこと", "一日に一度しか起きないバグを追いかけること", "フィルタなど、アルゴリズムの背後にある数学を理解すること", "複数のサブシステムを初めて連携させること", "技術製品を顧客に説明し、難しい質問に答えること", "丁寧なテスト計画を立て、一つずつ実行すること", "新しい技術についての研究論文を読むこと", "PCBをレイアウトし、きれいに配線すること", "Pythonでセンサーデータを分析し、グラフにすること", "LiDARの点群を可視化し、フィルタリングすること", "ネットワークを設定し、Wiresharkでパケットを分析すること", "小さなチームを率いて、厳しい締め切りに間に合わせること", "分かりやすい仕様書やドキュメントを書くこと", "VerilogやVHDLでデジタル回路を設計すること", "試作品を屋外に持ち出し、暑さや砂ぼこりの中で試験すること", "上級の人たちに結果を発表すること", "仕事のために日本語と日本の文化を学ぶこと", "厳しいメモリと時間の制約に収まるようにコードを最適化すること", "ドローンやロボットを自 function go(h){location.hash=h}

let roomStop=null;

/* ---------- views ---------- */
const view=()=>$('#view');
function trackStats(t){const tr=TRACKS.find(x=>x.id===t);const ids=tr.titles.map((_,i)=>mid(t,i));const d=ids.filter(id=>(state.progress[id]||{}).status==='completed').length;return{d,n:ids.length,ids}}
function nextMission(){for(const tr of TRACKS){for(let i=0;i<tr.titles.length;i++){const id=mid(tr.id,i);if(M[id]&&(state.progress[id]||{}).status!=='completed')return id}}return null}
function inProgress(){return Object.keys(state.progress).filter(id=>M[id]&&state.progress[id].status==='started').sort((a,b)=>(state.progress[b].updated||0)-(state.progress[a].updated||0))[0]}

function trackCard(t){const s=trackStats(t.id),c=tcol(t.id);const avail=t.titles.some((_,i)=>M[mid(t.id,i)]);return`<div class="card tcard trk" style="--tc:${c.c}" onclick="go('#/track/${t.id}')"><div class="trkband" style="background:${c.g}"><span class="tile glass">${ico(c.i,26)}</span><div style="flex:1;min-width:0"><h3>${t.name}</h3><small>${t.sub}</small></div><span class="trkpct">${Math.round(s.d/s.n*100)}%</span></div><div class="trkbody"><div class="icorow">${t.titles.map((_,i)=>{const id=mid(t.id,i),dn=(state.progress[id]||{}).status==='completed';return`<span class="mini ${dn?'on':''} ${M[id]?'':'off'}" data-tip="${i+1}. ${esc(M[id]?M[id].title:t.titles[i])}${dn?' ✓':''}" role="link" aria-label="Mission ${i+1}: ${esc(t.titles[i])}" ${M[id]?`onclick="event.stopPropagation();go('#/m/${id}')"`:''}>${mico(id,15)}</span>`}).join('')}</div><div class="prog"><i style="width:${s.d/s.n*100}%"></i></div><small class="muted">${s.d} of ${s.n} missions${avail?'':' · coming soon'}</small></div></div>`}
function vTracks(){view().innerHTML=`<h1>Tracks</h1><p class="note">Each mission: concept cards → a working lab → a self-test → a reflection. Concepts then join your spaced-review deck.</p>${trackGroups()}`}
function vTrack(t){const tr=TRACKS.find(x=>x.id===t);if(!tr)return vTracks();const s=trackStats(t);
  const c=tcol(t);view().innerHTML=`<div style="--tc:${c.c}"><div class="trackhead" style="background:${c.g};border:0"><div class="row" style="flex-wrap:nowrap"><span class="tile glass" style="width:52px;height:52px">${ico(c.i,30)}</span><div><div class="eyebrow" style="color:rgba(255,255,255,.8)">Track</div><h1 style="margin:0">${tr.name}</h1></div></div><p style="margin-top:8px">${tr.sub}</p><div class="prog" style="background:rgba(255,255,255,.2)"><i style="width:${s.d/s.n*100}%;background:#fff"></i></div><small style="color:rgba(255,255,255,.85)">${s.d} of ${s.n} complete</small>${tr.group==='cfa'&&typeof EXAMS!=='undefined'&&EXAMS[t]?`<div class="ctl" style="margin-bottom:0"><button class="sbtn" style="background:#fff;color:${c.c};border-color:#fff" onclick="go('#/exam/${t}')">Practice simulator</button><button class="sbtn" style="background:transparent;color:#fff;border-color:#fff" onclick="go('#/study/${t}')">Study tracker</button></div>`:''}</div>
  <div class="mlist">${tr.titles.map((ti,i)=>{const id=mid(t,i),m=M[id],p=state.progress[id]||{};const dn=p.status==='completed';
    return`<button class="mitem ${dn?'done':''} ${m?'':'lock'}" ${m?`onclick="go('#/m/${id}')"`:'disabled'}><span class="tile ${dn?'':'soft'}">${mico(id,22)}</span><span class="t"><small class="mnum">Mission ${i+1}${dn?' · ✓ done':''}</small><b>${esc(m?m.title:ti)}</b><small class="muted">${m?esc(m.lab.name):'Coming in batch '+tr.batch}</small></span>${dn?`<span class="pill done">${Math.round((p.best||0)*100)}%</span>`:p.status==='started'?'<span class="pill gold">In progress</span>':''}</button>`}).join('')}</div></div>`}

/* ---------- mission ---------- */
const STEPS=[['learn','Learn'],['lab','Lab'],['test','Test'],['reflect','Reflect'],['read','Read']];
function vMission(id,step){const m=M[id];if(!m)return vTracks();current=m;const p=P(id);if(p.status==='new'){p.status='started';p.updated=Date.now();logEvent('start',id,enTitle(m));save()}
  step=step||(p.steps.learn?(p.steps.lab?(p.steps.test?'reflect':'test'):'lab'):'learn');
  const tr=TRACKS.find(t=>t.id===m.track);const idx=tr.titles.findIndex((_,i)=>mid(m.track,i)===id);
  const c=tcol(m.track);view().innerHTML=`<div style="--tc:${c.c}"><div class="row" style="margin-bottom:4px"><a href="#/track/${m.track}" class="note">← ${tr.name}</a><span class="spacer"></span>${p.status==='completed'?'<span class="pill done">Completed</span>':''}</div>
  <div class="mhead"><span class="tile">${mico(id,28)}</span><div style="min-width:0"><div class="eyebrow" style="color:var(--tc)">${tr.name} · Mission ${idx+1} of ${tr.titles.length}</div><h1 style="margin:2px 0 4px">${esc(m.title)}</h1><p class="note" style="margin:0">${esc(m.blurb)}</p></div></div>
  <div class="steps">${STEPS.map(([k,n])=>`<button class="${k===step?'on':''} ${p.steps[k]?'ok':''}" onclick="go('#/m/${id}/${k}')">${ico(STEPICO[k],16)}<span>${n}</span></button>`).join('')}</div>
  <div id="stepBox"></div></div>`;
  const box=$('#stepBox');({learn:stepLearn,lab:stepLab,test:stepTest,reflect:stepReflect,read:stepRead}[step]||stepLearn)(box,m)}
function markStep(m,k,xp){const p=P(m.id);if(p.steps[k])return false;p.steps[k]=Date.now();p.updated=Date.now();addXP(xp,m.id);logEvent(k,m.id,enTitle(m));maybeComplete(m);save();$$('.steps button').forEach(b=>{if(b.textContent.trim()===STEPS.find(s=>s[0]===k)[1])b.classList.add('ok')});return true}
function maybeComplete(m){const p=P(m.id);if(p.status!=='completed'&&p.steps.learn&&p.steps.lab&&p.steps.test){p.status='completed';p.updated=Date.now();logEvent('complete',m.id,enTitle(m)+' ('+Math.round((p.best||0)*100)+'%)');save();setTimeout(()=>{confetti();toast(`✅ <b>Mission complete:</b> ${esc(m.title)}`)},300)}}
function stepLearn(box,m){let i=0;const n=m.cards.length;
  const draw=()=>{const c=m.cards[i];box.innerHTML=`<div class="card concept"><div class="eyebrow">Concept ${i+1} of ${n}</div><h3 style="margin-top:4px">${c.h}</h3><div>${c.b}</div>${c.en?enT(c.en.h,c.en.b):''}</div><div class="dots">${m.cards.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><div class="ctl"><button class="sbtn alt" id="prv" ${i?'':'disabled'}>← Back</button><span class="spacer"></span>${i<n-1?'<button class="sbtn" id="nxt">Next →</button>':'<button class="sbtn gold" id="fin">Add to review deck & go to the lab →</button>'}</div>`;
    $('#prv',box).onclick=()=>{i--;draw()};const nx=$('#nxt',box);if(nx)nx.onclick=()=>{i++;draw();box.scrollIntoView({block:'start'})};const f=$('#fin',box);if(f)f.onclick=()=>{addCards(m);markStep(m,'learn',10);go('#/m/'+m.id+'/lab')}};draw()}
function stepLab(box,m){box.innerHTML=`<div class="card"><div class="eyebrow">Lab</div><h3 style="margin-top:4px">${esc(m.lab.name)}</h3><p class="note">${m.lab.intro||''}</p><div id="labBox"></div></div><div class="ctl"><span class="spacer"></span><button class="sbtn alt" onclick="go('#/m/${m.id}/test')">Go to the test →</button></div>`;
  const fn=LABS[m.lab.key];const lb=$('#labBox',box);if(!fn){lb.innerHTML='<p class="note">Lab not found.</p>';return}
  fn(lb,m,()=>{if(markStep(m,'lab',20))toast('🧪 Lab complete +20 XP')})}
function stepTest(box,m){const qs=m.quiz;let i=0,ok=0;const ans=[];
  const draw=()=>{if(i>=qs.length){const sc=ok/qs.length;const p=P(m.id);p.attempts=(p.attempts||0)+1;const first=!p.steps.test;const gain=Math.round(40*sc)-(first?0:Math.round(40*(p.best||0)));if(sc>(p.best||0))p.best=sc;
      box.innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">Result</div><div class="big" style="font-size:2.6rem">${ok}/${qs.length}</div><p>${sc>=.85?'Excellent. You own this.':sc>=.67?'Solid. Review the explanations you missed.':'Worth another pass. Revisit the concept cards, then retry.'}</p><div class="ctl" style="justify-content:center"><button class="sbtn alt" id="again">Retry</button><button class="sbtn" onclick="go('#/m/${m.id}/reflect')">Reflect →</button></div></div>`;
      $('#again',box).onclick=()=>{i=0;ok=0;draw()};if(m.cr)crPractice(box,m);
      if(first){markStep(m,'test',Math.round(40*sc))}else{if(gain>0)addXP(gain,m.id);logEvent('retest',m.id,Math.round(sc*100)+'%');save()}if(sc>=1)checkBadges();return}
    const q0=qs[i],pm=perm(q0.o.length),q={q:q0.q,w:q0.w,o:pm.map(k=>q0.o[k]),a:pm.indexOf(q0.a)};box.innerHTML=`<div class="card">${q0.stem?`<details ${i===0||qs[i-1].stem!==q0.stem?'open':''} class="exhibit" style="margin-bottom:10px"><summary><b>Item set: ${esc(q0.setT||'Vignette')}</b> <span class="note">(tap to show or hide)</span></summary><div class="casebody" style="margin-top:6px">${q0.stem}</div></details>`:''}<div class="row"><div class="eyebrow">Question ${i+1} of ${qs.length}</div><span class="spacer"></span><small class="muted">${ok} correct</small></div><h3 style="margin-top:6px;font-family:var(--sans);font-size:1.02rem">${q.q}</h3>${q0.en?enT('',q0.en.q+'<ul>'+q0.en.o.map(x=>'<li>'+x+'</li>').join('')+'</ul>'):''}<div id="opts">${q.o.map((o,j)=>`<button class="qopt" data-j="${j}">${o}</button>`).join('')}</div><div id="why"></div></div>`;
    $$('.qopt',box).forEach(b=>b.onclick=()=>{const j=+b.dataset.j;const r=j===q.a;if(r)ok++;logEvent('quiz',m.id,(r?'✓ ':'✗ ')+String(q.q).replace(/<[^>]+>/g,'').slice(0,60));$$('.qopt',box).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
      $('#why',box).innerHTML=`<div class="readout ${r?'ok':'bad'}"><b>${r?'Correct.':'Not quite.'}</b> ${q.w}</div>${q0.en?enT('',q0.en.w):''}<div class="ctl"><span class="spacer"></span><button class="sbtn" id="nq">${i<qs.length-1?'Next question →':'See result'}</button></div>`;$('#nq',box).onclick=()=>{i++;draw()};reveal($('#nq',box))})};draw()}
function crPractice(box,m){const d=document.createElement('div');d.innerHTML=`<div class="card"><div class="eyebrow">Constructed response</div><h3 style="margin-top:4px">Write it, then mark it</h3><p class="note">Level III rewards short, precise, justified answers. Write as you would on the exam, then reveal the model answer and tick the points you earned.</p>${m.cr.map((c,k)=>`<div style="margin:14px 0;padding-top:10px;border-top:1px solid var(--line)"><p><b>${k+1}. ${c.q}</b> <span class="pill">${c.pts.length} points</span></p><textarea data-ca="${k}" style="min-height:120px" placeholder="Your answer…"></textarea><div class="ctl"><button class="sbtn alt" data-show="${k}">Show model answer</button></div><div data-mod="${k}" hidden><div class="model"><b>Model answer.</b> ${c.model}</div><div class="rubric">${c.pts.map((p2,j)=>`<label><input type="checkbox" data-sc="${k}"><span>${p2}</span></label>`).join('')}</div><div class="note" data-tot="${k}"></div></div></div>`).join('')}</div>`;box.appendChild(d);
  $$('[data-show]',d).forEach(b=>b.onclick=()=>{const k=b.dataset.show;$(`[data-mod="${k}"]`,d).hidden=false;b.remove();logEvent('cr',m.id,'Constructed response attempted')});
  $$('[data-sc]',d).forEach(x=>x.onchange=()=>{const k=x.dataset.sc,all=$$(`[data-sc="${k}"]`,d),n=all.filter(y=>y.checked).length;$(`[data-tot="${k}"]`,d).textContent=`Self-score: ${n} of ${all.length}`})}
function stepRead(box,m){box.innerHTML=`<div class="card reading"><h3>Reading list</h3><p class="note">Short, high-yield sources. Some HBR articles need a subscription; the library or a free monthly article usually covers it.</p>${m.read.map(r=>`<a href="${r.u}" ${r.u.startsWith('#')?'':'target="_blank" rel="noopener"'}><b>${esc(r.t)}</b><small class="muted">${esc(r.s)}${r.n?' · '+esc(r.n):''}</small></a>`).join('')}</div>`}

/* ---------- spaced repetition (Leitner, 7 boxes) ---------- */
const IVL=[0,1,3,7,14,30,60];
function addCards(m){(m.srs||[]).forEach((c,i)=>{const k=m.id+'-'+i;if(!state.srs[k])state.srs[k]={b:0,due:Date.now()}});save()}
function cardOf(k){const [id,i]=k.split('-');const m=M[id];return m&&m.srs&&m.srs[+i]?{m,c:m.srs[+i]}:null}
function dueCards(){const now=Date.now();return Object.keys(state.srs||{}).filter(k=>state.srs[k].due<=now&&cardOf(k))}
function vReview(){const q=dueCards().sort(()=>Math.random()-.5);const total=Object.keys(state.srs).length;let i=0,n=0;
  const draw=()=>{if(i>=q.length){view().innerHTML=`<h1>Review</h1><div class="card" style="text-align:center"><div class="big">${n?'Done for now ✓':'Nothing due'}</div><p class="note">${n?`You reviewed ${n} card${n===1?'':'s'}. `:''}${total} cards in your deck. ${total?'Next due: '+nextDue():'Finish a mission’s concept cards to add some.'}</p></div>${deckTable()}`;renderTop();return}
    const {m,c}=cardOf(q[i]);view().innerHTML=`<h1>Review</h1><p class="note">${q.length-i} left · Leitner spacing: 1, 3, 7, 14, 30, 60 days</p><div class="card flash"><div class="eyebrow">${esc(m.title)}</div><div class="q" style="margin-top:8px">${c.q}</div><div class="a hide" id="ans">${c.a}${c.en?enT(c.en.q,'<br>'+c.en.a):''}</div></div><div class="ctl" id="rc"><button class="sbtn" id="show" style="flex:1">Show answer</button></div>`;
    $('#show').onclick=()=>{$('#ans').classList.remove('hide');$('#rc').innerHTML=[['Again',0],['Hard',1],['Good',2],['Easy',3]].map(([t,g])=>`<button class="sbtn ${g===2?'':'alt'}" style="flex:1" data-g="${g}">${t}</button>`).join('');$$('#rc button').forEach(b=>b.onclick=()=>{grade(q[i],+b.dataset.g);n++;i++;draw()})}};draw()}
function grade(k,g){const s=state.srs[k];if(g===0){s.b=0;s.due=Date.now()+10*60e3}else{s.b=Math.max(1,Math.min(6,s.b+(g===1?0:g===2?1:2)));s.due=Date.now()+IVL[s.b]*DAY*(g===1?.6:1)}state.reviews=(state.reviews||0)+1;logEvent('review',k.split('-')[0],['Again','Hard','Good','Easy'][g]);addXP(2)}
function nextDue(){const ds=Object.values(state.srs).map(s=>s.due).filter(d=>d>Date.now()).sort((a,b)=>a-b);return ds.length?new Date(ds[0]).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'}):'—'}
function deckTable(){const by={};Object.entries(state.srs).forEach(([k,s])=>{by[s.b]=(by[s.b]||0)+1});if(!Object.keys(by).length)return'';return`<div class="card"><h3>Your deck by box</h3><div class="grid g4 g2m">${IVL.map((d,b)=>`<div class="stat"><small>Box ${b} · ${d?d+' d':'new'}</small><b>${by[b]||0}</b></div>`).join('')}</div></div>`}

/* ---------- weekly goals ---------- */
const GDEF={missions:2,reviews:30,minutes:180,actions:3};
function goalsOf(wk){wk=wk||weekKey();if(!state.goals[wk]){const prev=Object.keys(state.goals).sort().pop();state.goals[wk]={t:Object.assign({},GDEF,prev?state.goals[prev].t:{}),items:[]}}return state.goals[wk]}
function weekProgress(){const ws=weekStart(),g=goalsOf();const L=(state.log||[]).filter(l=>l.t>=ws);let mins=0;Object.entries(state.mins||{}).forEach(([d,s])=>{if(new Date(d+'T12:00').getTime()>=ws)mins+=s/60});
  return{g,v:{missions:L.filter(l=>l.type==='complete').length,reviews:L.filter(l=>l.type==='review').length,minutes:Math.round(mins),actions:L.filter(l=>['apply','outreach'].includes(l.type)).length}}}
const GN={missions:'Missions completed',reviews:'Cards reviewed',minutes:'Minutes of focused study',actions:'Career actions (applications, outreach)'};
function goalBars(w){const keys=Object.keys(GN);const all=keys.every(k=>w.v[k]>=w.g.t[k]);if(all&&!FOLLOW&&!state.badges.goals){state.badges.goals=Date.now();setTimeout(()=>{confetti();toast('✅ All weekly targets hit!')},500);save()}
  return keys.map(k=>`<div style="margin:8px 0"><div class="row" style="font-size:.88rem"><span>${GN[k]}</span><span class="spacer"></span><b>${w.v[k]} / ${w.g.t[k]}</b></div><div class="prog"><i style="width:${Math.min(100,w.v[k]/Math.max(1,w.g.t[k])*100)}%"></i></div></div>`).join('')+(w.g.items.length?`<small class="muted">${w.g.items.filter(x=>x.done).length}/${w.g.items.length} personal goals done</small>`:'')}
function vGoals(){const w=weekProgress(),g=w.g;
  view().innerHTML=`<a href="#/more" class="note">← More</a><h1>Weekly goals</h1><p class="note">Week of ${new Date(weekStart()).toLocaleDateString('en-GB',{day:'numeric',month:'long'})}. Targets carry forward to next week.</p>
  <div class="card"><h3>Progress</h3>${goalBars(w)}</div>
  <div class="card"><h3>Targets</h3><div class="grid g2">${Object.keys(GN).map(k=>`<div><label class="f">${GN[k]}</label><input class="tin" type="number" min="0" inputmode="numeric" data-k="${k}" value="${g.t[k]}"></div>`).join('')}</div></div>

function advBrief(s){const out={flags:[],moves:[],lines:[]};const now=Date.now();const log=s.log||[];const last=log.length?log[log.length-1].t:0;const days=last?Math.floor((now-last)/DAY):null;
  const act7=new Set(log.filter(l=>l.t>now-7*DAY).map(l=>dkey(l.t))).size;out.lines.push(`Active on <b>${act7}</b> of the last 7 days${last?`; last seen ${days===0?'today':days===1?'yesterday':days+' days ago'}`:''}.`);
  const c=s.compass;const R=c&&c.done?compassScore(c):null;
  if(R){const t=R.rank;out.lines.push(`Compass top paths: <b>${esc(PATH[t[0]].name)}</b> (${R.paths[t[0]].fit}), ${esc(PATH[t[1]].name)} (${R.paths[t[1]].fit}), ${esc(PATH[t[2]].name)} (${R.paths[t[2]].fit}).`);
